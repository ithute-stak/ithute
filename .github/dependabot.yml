version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Maseru
    open-pull-requests-limit: 5
    groups:
      python-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Africa/Maseru
    open-pull-requests-limit: 5
    groups:
      frontend-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3


  - package-ecosystem: docker
    directory: /apps/backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /platform/ithute-auth
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /platform/ithute-push
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /platform/ithute-realtime
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Africa/Maseru
    open-pull-requests-limit: 3
