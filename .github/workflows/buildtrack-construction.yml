name: BuildTrack Construction

on:
  push:
    branches: ['**']
    paths:
      - 'products/buildtrack-construction/**'
      - 'docker-compose.buildtrack.yml'
      - 'scripts/buildtrack-*.py'
      - 'scripts/buildtrack-*.sh'
      - 'infrastructure/ithute-edge/default.conf.template'
      - '.github/workflows/buildtrack-construction*.yml'
  pull_request:
    paths:
      - 'products/buildtrack-construction/**'
      - 'docker-compose.buildtrack.yml'
      - 'scripts/buildtrack-*.py'
      - 'scripts/buildtrack-*.sh'
      - 'infrastructure/ithute-edge/default.conf.template'
      - '.github/workflows/buildtrack-construction*.yml'
  workflow_dispatch:

concurrency:
  group: buildtrack-construction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI, Alembic and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buildtrack_test
          POSTGRES_USER: buildtrack_test
          POSTGRES_PASSWORD: buildtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildtrack_test -d buildtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: products/buildtrack-construction/apps/backend
    env:
      ENVIRONMENT: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: buildtrack_test
      DB_USER: buildtrack_test
      DB_PASSWORD: buildtrack_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PUBLIC_APP_URL: http://localhost:3004
      CORS_ORIGINS: http://localhost:3004
      LEGACY_AUTH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            products/buildtrack-construction/apps/backend/requirements.txt
            products/buildtrack-construction/apps/backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app scripts
      - name: Validate one migration head
        run: |
          set -eu
          heads="$(alembic heads | wc -l | tr -d ' ')"
          test "$heads" = "1" || { alembic heads; echo "Expected exactly one Alembic head" >&2; exit 1; }
          alembic upgrade head
          alembic current
      - name: Run backend regression suite
        run: pytest -q

  frontend:
    name: Next.js typecheck, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: products/buildtrack-construction/apps/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/buildtrack-construction/apps/frontend/package-lock.json
      - name: Install exact frontend dependency graph
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  deployment-contract:
    name: Docker and Ithute deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITHUTE_BUILDTRACK_DB_PASSWORD: test-only-not-production
      ITHUTE_BUILDTRACK_PUSH_SERVICE_CLIENT_SECRET: test-only-not-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate standalone development Compose
        run: docker compose -f products/buildtrack-construction/compose.yaml config >/dev/null
      - name: Validate shared-platform BuildTrack Compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ithute-platform.yml \
            -f docker-compose.buildtrack.yml \
            config >/dev/null
      - name: Validate production registration scripts
        run: |
          python3 -m py_compile scripts/buildtrack-sync-env.py
          grep -Fq 'nbro.ithute.co.ls' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'buildtrack-construction' docker-compose.buildtrack.yml
