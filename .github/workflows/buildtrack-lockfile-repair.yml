name: Repair BuildTrack Frontend Lockfile

on:
  push:
    branches:
      - feature/buildtrack-ithute-production
    paths:
      - 'products/buildtrack-construction/apps/frontend/package.json'
      - 'products/buildtrack-construction/apps/frontend/package-lock.json'
      - '.github/workflows/buildtrack-lockfile-repair.yml'
  workflow_dispatch:

concurrency:
  group: buildtrack-lockfile-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/buildtrack-construction/apps/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/buildtrack-ithute-production
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/buildtrack-construction/apps/frontend/package-lock.json
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile when needed
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- products/buildtrack-construction/apps/frontend/package-lock.json; then
            echo 'BuildTrack frontend lockfile is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/buildtrack-construction/apps/frontend/package-lock.json
          git commit -m 'chore(buildtrack): synchronize frontend lockfile'
          git push origin HEAD:feature/buildtrack-ithute-production
