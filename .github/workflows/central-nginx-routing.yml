name: Central Nginx Routing Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/nginx/default.conf'
      - '.github/workflows/central-nginx-routing.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/nginx/default.conf'
      - '.github/workflows/central-nginx-routing.yml'

permissions:
  contents: read

jobs:
  routing-contract:
    name: Docker DNS survives central service recreation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify dynamic central upstreams
        shell: bash
        run: |
          set -euo pipefail
          conf='infrastructure/nginx/default.conf'

          grep -Fq 'resolver 127.0.0.11' "$conf"
          grep -Fq 'set $ithute_auth_upstream http://ithute-auth:8080;' "$conf"
          grep -Fq 'proxy_pass $ithute_auth_upstream;' "$conf"
          grep -Fq 'set $ithute_push_upstream http://ithute-push:8080;' "$conf"
          grep -Fq 'proxy_pass $ithute_push_upstream;' "$conf"
          grep -Fq 'set $ithute_realtime_upstream http://ithute-realtime:8080;' "$conf"
          test "$(grep -Fc 'proxy_pass $ithute_realtime_upstream;' "$conf")" -eq 2

          if grep -Eq 'proxy_pass[[:space:]]+http://ithute-(auth|push|realtime):' "$conf"; then
            echo '::error::Central services must not use static Docker addresses in Nginx proxy_pass.'
            exit 1
          fi

          echo 'Central Auth, Push and Realtime use request-time Docker DNS resolution.'
