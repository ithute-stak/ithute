name: Ithute Standalone CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate restored frontend
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Validate restored backend source
        working-directory: apps/backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q app alembic

      - name: Validate deployment scripts
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-vps.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/deploy-production-manual.sh
          bash -n scripts/bootstrap-mail.sh
          bash -n mail/renew-tls.sh
          python3 -m py_compile scripts/verify-authoritative-dns.py

      - name: Enforce runtime-only VPS deployment boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_targets = [
              Path('.github/workflows/fresh-cutover.yml'),
              Path('.github/workflows/release-images.yml'),
              Path('.github/workflows/finalize-dns-cutover.yml'),
              Path('.github/workflows/finalize-mail.yml'),
              Path('scripts/bootstrap-vps.sh'),
              Path('scripts/deploy-production.sh'),
              Path('scripts/deploy-production-manual.sh'),
              Path('scripts/bootstrap-mail.sh'),
              Path('mail/renew-tls.sh'),
          ]
          forbidden = {
              'global container wipe': 'docker ps -aq',
              'global image wipe': 'docker image ls -aq',
              'global volume wipe': 'docker volume ls -q',
              'global network prune': 'docker network prune',
              'global builder prune': 'docker builder prune',
              'global system prune': 'docker system prune',
              'VPS source clone': 'git clone',
              'VPS source fetch': 'git fetch',
              'VPS source reset': 'git reset --hard',
          }

          failures = []
          for path in runtime_targets:
              text = path.read_text(encoding='utf-8')
              for label, needle in forbidden.items():
                  if needle in text:
                      failures.append(f'{path}: {label} ({needle})')

          compose = Path('compose.production.yml').read_text(encoding='utf-8')
          if '\n    build:' in compose or '\n      build:' in compose:
              failures.append('Production compose must not contain application build contexts.')
          for image in ('ithute-web:', 'ithute-app-api:', 'ithute-auth:', 'ithute-push:', 'ithute-realtime:'):
              if f'image: {image}' not in compose:
                  failures.append(f'Missing immutable runtime image declaration for {image}')
          if 'image: powerdns/pdns-auth-49:4.9.17' not in compose:
              failures.append('Production compose must use the managed PowerDNS authoritative service.')
          if 'POWERDNS_API_URL: http://ithute-dns:8081/api/v1' not in compose:
              failures.append('Restored app API must use the internal PowerDNS service URL.')
          if 'ithute_powerdns_data:/var/lib/powerdns' not in compose:
              failures.append('PowerDNS must use persistent authoritative data storage.')

          release = Path('.github/workflows/release-images.yml').read_text(encoding='utf-8')
          manual = Path('scripts/deploy-production-manual.sh').read_text(encoding='utf-8')
          if 'packages: write' not in release:
              failures.append('Release Images must have packages: write permission.')
          if 'Production Safety CI' not in release or 'Ithute Standalone CI' not in release:
              failures.append('Release Images must require both production CI gates.')
          if 'ghcr.io/' not in release:
              failures.append('Release Images must publish to GHCR.')
          if ':latest' in release or ':latest' in manual:
              failures.append('Mutable latest image tags are forbidden for Ithute production.')
          if 'ssh ' in release or 'scp ' in release or 'VPS_HOST' in release or 'VPS_SSH' in release:
              failures.append('Release Images must never connect to or mutate the production VPS.')
          if '/home/administrator/ithute-platform' not in manual:
              failures.append('Manual production helper must be pinned to the established Ithute app directory.')
          if 'raw.githubusercontent.com/ithute-stak/ithute' not in manual:
              failures.append('Manual helper must fetch SHA-pinned runtime configuration from the Ithute repository.')
          if 'scripts/deploy-production.sh' not in manual:
              failures.append('Manual helper must reuse the rollback-safe deployment engine.')
          if 'apps/' in manual or 'platform/' in manual:
              failures.append('Manual VPS helper must not download application source directories.')

          if failures:
              raise SystemExit('Unsafe or invalid production release automation:\n' + '\n'.join(failures))
          PY

          test ! -e .github/workflows/deploy-production.yml
          grep -Fq 'group: ithute-release-images' .github/workflows/release-images.yml
          grep -Fq '/home/administrator/ithute-platform' scripts/deploy-production-manual.sh
          grep -Fq 'Production is already running release' scripts/deploy-production-manual.sh
          grep -Fq 'compose up -d --no-build' scripts/deploy-production.sh
          grep -Fq 'rollback_to_last_good' scripts/deploy-production.sh
          grep -Fq '.last-known-good.env' scripts/deploy-production.sh
          grep -Fq '.last-known-good-runtime.tgz' scripts/deploy-production.sh
          ! grep -Eq '^[[:space:]]*(compose|docker compose).*--remove-orphans' scripts/deploy-production.sh
          grep -Fq 'caddy reload --config /etc/caddy/Caddyfile' scripts/deploy-production.sh
          ! grep -Fq 'compose build' scripts/deploy-production.sh
          ! grep -Fq 'docker compose build' scripts/deploy-production.sh
          test -d apps/backend
          test -f apps/frontend/app/dashboard/page.tsx
          test -f apps/frontend/app/pricing/page.tsx
          test -f apps/frontend/app/docs/page.tsx
          test -f apps/frontend/app/webmail/page.tsx

      - name: Render production topology
        env:
          ITHUTE_IMAGE_TAG: 0000000000000000000000000000000000000000
          ITHUTE_PUBLIC_IPV4: 204.12.205.224
          ITHUTE_APP_DB_PASSWORD: ci-app-db-password-000000000000
          ITHUTE_APP_SECRET_KEY: ci-app-secret-000000000000000000000000000000000000
          ITHUTE_APP_DKIM_ENCRYPTION_KEY: ci-dkim-secret-1111111111111111111111111111111111
          ITHUTE_APP_BILLING_WEBHOOK_SECRET: ci-billing-secret-22222222222222222222222222222222
          ITHUTE_APP_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-owner-password-123456
          ITHUTE_APP_MAIL_OPS_TOKEN: ci-mail-ops-token-333333333333333333333333
          ITHUTE_APP_RECOVERY_OPS_TOKEN: ci-recovery-token-44444444444444444444444
          ITHUTE_APP_POWERDNS_API_KEY: ci-powerdns-token-55555555555555555555555
          ITHUTE_AUTH_DB_PASSWORD: ci-auth-db-password
          ITHUTE_PUSH_DB_PASSWORD: ci-push-db-password
          ITHUTE_REALTIME_DB_PASSWORD: ci-realtime-db-password
          ITHUTE_AUTH_TOTP_ENCRYPTION_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
          ITHUTE_PUSH_ENDPOINT_ENCRYPTION_KEY: eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXk=
          ITHUTE_SERVICE_REALTIME_SECRET: ci-realtime-service-secret-0000000000000000
          ITHUTE_SYSTEM_OWNER_PASSWORD: ci-owner-password-12345
          ITHUTE_AUTH_SERVICE_CLIENT_SECRETS_JSON: '{"ithute-realtime":"ci-realtime-service-secret-0000000000000000"}'
          ITHUTE_AUTH_REDIRECT_URIS_JSON: '{"mailbox-dns":["https://ithute.co.ls/api/v1/auth/ithute/callback"]}'
        run: |
          set -euo pipefail
          docker compose -f compose.production.yml config > /tmp/ithute-production.yml
          grep -q 'ithute-app-api:' /tmp/ithute-production.yml
          grep -q 'ithute-app-db:' /tmp/ithute-production.yml
          grep -q 'ithute-app-redis:' /tmp/ithute-production.yml
          grep -q 'ithute-web:' /tmp/ithute-production.yml
          grep -q 'ithute-auth:' /tmp/ithute-production.yml
          grep -q 'ithute-push:' /tmp/ithute-production.yml
          grep -q 'ithute-realtime:' /tmp/ithute-production.yml
          grep -q 'ithute-dns:' /tmp/ithute-production.yml
          grep -Fq 'powerdns/pdns-auth-49:4.9.17' /tmp/ithute-production.yml
          grep -Fq 'http://ithute-dns:8081/api/v1' /tmp/ithute-production.yml
          grep -q 'caddy:' /tmp/ithute-production.yml
          grep -Fq 'mailbox-dns' /tmp/ithute-production.yml
          grep -Fq '204.12.205.224' /tmp/ithute-production.yml
          ! grep -Eq 'external:[[:space:]]*true' /tmp/ithute-production.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-production.yml

      - name: Validate Ithute ingress
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
          grep -Fq 'reverse_proxy ithute-app-api:8000' infrastructure/caddy/Caddyfile
          grep -Fq 'reverse_proxy ithute-web:3000' infrastructure/caddy/Caddyfile
          grep -Fq 'auth.ithute.co.ls' infrastructure/caddy/Caddyfile
          grep -Fq 'push.ithute.co.ls' infrastructure/caddy/Caddyfile
          grep -Fq 'realtime.ithute.co.ls' infrastructure/caddy/Caddyfile

      - name: Validate PowerDNS authoritative seed
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/infrastructure/dns/zones/db.ithute.co.ls:/seed/db.ithute.co.ls:ro" \
            --entrypoint /bin/sh \
            powerdns/pdns-auth-49:4.9.17 \
            -ec 'pdnsutil load-zone ithute.co.ls /seed/db.ithute.co.ls; pdnsutil check-zone ithute.co.ls; pdnsutil list-zone ithute.co.ls | grep -q "ns1.ithute.co.ls"'
          grep -Eq '^@ +IN +NS +ns1\.ithute\.co\.ls\.$' infrastructure/dns/zones/db.ithute.co.ls
          grep -Eq '^@ +IN +NS +ns2\.ithute\.co\.ls\.$' infrastructure/dns/zones/db.ithute.co.ls
          grep -Eq '^ns1 +IN +A +204\.12\.205\.224$' infrastructure/dns/zones/db.ithute.co.ls
          grep -Eq '^ns2 +IN +A +204\.12\.205\.224$' infrastructure/dns/zones/db.ithute.co.ls

      - name: Validate private mail topology
        run: |
          set -euo pipefail
          docker compose -f mail/compose.yml config > /tmp/ithute-mail.yml
          python3 - <<'PY'
          import yaml

          with open('/tmp/ithute-mail.yml', encoding='utf-8') as handle:
              config = yaml.safe_load(handle)

          services = config.get('services') or {}
          mailserver = services.get('mailserver') or {}
          if mailserver.get('container_name') != 'ithute-mail':
              raise SystemExit('Mail topology must keep the dedicated ithute-mail container.')

          ports = {str(item.get('published')) for item in mailserver.get('ports', []) if isinstance(item, dict)}
          expected_ports = {'25', '465', '587', '993'}
          if ports != expected_ports:
              raise SystemExit(f'Mail topology must publish exactly {sorted(expected_ports)}; got {sorted(ports)}')

          networks = config.get('networks') or {}
          external = {key: value for key, value in networks.items() if isinstance(value, dict) and value.get('external') is True}
          if set(external) != {'ithute-platform'}:
              raise SystemExit(f'Only the controlled Ithute platform bridge may be external; got {sorted(external)}')
          if external['ithute-platform'].get('name') != 'ithute_ithute':
              raise SystemExit('Mail must attach to the exact production Ithute network ithute_ithute.')
          if (networks.get('mail') or {}).get('external') is True:
              raise SystemExit('The dedicated mail network must remain private and Compose-managed.')

          service_networks = mailserver.get('networks') or {}
          if set(service_networks) != {'mail', 'ithute-platform'}:
              raise SystemExit('Mailserver must attach only to its private mail network and the Ithute application network.')
          aliases = (service_networks.get('ithute-platform') or {}).get('aliases') or []
          if aliases != ['mail.ithute.co.ls']:
              raise SystemExit('The Ithute application network must expose only the TLS-valid mail.ithute.co.ls alias.')
          PY

      - name: Build immutable Ithute images on GitHub runner
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA"
          docker build --pull --target runner \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            -t "ithute-web:$tag" ./apps/frontend
          docker build --pull -t "ithute-app-api:$tag" ./apps/backend
          docker build --pull -t "ithute-auth:$tag" ./platform/ithute-auth
          docker build --pull -t "ithute-push:$tag" ./platform/ithute-push
          docker build --pull -t "ithute-realtime:$tag" ./platform/ithute-realtime
          docker image inspect "ithute-web:$tag" >/dev/null
          docker image inspect "ithute-app-api:$tag" >/dev/null
          docker image inspect "ithute-auth:$tag" >/dev/null
          docker image inspect "ithute-push:$tag" >/dev/null
          docker image inspect "ithute-realtime:$tag" >/dev/null
