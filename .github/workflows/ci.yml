name: Ithute Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: apps/frontend
        run: npm run check

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Build production image
        run: docker build --target runner -t ithute-web-ci ./apps/frontend

      - name: Verify production image health endpoint
        run: |
          set -eu
          docker run -d --rm --name ithute-web-ci -p 127.0.0.1:3300:3000 ithute-web-ci
          cleanup() { docker rm -f ithute-web-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/health | grep -Fq 'ithute-web'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ithute-web-ci
          exit 1

      - name: Validate shared edge topology
        env:
          ITHUTE_WEB_IMAGE_TAG: ci
        run: |
          set -eu
          docker compose -f docker-compose.ithute-edge.yml config > /tmp/ithute-edge.yml
          grep -q 'ithute-web:' /tmp/ithute-edge.yml
          grep -q 'edge-nginx:' /tmp/ithute-edge.yml

          # The public edge owns ingress only. LoanHub remains a separate repo and
          # runtime, reached through the stable aliases its own compose file exports.
          grep -Fq 'set $loanhub_frontend_upstream http://loanhub-frontend:3000;' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'set $loanhub_backend_upstream http://loanhub-backend:8000;' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'server_name ${APP_DOMAIN};' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'server_name ${API_DOMAIN};' infrastructure/ithute-edge/default.conf.template
          grep -q 'loanhub:' docker-compose.ithute-edge.yml
          grep -q 'loanhub_sandbox:' docker-compose.ithute-edge.yml

          # External upstreams must use Docker DNS at request time. A stopped auth,
          # push, realtime, product or sandbox service must not stop Nginx itself.
          grep -Fq 'resolver 127.0.0.11' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'set $ithute_auth_upstream http://ithute-auth:8080;' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'set $ithute_push_upstream http://ithute-push:8080;' infrastructure/ithute-edge/default.conf.template
          grep -Fq 'set $ithute_realtime_upstream http://ithute-realtime:8080;' infrastructure/ithute-edge/default.conf.template
          ! grep -Eq '^[[:space:]]*upstream[[:space:]]+(ithute_auth|ithute_push|ithute_realtime|loanhub_frontend|loanhub_backend)[[:space:]]*\{' infrastructure/ithute-edge/default.conf.template

          # Ithute must never be the fallback host. There is exactly one TLS
          # default server and it is the catch-all 404 block.
          test "$(grep -c 'listen 443 ssl default_server;' infrastructure/ithute-edge/default.conf.template)" -eq 1
          awk '
            /listen 443 ssl default_server;/ { default_seen=1 }
            default_seen && /server_name _;/ { catchall=1 }
            END { exit !(default_seen && catchall) }
          ' infrastructure/ithute-edge/default.conf.template

          # Keep unrelated standalone products out of the Ithute repository edge.
          ! grep -Eiq 'nbros|buildtrack|ithute-pay|mailbox_gateway' infrastructure/ithute-edge/default.conf.template
          grep -q 'ithute_web:' docker-compose.ithute-edge.yml
          grep -q 'ithute_platform:' docker-compose.ithute-edge.yml

      - name: Enforce single-project frontend boundary
        run: |
          set -eu
          test ! -d apps/backend
          test ! -d apps/frontend/components
          test ! -d apps/frontend/lib
          test ! -f product.manifest.yaml
          ! grep -R -Eiq 'Fleet Management starts here|NBros Management Platform|The !thute portfolio|LoanHub|Ithute Tutor|Ithute Pay|Mailbox DNS' apps/frontend/app
