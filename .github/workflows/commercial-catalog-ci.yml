name: Commercial Catalog CI

on:
  pull_request:
    paths:
      - "apps/backend/app/models/billing.py"
      - "apps/backend/app/services/billing.py"
      - "apps/backend/app/api/v1/plan_admin.py"
      - "apps/backend/app/api/v1/public_hosting.py"
      - "apps/backend/alembic/versions/*commercial*.py"
      - "apps/backend/alembic/versions/*overage*.py"
      - "apps/backend/tests/test_plan_catalog.py"
      - "apps/backend/tests/test_metered_overages.py"
      - "apps/backend/tests/test_hosting_metering.py"
      - "apps/backend/tests/test_commercial_ops_v2.py"
      - "apps/frontend/app/billing/**"
      - "apps/frontend/app/packages/**"
      - "apps/frontend/app/pricing/**"
      - "apps/frontend/app/signup/**"
      - "apps/frontend/app/hosting-company/**"
      - ".github/workflows/commercial-catalog-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ithute_catalog_test
          POSTGRES_USER: ithute
          POSTGRES_PASSWORD: ithute-catalog-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute -d ithute_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ithute:ithute-catalog-test-password@127.0.0.1:5432/ithute_catalog_test
      SECRET_KEY: ci-catalog-secret-key-0000000000000000000000000000
      ENVIRONMENT: test
      PLATFORM_MODE: bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate catalog test database
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Run commercial catalog and metering regressions
        working-directory: apps/backend
        run: pytest -q tests/test_plan_catalog.py tests/test_metered_overages.py tests/test_hosting_metering.py tests/test_commercial_ops_v2.py
