name: Database Resilience Chaos CI

on:
  pull_request:
    paths:
      - "apps/backend/app/api/v1/shared_hosting.py"
      - "apps/backend/app/models/shared_hosting.py"
      - "apps/backend/app/models/infrastructure.py"
      - "apps/backend/app/services/database_replication.py"
      - "apps/backend/app/services/external_fencing.py"
      - "apps/backend/app/services/postgres_*.py"
      - "apps/backend/app/services/database_gateway_ha.py"
      - "apps/backend/app/services/hosting_node_health_daemon.py"
      - "apps/backend/alembic/versions/00*_pg_*.py"
      - "apps/backend/tests/test_database_replication.py"
      - "apps/backend/tests/test_database_failover_orchestration_contract.py"
      - "apps/backend/tests/test_external_fencing_contract.py"
      - "apps/backend/tests/test_postgres_*.py"
      - "apps/backend/tests/test_database_gateway_ha.py"
      - "engines/go-worker/cmd/db-router/**"
      - "engines/go-worker/Dockerfile.db-router"
      - ".github/workflows/database-resilience-chaos-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  postgres-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ithute_resilience_test
          POSTGRES_USER: ithute
          POSTGRES_PASSWORD: ithute-resilience-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute -d ithute_resilience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ithute:ithute-resilience-test-password@127.0.0.1:5432/ithute_resilience_test
      SECRET_KEY: ci-resilience-secret-key-00000000000000000000000000
      ENVIRONMENT: test
      PLATFORM_MODE: bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate resilience test database
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Run PostgreSQL resilience suite
        working-directory: apps/backend
        run: >-
          pytest -q
          tests/test_database_replication.py
          tests/test_database_failover_orchestration_contract.py
          tests/test_external_fencing_contract.py
          tests/test_postgres_replica_telemetry.py
          tests/test_postgres_replication_groups.py
          tests/test_postgres_group_failover_execution_contract.py
          tests/test_postgres_topology_repair_contract.py
          tests/test_postgres_rpo_policy.py
          tests/test_postgres_rto_slo.py
          tests/test_postgres_stable_endpoints.py
          tests/test_postgres_stable_endpoint_contract.py
          tests/test_database_gateway_ha.py
          tests/test_alembic_single_head.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: engines/go-worker/go.mod

      - name: Run Go router race and chaos tests
        working-directory: engines/go-worker
        run: go test -race -count=3 ./cmd/db-router

      - name: Build hardened database router image
        run: docker build -f engines/go-worker/Dockerfile.db-router -t ithute-db-router:chaos-ci engines/go-worker
