name: Deploy Ithute Production

on:
  workflow_run:
    workflows: ["Ithute Standalone CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      EXPECTED_IPV4: 204.12.205.224

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Download tested Docker images from CI
        uses: actions/download-artifact@v4
        with:
          name: ithute-images-${{ env.DEPLOY_SHA }}
          path: /tmp/ithute-images
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify image artifact
        run: |
          set -euo pipefail
          cd /tmp/ithute-images
          test -f "ithute-images-${DEPLOY_SHA}.tar.gz"
          test -f "ithute-images-${DEPLOY_SHA}.sha256"
          sha256sum -c "ithute-images-${DEPLOY_SHA}.sha256"

      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Require completed bootstrap
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          if ! ssh "$remote" "test -f '$VPS_APP_DIR/.ithute-bootstrapped' && test -f '$VPS_APP_DIR/.env.production'"; then
            echo 'Ithute production is not bootstrapped in the runtime directory.' >&2
            echo 'Run Safe Ithute VPS Bootstrap before routine deployment.' >&2
            exit 1
          fi

      - name: Build runtime-only configuration bundle
        run: |
          set -euo pipefail
          tar -czf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            compose.production.yml \
            infrastructure/caddy/Caddyfile
          ! tar -tzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" | grep -Eq '^(apps|platform)/'

      - name: Transfer and load GitHub-built images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-images/ithute-images-${DEPLOY_SHA}.tar.gz" "$remote:/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          ssh "$remote" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          test -s "$archive"
          gzip -dc "$archive" | docker load
          rm -f "$archive"
          docker image inspect "ithute-web:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-auth:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-push:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-realtime:$DEPLOY_SHA" >/dev/null
          REMOTE

      - name: Upload runtime config and start images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-runtime-${DEPLOY_SHA}.tgz"
          scp scripts/deploy-production.sh "$remote:/tmp/ithute-deploy-production.sh"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/infrastructure/caddy"
          tar -xzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          chmod 700 /tmp/ithute-deploy-production.sh
          ITHUTE_APP_DIR="$APP_DIR" ITHUTE_IMAGE_TAG="$DEPLOY_SHA" bash /tmp/ithute-deploy-production.sh
          printf '%s\n' "$DEPLOY_SHA" > "$APP_DIR/.deployed-sha"
          chmod 600 "$APP_DIR/.deployed-sha"
          rm -f "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" /tmp/ithute-deploy-production.sh
          REMOTE

      - name: Verify internal health and image-only runtime
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test "$(cat .deployed-sha)" = "$DEPLOY_SHA"
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .image.env
          compose() {
            docker compose \
              --env-file .env.production \
              --env-file .image.env \
              -p ithute \
              -f compose.production.yml \
              "$@"
          }
          compose config > /tmp/ithute-runtime-compose.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-runtime-compose.yml
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null
          compose config --images | grep -Fxq "ithute-web:$DEPLOY_SHA"
          compose config --images | grep -Fxq "ithute-auth:$DEPLOY_SHA"
          compose config --images | grep -Fxq "ithute-push:$DEPLOY_SHA"
          compose config --images | grep -Fxq "ithute-realtime:$DEPLOY_SHA"
          REMOTE

      - name: Verify public Ithute endpoints when DNS is ready
        run: |
          set -euo pipefail
          dns_ready=true
          for host in ithute.co.ls auth.ithute.co.ls push.ithute.co.ls realtime.ithute.co.ls; do
            if ! getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | grep -Fxq "$EXPECTED_IPV4"; then
              dns_ready=false
            fi
          done
          if [ "$dns_ready" != true ]; then
            echo 'Deployment is internally healthy; public DNS is not pointed at the VPS yet, so public verification is deferred.'
            exit 0
          fi
          html="$(curl --retry 12 --retry-delay 3 --retry-all-errors -fsS https://ithute.co.ls/)"
          printf '%s' "$html" | grep -Fq 'One focused platform.'
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://auth.ithute.co.ls/healthz | grep -q ithute-auth
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://push.ithute.co.ls/readyz | grep -q '"status":"ready"'
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://realtime.ithute.co.ls/readyz | grep -q '"status":"ready"'
