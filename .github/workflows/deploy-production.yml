name: Deploy Ithute Production

on:
  workflow_run:
    workflows: ["Ithute Standalone CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      EXPECTED_IPV4: 204.12.205.224
      # Seed the rollback chain from the most recent release that passed every
      # production health check before the 2026-09-16 Auth startup failures.
      BOOTSTRAP_ROLLBACK_SHA: ddd0f1ec78f90132299fbeedabee2dee132f64c0
      BOOTSTRAP_ROLLBACK_RUN_ID: "35084915814"

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Download tested Docker images from CI
        uses: actions/download-artifact@v4
        with:
          name: ithute-images-${{ env.DEPLOY_SHA }}
          path: /tmp/ithute-images
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify candidate image artifact
        run: |
          set -euo pipefail
          cd /tmp/ithute-images
          test -f "ithute-images-${DEPLOY_SHA}.tar.gz"
          test -f "ithute-images-${DEPLOY_SHA}.sha256"
          sha256sum -c "ithute-images-${DEPLOY_SHA}.sha256"

      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Require bootstrap and resolve rollback release
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "test -f '$VPS_APP_DIR/.ithute-bootstrapped' && test -f '$VPS_APP_DIR/.env.production'" || {
            echo 'Ithute production is not bootstrapped in the runtime directory.' >&2
            exit 1
          }

          rollback_tag="$(ssh "$remote" "APP_DIR='$VPS_APP_DIR' SEED='$BOOTSTRAP_ROLLBACK_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          valid_tag() { [[ "${1:-}" =~ ^[0-9a-f]{40}$ ]]; }
          images_present() {
            local tag="$1" image
            for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
              docker image inspect "$image:$tag" >/dev/null 2>&1 || return 1
            done
          }
          stored=""
          if [ -f "$APP_DIR/.last-known-good.env" ]; then
            stored="$(sed -n 's/^ITHUTE_IMAGE_TAG=//p' "$APP_DIR/.last-known-good.env" | tail -n1)"
          fi
          if valid_tag "$stored" && images_present "$stored"; then
            printf '%s\n' "$stored"
          else
            printf '%s\n' "$SEED"
          fi
          REMOTE
          )"
          [[ "$rollback_tag" =~ ^[0-9a-f]{40}$ ]]
          printf 'ROLLBACK_TAG=%s\n' "$rollback_tag" >> "$GITHUB_ENV"

          if ssh "$remote" "TAG='$rollback_tag' bash -s" <<'REMOTE'
          set -euo pipefail
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker image inspect "$image:$TAG" >/dev/null
          done
          REMOTE
          then
            echo 'NEED_ROLLBACK_BUNDLE=0' >> "$GITHUB_ENV"
          else
            # If a stale last-known-good marker points to pruned images, fall
            # back to the bootstrap release and load its retained CI artifact.
            printf 'ROLLBACK_TAG=%s\n' "$BOOTSTRAP_ROLLBACK_SHA" >> "$GITHUB_ENV"
            echo 'NEED_ROLLBACK_BUNDLE=1' >> "$GITHUB_ENV"
          fi

      - name: Download bootstrap rollback images
        if: env.NEED_ROLLBACK_BUNDLE == '1'
        uses: actions/download-artifact@v4
        with:
          name: ithute-images-${{ env.BOOTSTRAP_ROLLBACK_SHA }}
          path: /tmp/ithute-rollback-images
          run-id: ${{ env.BOOTSTRAP_ROLLBACK_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify bootstrap rollback artifact
        if: env.NEED_ROLLBACK_BUNDLE == '1'
        run: |
          set -euo pipefail
          cd /tmp/ithute-rollback-images
          test -f "ithute-images-${BOOTSTRAP_ROLLBACK_SHA}.tar.gz"
          test -f "ithute-images-${BOOTSTRAP_ROLLBACK_SHA}.sha256"
          sha256sum -c "ithute-images-${BOOTSTRAP_ROLLBACK_SHA}.sha256"

      - name: Build runtime-only configuration bundle
        run: |
          set -euo pipefail
          tar -czf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            compose.production.yml \
            infrastructure/caddy/Caddyfile \
            infrastructure/dns/zones/db.ithute.co.ls
          ! tar -tzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" | grep -Eq '^(apps|platform)/'

      - name: Transfer and load candidate and rollback images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-images/ithute-images-${DEPLOY_SHA}.tar.gz" "$remote:/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          if [ "${NEED_ROLLBACK_BUNDLE:-0}" = "1" ]; then
            scp "/tmp/ithute-rollback-images/ithute-images-${BOOTSTRAP_ROLLBACK_SHA}.tar.gz" \
              "$remote:/tmp/ithute-images-${BOOTSTRAP_ROLLBACK_SHA}.tar.gz"
          fi
          ssh "$remote" "DEPLOY_SHA='$DEPLOY_SHA' ROLLBACK_TAG='$ROLLBACK_TAG' BOOTSTRAP='$BOOTSTRAP_ROLLBACK_SHA' NEED_ROLLBACK='${NEED_ROLLBACK_BUNDLE:-0}' bash -s" <<'REMOTE'
          set -euo pipefail
          load_bundle() {
            local tag="$1"
            local archive="/tmp/ithute-images-${tag}.tar.gz"
            test -s "$archive"
            gzip -dc "$archive" | docker load
            rm -f "$archive"
          }
          load_bundle "$DEPLOY_SHA"
          if [ "$NEED_ROLLBACK" = "1" ]; then
            load_bundle "$BOOTSTRAP"
            ROLLBACK_TAG="$BOOTSTRAP"
          fi
          for tag in "$DEPLOY_SHA" "$ROLLBACK_TAG"; do
            for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
              docker image inspect "$image:$tag" >/dev/null
            done
          done
          REMOTE

      - name: Upload runtime config and start candidate safely
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-runtime-${DEPLOY_SHA}.tgz"
          scp scripts/deploy-production.sh "$remote:/tmp/ithute-deploy-production.sh"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' ROLLBACK_TAG='$ROLLBACK_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/infrastructure/caddy" "$APP_DIR/infrastructure/dns/zones"

          # Preserve the previous runtime definition before replacing it. The
          # deployment script also maintains this archive after every healthy
          # release, but this seeds it for installations upgraded from the old
          # deployment mechanism.
          if [ ! -s "$APP_DIR/.last-known-good-runtime.tgz" ] && \
             [ -f "$APP_DIR/.image.env" ] && \
             grep -Fxq "ITHUTE_IMAGE_TAG=$ROLLBACK_TAG" "$APP_DIR/.image.env"; then
            tar -czf "$APP_DIR/.last-known-good-runtime.tgz" -C "$APP_DIR" \
              compose.production.yml \
              infrastructure/caddy/Caddyfile \
              infrastructure/dns/zones/db.ithute.co.ls
            chmod 600 "$APP_DIR/.last-known-good-runtime.tgz"
          fi

          tar -xzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          chmod 700 /tmp/ithute-deploy-production.sh
          set +e
          ITHUTE_APP_DIR="$APP_DIR" \
          ITHUTE_IMAGE_TAG="$DEPLOY_SHA" \
          ITHUTE_FALLBACK_IMAGE_TAG="$ROLLBACK_TAG" \
          ITHUTE_REQUIRE_PUBLIC_HEALTH=1 \
            bash /tmp/ithute-deploy-production.sh
          status=$?
          set -e
          rm -f "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" /tmp/ithute-deploy-production.sh
          exit "$status"
          REMOTE

      - name: Verify internal health and exact running images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .image.env
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .last-known-good.env
          test -s .last-known-good-runtime.tgz
          compose() {
            docker compose \
              --env-file .env.production \
              --env-file .image.env \
              -p ithute \
              -f compose.production.yml \
              "$@"
          }
          compose config > /tmp/ithute-runtime-compose.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-runtime-compose.yml
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-app-api curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
          compose exec -T ithute-app-api python -c 'from app.services.powerdns import PowerDNSClient; zone=PowerDNSClient().get_zone("ithute.co.ls"); assert zone.get("name") == "ithute.co.ls."'
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'

          verify_running_image() {
            service="$1"
            expected="$2"
            container_id="$(compose ps -q "$service")"
            test -n "$container_id"
            actual="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            test "$actual" = "$expected"
          }
          verify_running_image ithute-web "ithute-web:$DEPLOY_SHA"
          verify_running_image ithute-app-api "ithute-app-api:$DEPLOY_SHA"
          verify_running_image ithute-auth "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-auth-push-event-worker "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-push "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-push-worker "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-realtime "ithute-realtime:$DEPLOY_SHA"
          REMOTE

      - name: Verify authoritative DNS on public IPv4
        run: |
          set -euo pipefail
          python3 scripts/verify-authoritative-dns.py \
            --server "$EXPECTED_IPV4" \
            --expected-ip "$EXPECTED_IPV4" \
            --timeout 8

      - name: Verify public application and central SSO
        run: |
          set -euo pipefail
          require_page() {
            label="$1"; url="$2"; expected="$3"
            body="$(curl --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 -fsS "$url")" || {
              echo "Public check failed: $label could not be fetched at $url" >&2; return 1;
            }
            [[ "$body" == *"$expected"* ]] || {
              echo "Public check failed: $label did not contain expected marker: $expected" >&2; return 1;
            }
          }
          require_page 'Ithute home' 'https://ithute.co.ls/' 'One home for the systems that move organisations forward.'
          require_page 'Pricing' 'https://ithute.co.ls/pricing' 'Your business online from'
          require_page 'Hosting rules' 'https://ithute.co.ls/hosting-docs' 'Rules for every system hosted on Ithute.'
          require_page 'Documentation' 'https://ithute.co.ls/docs' 'Public configuration manual'
          require_page 'Login' 'https://ithute.co.ls/login' 'Sign in with Ithute'
          require_page 'Central Auth health' 'https://auth.ithute.co.ls/healthz' 'ithute-auth'
          require_page 'Push health' 'https://push.ithute.co.ls/readyz' '"status":"ready"'
          require_page 'Realtime health' 'https://realtime.ithute.co.ls/readyz' '"status":"ready"'

          curl --connect-timeout 10 -sS -D /tmp/ithute-sso-headers \
            https://ithute.co.ls/api/v1/auth/ithute/login -o /tmp/ithute-sso-body
          grep -Eq '^HTTP/[^ ]+ 303' /tmp/ithute-sso-headers
          grep -Fiq 'auth.ithute.co.ls/oauth/authorize' /tmp/ithute-sso-headers
          grep -Fiq 'client_id=mailbox-dns' /tmp/ithute-sso-headers
          echo 'Ithute production deployment and rollback guard passed.'
