name: Deploy Ithute Production

on:
  workflow_run:
    workflows: ["Ithute Standalone CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      EXPECTED_IPV4: 204.12.205.224

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Download tested Docker images from CI
        uses: actions/download-artifact@v4
        with:
          name: ithute-images-${{ env.DEPLOY_SHA }}
          path: /tmp/ithute-images
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify image artifact
        run: |
          set -euo pipefail
          cd /tmp/ithute-images
          test -f "ithute-images-${DEPLOY_SHA}.tar.gz"
          test -f "ithute-images-${DEPLOY_SHA}.sha256"
          sha256sum -c "ithute-images-${DEPLOY_SHA}.sha256"

      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Require completed bootstrap
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          if ! ssh "$remote" "test -f '$VPS_APP_DIR/.ithute-bootstrapped' && test -f '$VPS_APP_DIR/.env.production'"; then
            echo 'Ithute production is not bootstrapped in the runtime directory.' >&2
            echo 'Run Safe Ithute VPS Bootstrap before routine deployment.' >&2
            exit 1
          fi

      - name: Build runtime-only configuration bundle
        run: |
          set -euo pipefail
          tar -czf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            compose.production.yml \
            infrastructure/caddy/Caddyfile \
            infrastructure/dns/zones/db.ithute.co.ls
          ! tar -tzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" | grep -Eq '^(apps|platform)/'

      - name: Transfer and load GitHub-built images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-images/ithute-images-${DEPLOY_SHA}.tar.gz" "$remote:/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          ssh "$remote" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          test -s "$archive"
          gzip -dc "$archive" | docker load
          rm -f "$archive"
          docker image inspect "ithute-web:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-app-api:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-auth:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-push:$DEPLOY_SHA" >/dev/null
          docker image inspect "ithute-realtime:$DEPLOY_SHA" >/dev/null
          REMOTE

      - name: Upload runtime config and start images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-runtime-${DEPLOY_SHA}.tgz"
          scp scripts/deploy-production.sh "$remote:/tmp/ithute-deploy-production.sh"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/infrastructure/caddy" "$APP_DIR/infrastructure/dns/zones"
          tar -xzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          chmod 700 /tmp/ithute-deploy-production.sh
          ITHUTE_APP_DIR="$APP_DIR" ITHUTE_IMAGE_TAG="$DEPLOY_SHA" bash /tmp/ithute-deploy-production.sh
          rm -f "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" /tmp/ithute-deploy-production.sh
          REMOTE

      - name: Verify internal health and exact running images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .image.env
          compose() {
            docker compose \
              --env-file .env.production \
              --env-file .image.env \
              -p ithute \
              -f compose.production.yml \
              "$@"
          }
          compose config > /tmp/ithute-runtime-compose.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-runtime-compose.yml
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-app-api curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
          compose exec -T ithute-app-api python -c 'from app.services.powerdns import PowerDNSClient; zone=PowerDNSClient().get_zone("ithute.co.ls"); assert zone.get("name") == "ithute.co.ls."'
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-dns python3 -c 'import os,urllib.request; request=urllib.request.Request("http://127.0.0.1:8081/api/v1/servers/localhost", headers={"X-API-Key": os.environ["PDNS_AUTH_API_KEY"]}); urllib.request.urlopen(request, timeout=3).read()'
          compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null

          verify_running_image() {
            service="$1"
            expected="$2"
            container_id="$(compose ps -q "$service")"
            test -n "$container_id"
            actual="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            test "$actual" = "$expected"
          }

          verify_running_image ithute-web "ithute-web:$DEPLOY_SHA"
          verify_running_image ithute-app-api "ithute-app-api:$DEPLOY_SHA"
          verify_running_image ithute-auth "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-auth-push-event-worker "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-push "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-push-worker "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-realtime "ithute-realtime:$DEPLOY_SHA"
          verify_running_image ithute-dns "powerdns/pdns-auth-49:4.9.17"
          REMOTE

      - name: Verify authoritative DNS on public IPv4
        run: |
          set -euo pipefail
          python3 scripts/verify-authoritative-dns.py \
            --server "$EXPECTED_IPV4" \
            --expected-ip "$EXPECTED_IPV4" \
            --timeout 8

      - name: Verify restored public application and central SSO
        run: |
          set -euo pipefail

          require_page() {
            label="$1"
            url="$2"
            expected="$3"
            body="$(curl --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 -fsS "$url")" || {
              echo "Public check failed: $label could not be fetched at $url" >&2
              return 1
            }
            if [[ "$body" != *"$expected"* ]]; then
              echo "Public check failed: $label did not contain expected marker: $expected" >&2
              return 1
            fi
            echo "Public check passed: $label"
          }

          require_page 'Ithute home' 'https://ithute.co.ls/' 'One home for the systems that move organisations forward.'
          require_page 'Pricing' 'https://ithute.co.ls/pricing' 'Choose capacity you can understand.'
          require_page 'Documentation' 'https://ithute.co.ls/docs' 'Public configuration manual'
          require_page 'Login' 'https://ithute.co.ls/login' 'Sign in with Ithute'

          require_page 'Central Auth health' 'https://auth.ithute.co.ls/healthz' 'ithute-auth'
          require_page 'Push health' 'https://push.ithute.co.ls/readyz' '"status":"ready"'
          require_page 'Realtime health' 'https://realtime.ithute.co.ls/readyz' '"status":"ready"'

          curl --connect-timeout 10 -sS -D /tmp/ithute-sso-headers \
            https://ithute.co.ls/api/v1/auth/ithute/login \
            -o /tmp/ithute-sso-body
          if ! grep -Eq '^HTTP/[^ ]+ 303' /tmp/ithute-sso-headers; then
            echo 'Public check failed: central SSO entry did not return HTTP 303.' >&2
            cat /tmp/ithute-sso-headers >&2
            exit 1
          fi
          if ! grep -Fiq 'auth.ithute.co.ls/oauth/authorize' /tmp/ithute-sso-headers; then
            echo 'Public check failed: central SSO entry did not redirect to Ithute Auth.' >&2
            cat /tmp/ithute-sso-headers >&2
            exit 1
          fi
          if ! grep -Fiq 'client_id=mailbox-dns' /tmp/ithute-sso-headers; then
            echo 'Public check failed: central SSO redirect is missing mailbox-dns client_id.' >&2
            cat /tmp/ithute-sso-headers >&2
            exit 1
          fi
          echo 'Public check passed: central SSO entry'

          remote="${VPS_USER}@${VPS_HOST}"
          if ssh "$remote" "test -f '$VPS_APP_DIR/.dns-cutover-complete'"; then
            if curl --connect-timeout 5 -sS -D /tmp/ithute-ip-disabled-headers "http://${EXPECTED_IPV4}/" -o /tmp/ithute-ip-disabled-body &&
               grep -Fiq 'X-Ithute-Temporary-IP: true' /tmp/ithute-ip-disabled-headers; then
              echo 'Cutover marker exists but temporary direct-IP route is active.' >&2
              exit 1
            fi
          fi

          echo 'Restored Ithute application, dashboard entry, pricing, docs, SSO, DNS management, and central services are publicly healthy.'
