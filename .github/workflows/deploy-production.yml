name: Deploy Ithute Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional 40-character main commit SHA; leave blank to deploy current main"
        required: false
        type: string

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      EXPECTED_IPV4: 204.12.205.224
      GHCR_REGISTRY: ghcr.io/ithute-stak
      MIN_FREE_KB: "15728640"

    steps:
      - name: Checkout main for manual release selection
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact release commit
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          requested="${REQUESTED_SHA:-}"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'release_sha must be a full 40-character lowercase commit SHA.' >&2
              exit 1
            }
            git cat-file -e "$requested^{commit}"
            git merge-base --is-ancestor "$requested" origin/main || {
              echo 'Requested release is not part of main.' >&2
              exit 1
            }
            deploy_sha="$requested"
          else
            deploy_sha="$(git rev-parse origin/main)"
          fi
          git checkout --detach "$deploy_sha"
          printf 'DEPLOY_SHA=%s\n' "$deploy_sha" >> "$GITHUB_ENV"
          echo "Manual deployment selected commit $deploy_sha"

      - name: Require green CI gates for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          require_success() {
            workflow="$1"
            label="$2"
            echo "Waiting for $label on ${DEPLOY_SHA}. No VPS mutation happens before both gates pass."
            for attempt in $(seq 1 120); do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=40")"
              row="$(printf '%s' "$runs" | jq -r --arg sha "$DEPLOY_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] | if . == null then "" else [.status, (.conclusion // ""), (.html_url // "")] | @tsv end')"
              if [ -z "$row" ]; then
                echo "$label has not been created yet (${attempt}/120)."
                sleep 5
                continue
              fi
              IFS=$'\t' read -r status conclusion url <<< "$row"
              echo "$label: status=${status} conclusion=${conclusion:-pending} ${url}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success" || {
                  echo "$label did not pass; VPS left untouched." >&2
                  exit 1
                }
                return 0
              fi
              test "$attempt" -lt 120 || {
                echo "Timed out waiting for $label; VPS left untouched." >&2
                exit 1
              }
              sleep 5
            done
          }
          require_success ci.yml 'Ithute Standalone CI'
          require_success production-safety-ci.yml 'Production Safety CI'

      - name: Verify candidate images exist in GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            ref="${GHCR_REGISTRY}/${image}:${DEPLOY_SHA}"
            echo "Verifying $ref"
            docker manifest inspect "$ref" >/dev/null
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preflight VPS and resolve rollback release
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          rollback_tag="$(ssh "$remote" "APP_DIR='$VPS_APP_DIR' MIN_FREE_KB='$MIN_FREE_KB' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f "$APP_DIR/.ithute-bootstrapped"
          test -f "$APP_DIR/.env.production"
          docker info >/dev/null

          valid_tag() { [[ "${1:-}" =~ ^[0-9a-f]{40}$ ]]; }
          read_tag() {
            file="$1"
            [ -f "$file" ] || return 0
            sed -n 's/^ITHUTE_IMAGE_TAG=//p' "$file" | tail -n1
          }

          current="$(read_tag "$APP_DIR/.image.env")"
          last_good="$(read_tag "$APP_DIR/.last-known-good.env")"
          rollback=""
          if valid_tag "$current"; then
            rollback="$current"
          elif valid_tag "$last_good"; then
            rollback="$last_good"
          else
            echo 'No valid current or last-known-good Ithute release is available for rollback.' >&2
            exit 1
          fi

          echo 'VPS storage before targeted Ithute cleanup:' >&2
          df -h / /tmp >&2 || true
          docker system df >&2 || true

          rm -f /tmp/ithute-images-*.tar.gz /tmp/ithute-runtime-*.tgz /tmp/ithute-deploy-production.sh
          running_images="$(docker ps --format '{{.Image}}' | sort -u)"
          for repo in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' | sort -u | while IFS= read -r image; do
              [ -n "$image" ] || continue
              if printf '%s\n' "$running_images" | grep -Fxq "$image"; then
                echo "Keeping running image $image" >&2
              elif [ "$image" = "$repo:$rollback" ]; then
                echo "Keeping rollback image $image" >&2
              else
                echo "Removing stale Ithute image $image" >&2
                docker image rm "$image" >/dev/null 2>&1 || true
              fi
            done
          done
          docker image prune -f >/dev/null 2>&1 || true

          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          available_inodes="$(df -Pi / | awk 'NR==2 {print $4}')"
          if [ "${available_kb:-0}" -lt "$MIN_FREE_KB" ]; then
            echo "Refusing deployment: less than 15 GiB free after safe Ithute-only cleanup." >&2
            exit 1
          fi
          if [ "${available_inodes:-0}" -lt 100000 ]; then
            echo "Refusing deployment: fewer than 100,000 free inodes." >&2
            exit 1
          fi

          printf '%s\n' "$rollback"
          REMOTE
          )"
          [[ "$rollback_tag" =~ ^[0-9a-f]{40}$ ]]
          printf 'ROLLBACK_TAG=%s\n' "$rollback_tag" >> "$GITHUB_ENV"
          echo "Rollback release: $rollback_tag"

      - name: Pull candidate from GHCR without image bundle transfer
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          auth_dir="/tmp/ithute-ghcr-${DEPLOY_SHA}"
          ssh "$remote" "rm -rf '$auth_dir' && mkdir -p '$auth_dir' && chmod 700 '$auth_dir'"
          printf '%s' "$GHCR_TOKEN" | ssh "$remote" "DOCKER_CONFIG='$auth_dir' docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"
          ssh "$remote" "DEPLOY_SHA='$DEPLOY_SHA' ROLLBACK_TAG='$ROLLBACK_TAG' REGISTRY='$GHCR_REGISTRY' AUTH_DIR='$auth_dir' bash -s" <<'REMOTE'
          set -euo pipefail
          cleanup_auth() { rm -rf "$AUTH_DIR"; }
          trap cleanup_auth EXIT

          pull_as_local() {
            repo="$1"
            tag="$2"
            local_ref="$repo:$tag"
            if docker image inspect "$local_ref" >/dev/null 2>&1; then
              echo "Already available: $local_ref"
              return 0
            fi
            remote_ref="$REGISTRY/$repo:$tag"
            echo "Pulling $remote_ref"
            DOCKER_CONFIG="$AUTH_DIR" docker pull "$remote_ref"
            docker tag "$remote_ref" "$local_ref"
            docker image rm "$remote_ref" >/dev/null 2>&1 || true
            docker image inspect "$local_ref" >/dev/null
          }

          for repo in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            pull_as_local "$repo" "$DEPLOY_SHA"
          done
          for repo in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            pull_as_local "$repo" "$ROLLBACK_TAG"
          done
          REMOTE

      - name: Build runtime-only configuration bundle
        run: |
          set -euo pipefail
          tar -czf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            compose.production.yml \
            infrastructure/caddy/Caddyfile \
            infrastructure/dns/zones/db.ithute.co.ls
          ! tar -tzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" | grep -Eq '^(apps|platform)/'

      - name: Upload runtime config and start candidate safely
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-runtime-${DEPLOY_SHA}.tgz"
          scp scripts/deploy-production.sh "$remote:/tmp/ithute-deploy-production.sh"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' ROLLBACK_TAG='$ROLLBACK_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/infrastructure/caddy" "$APP_DIR/infrastructure/dns/zones"
          if [ ! -s "$APP_DIR/.last-known-good-runtime.tgz" ] && \
             [ -f "$APP_DIR/.image.env" ] && \
             grep -Fxq "ITHUTE_IMAGE_TAG=$ROLLBACK_TAG" "$APP_DIR/.image.env"; then
            tar -czf "$APP_DIR/.last-known-good-runtime.tgz" -C "$APP_DIR" \
              compose.production.yml \
              infrastructure/caddy/Caddyfile \
              infrastructure/dns/zones/db.ithute.co.ls
            chmod 600 "$APP_DIR/.last-known-good-runtime.tgz"
          fi

          tar -xzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          chmod 700 /tmp/ithute-deploy-production.sh
          set +e
          ITHUTE_APP_DIR="$APP_DIR" \
          ITHUTE_IMAGE_TAG="$DEPLOY_SHA" \
          ITHUTE_FALLBACK_IMAGE_TAG="$ROLLBACK_TAG" \
          ITHUTE_REQUIRE_PUBLIC_HEALTH=1 \
            bash /tmp/ithute-deploy-production.sh
          status=$?
          set -e
          rm -f "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" /tmp/ithute-deploy-production.sh
          exit "$status"
          REMOTE

      - name: Verify internal health and exact running images
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .image.env
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .last-known-good.env
          test -s .last-known-good-runtime.tgz
          compose() {
            docker compose \
              --env-file .env.production \
              --env-file .image.env \
              -p ithute \
              -f compose.production.yml \
              "$@"
          }
          compose config > /tmp/ithute-runtime-compose.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-runtime-compose.yml
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-app-api curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
          compose exec -T ithute-app-api python -c 'from app.services.powerdns import PowerDNSClient; zone=PowerDNSClient().get_zone("ithute.co.ls"); assert zone.get("name") == "ithute.co.ls."'
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'

          verify_running_image() {
            service="$1"
            expected="$2"
            container_id="$(compose ps -q "$service")"
            test -n "$container_id"
            actual="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            test "$actual" = "$expected"
          }
          verify_running_image ithute-web "ithute-web:$DEPLOY_SHA"
          verify_running_image ithute-app-api "ithute-app-api:$DEPLOY_SHA"
          verify_running_image ithute-auth "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-auth-push-event-worker "ithute-auth:$DEPLOY_SHA"
          verify_running_image ithute-push "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-push-worker "ithute-push:$DEPLOY_SHA"
          verify_running_image ithute-realtime "ithute-realtime:$DEPLOY_SHA"
          REMOTE

      - name: Verify authoritative DNS on public IPv4
        run: |
          set -euo pipefail
          python3 scripts/verify-authoritative-dns.py \
            --server "$EXPECTED_IPV4" \
            --expected-ip "$EXPECTED_IPV4" \
            --timeout 8

      - name: Verify public application and central SSO
        run: |
          set -euo pipefail
          require_page() {
            label="$1"; url="$2"; expected="$3"
            body="$(curl --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 -fsS "$url")" || {
              echo "Public check failed: $label could not be fetched at $url" >&2; return 1;
            }
            [[ "$body" == *"$expected"* ]] || {
              echo "Public check failed: $label did not contain expected marker: $expected" >&2; return 1;
            }
          }
          require_page 'Ithute home' 'https://ithute.co.ls/' 'One home for the systems that move organisations forward.'
          require_page 'Pricing' 'https://ithute.co.ls/pricing' 'Your business online from'
          require_page 'Hosting rules' 'https://ithute.co.ls/hosting-docs' 'Rules for every system hosted on Ithute.'
          require_page 'Documentation' 'https://ithute.co.ls/docs' 'Public configuration manual'
          require_page 'Login' 'https://ithute.co.ls/login' 'Sign in with Ithute'
          require_page 'Central Auth health' 'https://auth.ithute.co.ls/healthz' 'ithute-auth'
          require_page 'Push health' 'https://push.ithute.co.ls/readyz' '"status":"ready"'
          require_page 'Realtime health' 'https://realtime.ithute.co.ls/readyz' '"status":"ready"'

          curl --connect-timeout 10 -sS -D /tmp/ithute-sso-headers \
            https://ithute.co.ls/api/v1/auth/ithute/login -o /tmp/ithute-sso-body
          grep -Eq '^HTTP/[^ ]+ 303' /tmp/ithute-sso-headers
          grep -Fiq 'auth.ithute.co.ls/oauth/authorize' /tmp/ithute-sso-headers
          grep -Fiq 'client_id=mailbox-dns' /tmp/ithute-sso-headers
          echo 'Ithute production deployment and rollback guard passed.'

      - name: Retain only current and previous Ithute releases on VPS
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' ROLLBACK_TAG='$ROLLBACK_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$DEPLOY_SHA" != "$ROLLBACK_TAG" ]; then
            printf 'ITHUTE_IMAGE_TAG=%s\n' "$ROLLBACK_TAG" > "$APP_DIR/.previous-release.env"
            chmod 600 "$APP_DIR/.previous-release.env"
          fi

          running_images="$(docker ps --format '{{.Image}}' | sort -u)"
          for repo in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' | sort -u | while IFS= read -r image; do
              [ -n "$image" ] || continue
              if printf '%s\n' "$running_images" | grep -Fxq "$image"; then
                echo "Keeping running image $image"
              elif [ "$image" = "$repo:$DEPLOY_SHA" ] || [ "$image" = "$repo:$ROLLBACK_TAG" ]; then
                echo "Keeping current/rollback image $image"
              else
                echo "Removing old Ithute release $image"
                docker image rm "$image" >/dev/null 2>&1 || true
              fi
            done
          done
          docker image prune -f >/dev/null 2>&1 || true
          rm -f /tmp/ithute-runtime-compose.yml /tmp/ithute-sso-headers /tmp/ithute-sso-body
          echo 'VPS storage after deployment retention:'
          df -h / /tmp || true
          docker system df || true
          REMOTE
