name: Deploy Ithute Production

on:
  workflow_run:
    workflows: ["Ithute Standalone CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ithute-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_APP_DIR: /home/administrator/ithute

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Configure SSH
        run: |
          set -eu
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build deployment bundle
        run: |
          set -eu
          tar -czf "/tmp/ithute-${DEPLOY_SHA}.tgz" \
            apps \
            platform \
            infrastructure/caddy \
            mail \
            scripts \
            compose.production.yml \
            .env.example \
            README.md \
            SECURITY.md

      - name: Upload and deploy only Ithute
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "mkdir -p '$VPS_APP_DIR' && chmod 700 '$VPS_APP_DIR'"
          scp "/tmp/ithute-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-${DEPLOY_SHA}.tgz"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' sh -s" <<'REMOTE'
          set -eu
          tar -xzf "/tmp/ithute-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          rm -f "/tmp/ithute-${DEPLOY_SHA}.tgz"
          test -f "$APP_DIR/.env.production" || {
            echo "Fresh VPS bootstrap has not been completed. Run bash scripts/bootstrap-vps.sh on the VPS once." >&2
            exit 2
          }
          ITHUTE_APP_DIR="$APP_DIR" ITHUTE_REQUIRE_PUBLIC_HEALTH=1 bash "$APP_DIR/scripts/deploy-production.sh"
          REMOTE

      - name: Verify public Ithute endpoints
        run: |
          set -eu
          html="$(curl --retry 12 --retry-delay 3 --retry-all-errors -fsS https://ithute.co.ls/)"
          printf '%s' "$html" | grep -Fq 'One focused platform.'
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://auth.ithute.co.ls/healthz | grep -q ithute-auth
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://push.ithute.co.ls/readyz | grep -q '"status":"ready"'
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS https://realtime.ithute.co.ls/readyz | grep -q '"status":"ready"'
