name: Enforce Production Domain Identity

on:
  workflow_run:
    workflows: ["Build and Deploy Production"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-production-domain-identity.sh'
      - 'scripts/ithute-tutor-edge-finalize.sh'
      - '.github/workflows/enforce-production-domain-identity.yml'
      - 'infrastructure/caddy/Caddyfile'
      - 'infrastructure/ithute-edge/default.conf.template'
  workflow_dispatch:

concurrency:
  group: ithute-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_APP_DIR: /home/administrator/mailbox-dns
  PLATFORM_DOMAIN: ithute.co.ls

jobs:
  enforce:
    name: Reconcile public DNS and mail identity
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Checkout exact production release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Validate production SSH credentials
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }

      - name: Configure production SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/mailbox_dns_identity"
          chmod 600 "$HOME/.ssh/mailbox_dns_identity"

          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"

          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/mailbox-dns-identity-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/mailbox-dns-identity-askpass.sh
            SSH_ASKPASS=/tmp/mailbox-dns-identity-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/mailbox_dns_identity" </dev/null
            rm -f /tmp/mailbox-dns-identity-askpass.sh
          else
            ssh-add "$HOME/.ssh/mailbox_dns_identity" </dev/null
          fi

          cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Enforce production domain identity on VPS
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          staged="/tmp/enforce-production-domain-identity-${GITHUB_RUN_ID}.sh"
          scp scripts/enforce-production-domain-identity.sh "$remote:$staged"
          ssh "$remote" "install -m 0755 '$staged' '$VPS_APP_DIR/scripts/enforce-production-domain-identity.sh' && rm -f '$staged'"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' PLATFORM_DOMAIN='$PLATFORM_DOMAIN' PUBLIC_IP='$VPS_HOST' sh -s" <<'REMOTE'
          set -eu
          if command -v flock >/dev/null 2>&1; then
            exec 9>/tmp/ithute-production.lock
            attempt=1
            while ! flock -n 9; do
              if [ "$attempt" -ge 120 ]; then
                echo "Timed out waiting for shared Ithute production lock." >&2
                exit 1
              fi
              echo "Waiting for shared Ithute production lock ($attempt/120)..."
              sleep 5
              attempt=$((attempt + 1))
            done
          fi
          cd "$APP_DIR"
          PLATFORM_DOMAIN="$PLATFORM_DOMAIN" PUBLIC_IP="$PUBLIC_IP" sh scripts/enforce-production-domain-identity.sh
          REMOTE

      - name: Verify public authoritative DNS externally
        run: |
          set -eu
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi

          ns1="ns1.${PLATFORM_DOMAIN}."
          ns2="ns2.${PLATFORM_DOMAIN}."
          mail="mail.${PLATFORM_DOMAIN}."

          soa="$(dig +short @"$VPS_HOST" "$PLATFORM_DOMAIN" SOA)"
          set -- $soa
          [ "${1:-}" = "$ns1" ] || { echo "::error::Public SOA primary is ${1:-missing}, expected $ns1"; exit 1; }
          [ "${2:-}" = "hostmaster.${PLATFORM_DOMAIN}." ] || { echo "::error::Public SOA hostmaster is ${2:-missing}" >&2; exit 1; }

          ns="$(dig +short @"$VPS_HOST" "$PLATFORM_DOMAIN" NS | sort)"
          printf '%s\n' "$ns" | grep -Fx "$ns1" >/dev/null
          printf '%s\n' "$ns" | grep -Fx "$ns2" >/dev/null

          for host in \
            "$PLATFORM_DOMAIN" \
            "www.${PLATFORM_DOMAIN}" \
            "api.${PLATFORM_DOMAIN}" \
            "auth.${PLATFORM_DOMAIN}" \
            "push.${PLATFORM_DOMAIN}" \
            "realtime.${PLATFORM_DOMAIN}" \
            "groupware.${PLATFORM_DOMAIN}" \
            "ns1.${PLATFORM_DOMAIN}" \
            "ns2.${PLATFORM_DOMAIN}" \
            "mail.${PLATFORM_DOMAIN}"; do
            dig +short @"$VPS_HOST" "$host" A | grep -Fx "$VPS_HOST" >/dev/null || {
              echo "::error::Authoritative DNS is missing $host -> $VPS_HOST"
              exit 1
            }
          done

          for type in A AAAA CNAME; do
            if [ -n "$(dig +short @"$VPS_HOST" "panel.${PLATFORM_DOMAIN}" "$type")" ]; then
              echo "::error::Retired panel.${PLATFORM_DOMAIN} still has a $type record"
              exit 1
            fi
          done

          mx="$(dig +short @"$VPS_HOST" "$PLATFORM_DOMAIN" MX)"
          set -- $mx
          [ "${1:-}" = "10" ] && [ "${2:-}" = "$mail" ] || { echo "::error::Unexpected public MX: $mx"; exit 1; }

          tcp_soa="$(dig +tcp +short @"$VPS_HOST" "$PLATFORM_DOMAIN" SOA)"
          set -- $tcp_soa
          [ "${1:-}" = "$ns1" ] || { echo "::error::TCP authoritative DNS failed"; exit 1; }

          echo "Public authoritative DNS identity verified with ithute.co.ls as the frontend and no panel subdomain."

      - name: Report PTR readiness
        run: |
          set -eu
          if ! command -v dig >/dev/null 2>&1; then exit 0; fi
          ptr="$(dig +short -x "$VPS_HOST" | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected="mail.${PLATFORM_DOMAIN}."
          if [ "$ptr" != "$expected" ]; then
            echo "::warning::PTR/rDNS is '$ptr'; ask the VPS provider to change $VPS_HOST PTR to $expected for production mail deliverability."
          else
            echo "PTR/rDNS matches $expected"
          fi