name: Finalize Ithute Mail

on:
  # Mail is finalized in production. Keep explicit recovery triggers and rerun
  # only when the mail runtime itself changes.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-mail.yml"
      - "mail/**"
      - "scripts/bootstrap-mail.sh"

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_MAIL_DIR: /home/administrator/ithute-platform-mail
      MAILSERVER_IMAGE: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
      CERTBOT_IMAGE: certbot/certbot:v5.8.0
      MAIL_RUNTIME_SHA: ${{ github.sha }}

    steps:
      - name: Checkout mail configuration on GitHub runner
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate VPS secrets
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_mail"
          chmod 600 "$HOME/.ssh/ithute_mail"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_mail" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_mail" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check whether mail is already finalized
        id: mail_state
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          if ssh "$remote" "test -f '$VPS_MAIL_DIR/.ithute-mail-finalized' && test -f '$VPS_MAIL_DIR/.account-sync-v1' && test \"\$(cat '$VPS_MAIL_DIR/.runtime-sha' 2>/dev/null || true)\" = '$MAIL_RUNTIME_SHA' && test \"\$(docker inspect --format '{{.State.Health.Status}}' ithute-mail 2>/dev/null)\" = healthy"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Mail runtime, routing, and synchronized account storage already match this revision.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare immutable mail images on GitHub runner
        if: steps.mail_state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          docker pull "$MAILSERVER_IMAGE"
          docker pull "$CERTBOT_IMAGE"
          docker image inspect "$MAILSERVER_IMAGE" >/dev/null
          docker image inspect "$CERTBOT_IMAGE" >/dev/null
          docker save "$MAILSERVER_IMAGE" "$CERTBOT_IMAGE" | gzip -1 > /tmp/ithute-mail-images.tar.gz
          sha256sum /tmp/ithute-mail-images.tar.gz > /tmp/ithute-mail-images.sha256

      - name: Package mail runtime files
        if: steps.mail_state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          tar -czf /tmp/ithute-mail-runtime.tgz mail scripts/bootstrap-mail.sh

      - name: Finalize mail automatically when DNS is ready
        if: steps.mail_state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp /tmp/ithute-mail-runtime.tgz /tmp/ithute-mail-images.tar.gz /tmp/ithute-mail-images.sha256 "$remote:/tmp/"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' VPS_MAIL_DIR='$VPS_MAIL_DIR' MAIL_RUNTIME_SHA='$MAIL_RUNTIME_SHA' bash -s" <<'REMOTE'
          set -uo pipefail
          if [ ! -f "$VPS_APP_DIR/.ithute-bootstrapped" ]; then
            echo 'Ithute bootstrap is not complete yet; rerun Finalize Ithute Mail after bootstrap completes.'
            exit 0
          fi

          tmpdir="$(mktemp -d /tmp/ithute-mail-runtime.XXXXXX)"
          cleanup() {
            rm -f /tmp/ithute-mail-runtime.tgz /tmp/ithute-mail-images.tar.gz /tmp/ithute-mail-images.sha256
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          cd /tmp
          sha256sum -c ithute-mail-images.sha256
          gzip -dc ithute-mail-images.tar.gz | docker load
          tar -xzf ithute-mail-runtime.tgz -C "$tmpdir"

          set +e
          ITHUTE_APP_DIR="$VPS_APP_DIR" \
          ITHUTE_MAIL_DIR="$VPS_MAIL_DIR" \
          ITHUTE_SOURCE_DIR="$tmpdir" \
            bash "$tmpdir/scripts/bootstrap-mail.sh"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo 'Mail DNS is not ready yet; rerun Finalize Ithute Mail after DNS is ready.'
            exit 0
          fi
          if [ "$status" -eq 0 ] && [ -f "$VPS_MAIL_DIR/.ithute-mail-finalized" ]; then
            printf '%s\n' "$MAIL_RUNTIME_SHA" > "$VPS_MAIL_DIR/.runtime-sha"
          fi
          exit "$status"
          REMOTE

      - name: Verify mail service when provisioned
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' VPS_MAIL_DIR='$VPS_MAIL_DIR' MAIL_RUNTIME_SHA='$MAIL_RUNTIME_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ ! -f "$VPS_MAIL_DIR/.ithute-mail-finalized" ]; then
            echo 'Mail is waiting for public DNS or first-time provisioning; rerun Finalize Ithute Mail after prerequisites are ready.'
            exit 0
          fi
          test -f "$VPS_MAIL_DIR/mailbox-credentials.txt"
          test -f "$VPS_MAIL_DIR/mail-dns-required.txt"
          test -f "$VPS_MAIL_DIR/.account-sync-v1"
          test "$(cat "$VPS_MAIL_DIR/.runtime-sha" 2>/dev/null || true)" = "$MAIL_RUNTIME_SHA"

          docker compose -p ithute-mail -f "$VPS_MAIL_DIR/compose.yml" ps
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' ithute-mail 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              docker exec ithute-mail test -f /tmp/docker-mailserver/postfix-accounts.cf
              docker exec ithute-mail sh -c 'test "$(readlink /tmp/docker-mailserver/postfix-accounts.cf)" = /mail-accounts/postfix-accounts.cf'
              docker exec ithute-app-api python -c 'import imaplib, ssl; client=imaplib.IMAP4_SSL("mail.ithute.co.ls", 993, ssl_context=ssl.create_default_context(), timeout=10); client.logout()'
              docker exec ithute-app-api python -c 'import smtplib, ssl; client=smtplib.SMTP("mail.ithute.co.ls", 587, timeout=10); client.ehlo(); client.starttls(context=ssl.create_default_context()); client.ehlo(); client.quit()'
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -p ithute-mail -f "$VPS_MAIL_DIR/compose.yml" logs --tail=150 >&2 || true
              echo "Mail container did not become healthy; last health state: ${health:-missing}" >&2
              exit 1
            fi
            sleep 2
          done
          REMOTE
