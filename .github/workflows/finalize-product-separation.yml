name: Finalize Ithute Product Separation

on:
  push:
    branches: [chore/extract-products-cleanup]
    paths:
      - ".github/workflows/finalize-product-separation.yml"

permissions:
  contents: write

jobs:
  remove-product-source:
    name: Remove extracted product source from Ithute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify every standalone destination
        run: |
          set -euo pipefail
          for repository in \
            https://github.com/ithute-stak/LoanHub.git \
            https://github.com/ithute-stak/ithute-pay.git \
            https://github.com/ithute-stak/ithute-tutor.git \
            https://github.com/ithute-stak/buildtrack-construction.git; do
            git ls-remote --exit-code "$repository" refs/heads/main >/dev/null
          done

      - name: Remove product-owned files and repair platform references
        run: |
          set -euo pipefail

          git rm -r -- \
            products/LoanHub \
            products/ithute-pay \
            products/ithute-tutor \
            products/nbros

          git rm --ignore-unmatch -- \
            docker-compose.buildtrack.yml \
            docker-compose.ithute-pay.yml \
            docker-compose.ithute-tutor.yml \
            docker-compose.ithute-tutor-caddy.yml \
            docker-compose.ithute-tutor-prod.yml \
            scripts/buildtrack-deploy.sh \
            scripts/buildtrack-sync-env.py \
            scripts/ithute-tutor-deploy.sh \
            scripts/ithute-tutor-sync-env.py \
            scripts/verify-force-redeploy-safety.sh \
            .github/workflows/force-redeploy-contract.yml \
            .github/workflows/full-platform-force-redeploy.yml \
            .github/workflows/ithute-pay-dns.yml \
            .github/workflows/ithute-pay-production.yml \
            .github/workflows/ithute-pay.yml \
            .github/workflows/ithute-tutor-https-recovery.yml \
            .github/workflows/ithute-tutor-production.yml \
            .github/workflows/ithute-tutor.yml \
            .github/workflows/loanhub-call-mobile.yml \
            .github/workflows/loanhub-live-banking-fix.yml \
            .github/workflows/loanhub-product-production.yml \
            .github/workflows/nbros-auth-smoke.yml \
            .github/workflows/nbros-fleet-ci.yml \
            .github/workflows/nbros-production.yml \
            .github/workflows/production-isolation-contract.yml \
            .github/workflows/production-ssh-reliability-contract.yml

          python3 - <<'PY'
          from pathlib import Path

          service = Path("apps/backend/app/services/ithute_operating.py")
          service_text = service.read_text(encoding="utf-8")
          replacements = {
              '"source_path": "products/LoanHub",': '"repository_url": "https://github.com/ithute-stak/LoanHub",',
              '"source_path": "products/ithute-pay",': '"repository_url": "https://github.com/ithute-stak/ithute-pay",',
              '"source_path": "products/ithute-tutor",': '"repository_url": "https://github.com/ithute-stak/ithute-tutor",',
          }
          for old, new in replacements.items():
              if old not in service_text:
                  raise SystemExit(f"Missing expected platform registry entry: {old}")
              service_text = service_text.replace(old, new)
          service.write_text(service_text, encoding="utf-8")

          ignore = Path(".gitignore")
          ignore.write_text(
              "\n".join(
                  line for line in ignore.read_text(encoding="utf-8").splitlines()
                  if not line.startswith("products/ithute-tutor/")
              ) + "\n",
              encoding="utf-8",
          )

          validator = Path("scripts/validate-ithute-operating-platform.sh")
          validator.write_text(
              """#!/usr/bin/env sh
          set -eu

          ROOT=\"$(CDPATH= cd -- \"$(dirname -- \"$0\")/..\" && pwd)\"
          cd \"$ROOT\"

          python -m py_compile \\
            apps/backend/app/models/ithute_operating.py \\
            apps/backend/app/models/mail_intelligence.py \\
            apps/backend/app/services/ithute_operating.py \\
            apps/backend/app/api/v1/ithute_operating_common.py \\
            apps/backend/app/api/v1/ithute_operating_control.py \\
            apps/backend/app/api/v1/ithute_operating_events.py \\
            apps/backend/app/api/v1/ithute_operating_ops.py \\
            apps/backend/app/api/v1/ithute_operating.py \\
            apps/backend/app/api/v1/mail_intelligence.py \\
            apps/backend/alembic/versions/0013_ithute_operating_core.py \\
            apps/backend/alembic/versions/0014_ithute_operating_ops.py \\
            apps/backend/alembic/versions/0015_mail_intelligence.py

          test -s product.manifest.yaml
          python - <<'PYCODE'
          from pathlib import Path

          content = Path(\"apps/backend/app/services/ithute_operating.py\").read_text(encoding=\"utf-8\")
          for repository in (
              \"https://github.com/ithute-stak/LoanHub\",
              \"https://github.com/ithute-stak/ithute-pay\",
              \"https://github.com/ithute-stak/ithute-tutor\",
          ):
              assert repository in content, repository
          assert \"source_path\\\": \\\"products/\" not in content
          PYCODE

          if git grep -nE 'products/(LoanHub|ithute-pay|ithute-tutor|nbros)' -- \
            ':!.github/workflows/finalize-product-separation.yml'; then
            echo 'Extracted product source path remains in the Ithute platform repository.' >&2
            exit 1
          fi

          echo 'Ithute operating-platform static validation passed.'
          """,
              encoding="utf-8",
          )

          workflow = Path(".github/workflows/ithute-operating-platform.yml")
          workflow.write_text(
              """name: Ithute Operating Platform

          on:
            pull_request:
              paths:
                - 'apps/backend/app/models/ithute_operating.py'
                - 'apps/backend/app/models/mail_intelligence.py'
                - 'apps/backend/app/services/ithute_operating.py'
                - 'apps/backend/app/api/v1/ithute_operating*.py'
                - 'apps/backend/app/api/v1/mail_intelligence.py'
                - 'apps/backend/alembic/versions/0013_ithute_operating_core.py'
                - 'apps/backend/alembic/versions/0014_ithute_operating_ops.py'
                - 'apps/backend/alembic/versions/0015_mail_intelligence.py'
                - 'apps/frontend/app/ithute-platform/**'
                - 'apps/frontend/app/ithute-account/**'
                - 'apps/frontend/app/mail-intelligence/**'
                - 'product.manifest.yaml'
                - 'scripts/validate-ithute-operating-platform.sh'
                - '.github/workflows/ithute-operating-platform.yml'
            push:
              branches: [main]
              paths:
                - 'product.manifest.yaml'
                - 'scripts/validate-ithute-operating-platform.sh'
                - '.github/workflows/ithute-operating-platform.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            static-contract:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - name: Validate operating-platform contracts
                  run: sh scripts/validate-ithute-operating-platform.sh
          """,
              encoding="utf-8",
          )

          routing = Path(".github/workflows/central-nginx-routing.yml")
          routing_text = routing.read_text(encoding="utf-8")
          routing_text = routing_text.replace("      - 'products/nbros/deploy/deploy-production.sh'\n", "")
          routing.write_text(routing_text, encoding="utf-8")
          PY

      - name: Validate the cleaned platform repository
        run: |
          set -euo pipefail
          git diff --check
          sh scripts/validate-ithute-operating-platform.sh
          test ! -e products/LoanHub
          test ! -e products/ithute-pay
          test ! -e products/ithute-tutor
          test ! -e products/nbros

      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/finalize-product-separation.yml
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract product systems from Ithute monorepo"
          git push origin HEAD:chore/extract-products-cleanup
