name: Safe Ithute VPS Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fresh-cutover.yml
      - scripts/bootstrap-vps.sh
      - scripts/bootstrap-mail.sh

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_MAIL_DIR: /home/administrator/ithute-platform-mail
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      ITHUTE_SYSTEM_OWNER_PASSWORD: ${{ secrets.ITHUTE_SYSTEM_OWNER_PASSWORD }}
      EXPECTED_IPV4: 204.12.205.224

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate protected deployment inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$ITHUTE_SYSTEM_OWNER_PASSWORD"
          test "${#ITHUTE_SYSTEM_OWNER_PASSWORD}" -ge 12
          test "$VPS_HOST" = "$EXPECTED_IPV4" || {
            echo "VPS_HOST does not match the approved production host $EXPECTED_IPV4" >&2
            exit 1
          }

      - name: Observe public DNS without blocking bootstrap
        run: |
          set -euo pipefail
          for host in ithute.co.ls auth.ithute.co.ls push.ithute.co.ls realtime.ithute.co.ls mail.ithute.co.ls; do
            addresses="$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ' || true)"
            if printf '%s\n' "$addresses" | tr ' ' '\n' | grep -Fxq "$EXPECTED_IPV4"; then
              echo "$host -> $EXPECTED_IPV4"
            elif [ -n "$addresses" ]; then
              echo "$host currently resolves to: $addresses"
            else
              echo "$host currently has no public IPv4 answer. Internal bootstrap will continue."
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_bootstrap"
          chmod 600 "$HOME/.ssh/ithute_bootstrap"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_bootstrap" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_bootstrap" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preflight VPS
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "set -eu; command -v docker >/dev/null; command -v git >/dev/null; command -v openssl >/dev/null; command -v curl >/dev/null; docker info >/dev/null; docker compose version >/dev/null"

      - name: Determine bootstrap state
        id: state
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          if ssh "$remote" "test -f '$VPS_APP_DIR/.ithute-bootstrapped' && test -f '$VPS_APP_DIR/.env.production'"; then
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
            echo 'Ithute is already bootstrapped; applying a normal deployment.'
          else
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
            echo 'Fresh isolated Ithute bootstrap is required.'
          fi

      - name: Transfer bootstrap and protected owner secret
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp scripts/bootstrap-vps.sh "$remote:/tmp/ithute-bootstrap-vps.sh"
          printf '%s' "$ITHUTE_SYSTEM_OWNER_PASSWORD" | base64 -w0 > /tmp/ithute-owner-password.b64
          chmod 600 /tmp/ithute-owner-password.b64
          scp /tmp/ithute-owner-password.b64 "$remote:/tmp/ithute-owner-password.b64"
          rm -f /tmp/ithute-owner-password.b64

      - name: Bootstrap only Ithute-owned resources
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' VPS_MAIL_DIR='$VPS_MAIL_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cleanup_bootstrap_tmp() {
            rm -f /tmp/ithute-owner-password.b64 /tmp/ithute-bootstrap-vps.sh
          }
          trap cleanup_bootstrap_tmp EXIT

          test -f /tmp/ithute-bootstrap-vps.sh
          test -s /tmp/ithute-owner-password.b64

          owner_password_b64="$(cat /tmp/ithute-owner-password.b64)"
          chmod 700 /tmp/ithute-bootstrap-vps.sh

          ITHUTE_APP_DIR="$VPS_APP_DIR" \
          ITHUTE_MAIL_DIR="$VPS_MAIL_DIR" \
          ITHUTE_SYSTEM_OWNER_PASSWORD_B64="$owner_password_b64" \
            bash /tmp/ithute-bootstrap-vps.sh

          unset owner_password_b64
          REMOTE

      - name: Deploy latest main when already bootstrapped
        if: steps.state.outputs.bootstrap != 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "cd '$VPS_APP_DIR' && git fetch --prune origin main && git checkout main && git reset --hard origin/main && ITHUTE_APP_DIR='$VPS_APP_DIR' bash scripts/deploy-production.sh"

      - name: Verify isolated runtime and internal health on VPS
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f "$VPS_APP_DIR/.ithute-bootstrapped"
          test -f "$VPS_APP_DIR/.env.production"

          cd "$VPS_APP_DIR"
          compose() { docker compose --env-file .env.production -p ithute -f compose.production.yml "$@"; }
          compose ps
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null
          REMOTE

      - name: Verify public Ithute services when DNS is ready
        run: |
          set -euo pipefail
          dns_ready=true
          for host in ithute.co.ls auth.ithute.co.ls push.ithute.co.ls realtime.ithute.co.ls; do
            if ! getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | grep -Fxq "$EXPECTED_IPV4"; then
              dns_ready=false
            fi
          done
          if [ "$dns_ready" != true ]; then
            echo 'Standalone VPS deployment is healthy, but public Ithute DNS is not pointed at this VPS yet.'
            echo 'Public verification is deferred; no VPS action is required.'
            exit 0
          fi

          html="$(curl --retry 15 --retry-delay 3 --retry-all-errors -fsS https://ithute.co.ls/)"
          printf '%s' "$html" | grep -Fq 'One focused platform.'
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://auth.ithute.co.ls/healthz | grep -q ithute-auth
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://push.ithute.co.ls/readyz | grep -q '"status":"ready"'
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://realtime.ithute.co.ls/readyz | grep -q '"status":"ready"'
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://auth.ithute.co.ls/account/login >/dev/null

      - name: Report mail status
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_MAIL_DIR='$VPS_MAIL_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -f "$VPS_MAIL_DIR/mailbox-credentials.txt" ]; then
            echo 'All requested info@ mailboxes are provisioned.'
          else
            echo 'Mail DNS is not ready yet; scheduled finalization will retry automatically.'
          fi
          REMOTE