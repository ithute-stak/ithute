name: Safe Ithute VPS Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_MAIL_DIR: /home/administrator/ithute-platform-mail
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      ITHUTE_SYSTEM_OWNER_PASSWORD: ${{ secrets.ITHUTE_SYSTEM_OWNER_PASSWORD }}
      EXPECTED_IPV4: 204.12.205.224

    steps:
      - name: Checkout main on GitHub runner
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate protected deployment inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$ITHUTE_SYSTEM_OWNER_PASSWORD"
          test "${#ITHUTE_SYSTEM_OWNER_PASSWORD}" -ge 12
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_bootstrap"
          chmod 600 "$HOME/.ssh/ithute_bootstrap"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_bootstrap" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_bootstrap" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preflight VPS
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "set -eu; command -v docker >/dev/null; command -v openssl >/dev/null; command -v curl >/dev/null; docker info >/dev/null; docker compose version >/dev/null"

      - name: Determine bootstrap state
        id: state
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          if ssh "$remote" "test -f '$VPS_APP_DIR/.ithute-bootstrapped' && test -f '$VPS_APP_DIR/.env.production'"; then
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
            echo 'Ithute is already bootstrapped. Routine CI image deployment should be used.'
          else
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build immutable images on GitHub runner
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          tag="$DEPLOY_SHA"
          docker build --pull --target runner -t "ithute-web:$tag" ./apps/frontend
          docker build --pull -t "ithute-auth:$tag" ./platform/ithute-auth
          docker build --pull -t "ithute-push:$tag" ./platform/ithute-push
          docker build --pull -t "ithute-realtime:$tag" ./platform/ithute-realtime
          docker save \
            "ithute-web:$tag" \
            "ithute-auth:$tag" \
            "ithute-push:$tag" \
            "ithute-realtime:$tag" \
            | gzip -1 > "/tmp/ithute-images-$tag.tar.gz"

      - name: Prepare runtime-only bundle
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          tar -czf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            compose.production.yml \
            infrastructure/caddy/Caddyfile
          ! tar -tzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" | grep -Eq '^(apps|platform)/'

      - name: Transfer runtime, images and protected owner secret
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          scp "/tmp/ithute-images-${DEPLOY_SHA}.tar.gz" "$remote:/tmp/ithute-images-${DEPLOY_SHA}.tar.gz"
          scp "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" "$remote:/tmp/ithute-runtime-${DEPLOY_SHA}.tgz"
          scp scripts/bootstrap-vps.sh "$remote:/tmp/ithute-bootstrap-vps.sh"
          scp scripts/deploy-production.sh "$remote:/tmp/ithute-deploy-production.sh"
          printf '%s' "$ITHUTE_SYSTEM_OWNER_PASSWORD" | base64 -w0 > /tmp/ithute-owner-password.b64
          chmod 600 /tmp/ithute-owner-password.b64
          scp /tmp/ithute-owner-password.b64 "$remote:/tmp/ithute-owner-password.b64"
          rm -f /tmp/ithute-owner-password.b64

      - name: Bootstrap runtime from GitHub-built images
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' MAIL_DIR='$VPS_MAIL_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/infrastructure/caddy"
          tar -xzf "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" -C "$APP_DIR"
          gzip -dc "/tmp/ithute-images-${DEPLOY_SHA}.tar.gz" | docker load

          owner_password_b64="$(cat /tmp/ithute-owner-password.b64)"
          chmod 700 /tmp/ithute-bootstrap-vps.sh /tmp/ithute-deploy-production.sh
          ITHUTE_APP_DIR="$APP_DIR" \
          ITHUTE_MAIL_DIR="$MAIL_DIR" \
          ITHUTE_DEPLOY_SCRIPT=/tmp/ithute-deploy-production.sh \
          ITHUTE_IMAGE_TAG="$DEPLOY_SHA" \
          ITHUTE_SYSTEM_OWNER_PASSWORD_B64="$owner_password_b64" \
            bash /tmp/ithute-bootstrap-vps.sh
          unset owner_password_b64

          rm -f \
            "/tmp/ithute-runtime-${DEPLOY_SHA}.tgz" \
            "/tmp/ithute-images-${DEPLOY_SHA}.tar.gz" \
            /tmp/ithute-owner-password.b64 \
            /tmp/ithute-bootstrap-vps.sh \
            /tmp/ithute-deploy-production.sh
          REMOTE

      - name: Verify image-only runtime and internal health
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f .ithute-bootstrapped
          test -f .env.production
          grep -Fxq "ITHUTE_IMAGE_TAG=$DEPLOY_SHA" .image.env
          compose() {
            docker compose --env-file .env.production --env-file .image.env -p ithute -f compose.production.yml "$@"
          }
          compose config > /tmp/ithute-bootstrap-compose.yml
          ! grep -Eq '^[[:space:]]*build:' /tmp/ithute-bootstrap-compose.yml
          compose exec -T ithute-web wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz | grep -q ithute-auth
          compose exec -T ithute-push curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T ithute-realtime curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null
          REMOTE

      - name: Verify public Ithute services when DNS is ready
        if: steps.state.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          dns_ready=true
          for host in ithute.co.ls auth.ithute.co.ls push.ithute.co.ls realtime.ithute.co.ls; do
            if ! getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | grep -Fxq "$EXPECTED_IPV4"; then
              dns_ready=false
            fi
          done
          if [ "$dns_ready" != true ]; then
            echo 'Runtime is healthy; public DNS verification is deferred.'
            exit 0
          fi
          html="$(curl --retry 15 --retry-delay 3 --retry-all-errors -fsS https://ithute.co.ls/)"
          printf '%s' "$html" | grep -Fq 'One focused platform.'
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://auth.ithute.co.ls/healthz | grep -q ithute-auth
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://push.ithute.co.ls/readyz | grep -q '"status":"ready"'
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS https://realtime.ithute.co.ls/readyz | grep -q '"status":"ready"'
