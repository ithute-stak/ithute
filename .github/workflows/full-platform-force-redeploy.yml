name: Full Platform Force Redeploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type FORCE-REDEPLOY-PRODUCTION to continue'
        required: true
        type: string
      reason:
        description: 'Optional audit note explaining why the full redeploy is needed'
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ithute-full-platform-force-redeploy
  cancel-in-progress: false

jobs:
  force-redeploy:
    name: Non-destructive full production redeploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AUDIT_REASON: ${{ inputs.reason }}

    steps:
      - name: Checkout exact main release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Require explicit production confirmation
        run: |
          set -eu
          if [ "$CONFIRMATION" != 'FORCE-REDEPLOY-PRODUCTION' ]; then
            echo '::error::Confirmation must exactly match FORCE-REDEPLOY-PRODUCTION'
            exit 1
          fi
          echo "Force redeploy release: $RELEASE_SHA"
          if [ -n "${AUDIT_REASON:-}" ]; then
            echo "Audit reason: $AUDIT_REASON"
          fi

      - name: Enforce non-destructive data safety contract
        run: sh scripts/verify-force-redeploy-safety.sh

      - name: Force redeploy current production platform
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          release="$RELEASE_SHA"

          latest_id() {
            local workflow="$1"
            gh api "repos/${repo}/actions/workflows/${workflow}/runs?branch=main&per_page=20" \
              --jq '.workflow_runs[0].id // 0'
          }

          new_run_id() {
            local workflow="$1"
            local baseline="$2"
            local event_filter="${3:-}"
            local jq_filter
            jq_filter=".workflow_runs[] | select(.id > ${baseline} and .head_sha == \"${release}\")"
            if [ -n "$event_filter" ]; then
              jq_filter="${jq_filter} | select(.event == \"${event_filter}\")"
            fi
            jq_filter="${jq_filter} | .id"
            gh api "repos/${repo}/actions/workflows/${workflow}/runs?branch=main&per_page=30" \
              --jq "$jq_filter" | head -n 1
          }

          wait_for_new_run() {
            local workflow="$1"
            local baseline="$2"
            local event_filter="${3:-}"
            local id=''
            for _ in $(seq 1 60); do
              id="$(new_run_id "$workflow" "$baseline" "$event_filter" || true)"
              if [ -n "$id" ]; then
                printf '%s\n' "$id"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          conclusion() {
            local id="$1"
            gh api "repos/${repo}/actions/runs/${id}" --jq '.conclusion // ""'
          }

          watch_allow_failure() {
            local id="$1"
            gh run watch "$id" --repo "$repo" --interval 10 --exit-status || true
          }

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"
            local before id
            before="$(latest_id "$workflow")"
            echo "::group::Force stage: ${label}"
            echo "Dispatching ${workflow} from main at ${release}"
            gh api --method POST "repos/${repo}/actions/workflows/${workflow}/dispatches" -f ref=main
            id="$(wait_for_new_run "$workflow" "$before" 'workflow_dispatch')" || {
              echo "::error::No workflow_dispatch run appeared for ${label}"
              exit 1
            }
            echo "Watching ${label} run ${id}"
            gh run watch "$id" --repo "$repo" --interval 10 --exit-status
            echo "::endgroup::"
          }

          ensure_child_success() {
            local workflow="$1"
            local label="$2"
            local baseline="$3"
            local id=''
            id="$(new_run_id "$workflow" "$baseline" 'workflow_run' || true)"
            if [ -n "$id" ] && [ "$(conclusion "$id")" = 'success' ]; then
              echo "${label}: automatic release child ${id} already succeeded."
              return 0
            fi
            if [ -n "$id" ]; then
              echo "${label}: automatic child ${id} did not succeed; forcing a clean manual retry."
            else
              echo "${label}: no successful automatic child found; forcing a manual run."
            fi
            dispatch_and_wait "$workflow" "$label"
          }

          # Capture child-workflow baselines before the core release. The core
          # production workflow already performs database backups, builds fresh
          # immutable images, pulls them, runs migrations and health-gates the
          # Mailbox/iMail + Auth + Push + Realtime stack.
          domain_before="$(latest_id enforce-production-domain-identity.yml)"
          pay_before="$(latest_id ithute-pay-production.yml)"
          tutor_before="$(latest_id ithute-tutor-production.yml)"
          pay_dns_before="$(latest_id ithute-pay-dns.yml)"

          dispatch_and_wait deploy-production.yml 'Mailbox/iMail + Auth + Push + Realtime core'

          # A successful core deployment normally fans out to Domain Identity,
          # Pay and Tutor. Wait for those automatic runs first so we do not add
          # unnecessary duplicates. Any missing/cancelled/failed child is then
          # retried manually and sequentially.
          echo 'Waiting for automatic core child deployments to settle...'
          for item in \
            "enforce-production-domain-identity.yml:${domain_before}:Domain identity" \
            "ithute-pay-production.yml:${pay_before}:Ithute Pay" \
            "ithute-tutor-production.yml:${tutor_before}:Ithute Tutor"; do
            workflow="${item%%:*}"
            rest="${item#*:}"
            baseline="${rest%%:*}"
            label="${rest#*:}"
            id="$(wait_for_new_run "$workflow" "$baseline" 'workflow_run' || true)"
            if [ -n "$id" ]; then
              echo "Automatic ${label} run: ${id}"
              watch_allow_failure "$id"
            else
              echo "No automatic ${label} run appeared within the grace period."
            fi
          done

          # Pay DNS is a second-level child. Give it a chance to finish before
          # any retry work enters the shared VPS queue.
          pay_dns_id="$(wait_for_new_run ithute-pay-dns.yml "$pay_dns_before" 'workflow_run' || true)"
          if [ -n "$pay_dns_id" ]; then
            echo "Automatic Ithute Pay DNS run: ${pay_dns_id}"
            watch_allow_failure "$pay_dns_id"
          fi

          ensure_child_success enforce-production-domain-identity.yml 'Public DNS and mail identity' "$domain_before"
          ensure_child_success ithute-pay-production.yml 'Ithute Pay' "$pay_before"

          # If Pay had to be retried, its DNS child may have a newer run. Accept
          # any successful post-baseline child; otherwise force DNS reconciliation.
          latest_pay_dns="$(new_run_id ithute-pay-dns.yml "$pay_dns_before" 'workflow_run' || true)"
          if [ -n "$latest_pay_dns" ]; then
            watch_allow_failure "$latest_pay_dns"
          fi
          ensure_child_success ithute-pay-dns.yml 'Ithute Pay authoritative DNS' "$pay_dns_before"

          ensure_child_success ithute-tutor-production.yml 'Ithute Tutor + Tutor DNS/TLS' "$tutor_before"

          # LoanHub is path-triggered during normal releases, so the force action
          # dispatches it explicitly even when no LoanHub source changed.
          dispatch_and_wait loanhub-product-production.yml 'LoanHub production'

          # Finish by reapplying and validating the dedicated public HTTPS edge.
          dispatch_and_wait shared-tls-edge-production.yml 'Dedicated Ithute HTTPS edge'

      - name: Verify public platform after force redeploy
        run: |
          set -eu
          check_url() {
            url="$1"
            label="$2"
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" >/dev/null; then
                ok=true
                break
              fi
              echo "Waiting for $label ($attempt/12)..."
              sleep 5
            done
            [ "$ok" = true ] || { echo "::error::Public verification failed: $label ($url)"; exit 1; }
            echo "Verified: $label"
          }

          check_url 'https://panel.ithute.co.ls/' 'iMail / Mailbox panel'
          check_url 'https://auth.ithute.co.ls/healthz' 'Ithute Auth'
          check_url 'https://push.ithute.co.ls/healthz' 'Ithute Push'
          check_url 'https://realtime.ithute.co.ls/healthz' 'Ithute Realtime'
          check_url 'https://pay.ithute.co.ls/' 'Ithute Pay'
          check_url 'https://api.pay.ithute.co.ls/health' 'Ithute Pay API'
          check_url 'https://portal.pay.ithute.co.ls/portal' 'Ithute Pay partner portal'
          check_url 'https://tutor.ithute.co.ls/' 'Ithute Tutor'
          check_url 'https://loanhub.co.ls/' 'LoanHub'
          check_url 'https://api.loanhub.co.ls/health/ready' 'LoanHub API'

      - name: Record non-destructive deployment summary
        if: always()
        run: |
          {
            echo '## Full Platform Force Redeploy'
            echo
            echo "- Release: \`${RELEASE_SHA}\`"
            echo '- Persistent volumes: preserved'
            echo '- Database/volume deletion: prohibited by safety contract'
            echo '- Core database backups: required before core service replacement'
            echo '- Production VPS locking: required for every mutating product stage'
            echo '- Scope: iMail/Mailbox, Auth, Push, Realtime, domain identity, Pay, Pay DNS, Tutor, LoanHub, shared HTTPS edge'
            if [ -n "${AUDIT_REASON:-}" ]; then
              echo "- Audit reason: ${AUDIT_REASON}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
