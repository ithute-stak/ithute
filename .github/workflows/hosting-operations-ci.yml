name: Hosting Operations CI

on:
  pull_request:
    paths:
      - "apps/backend/app/api/v1/application_hosting.py"
      - "apps/backend/app/api/v1/hosting_operations.py"
      - "apps/backend/app/api/v1/hosting_project_operations.py"
      - "apps/backend/app/api/v1/hosting_database_backups.py"
      - "apps/backend/app/api/v1/hosting_build_settings.py"
      - "apps/backend/app/api/v1/hosting_builds.py"
      - "apps/backend/app/api/v1/hosting_build_logs.py"
      - "apps/backend/app/api/v1/hosting_git_webhooks.py"
      - "apps/backend/app/api/v1/hosting_uploads.py"
      - "apps/backend/app/api/v1/hosting_metering.py"
      - "apps/backend/app/api/v1/shared_hosting.py"
      - "apps/backend/app/api/v1/hosting_source_credentials.py"
      - "apps/backend/app/api/v1/router.py"
      - "apps/backend/app/models/hosting.py"
      - "apps/backend/app/models/hosting_operations.py"
      - "apps/backend/app/models/hosting_builds.py"
      - "apps/backend/app/models/hosting_build_logs.py"
      - "apps/backend/app/models/hosting_webhooks.py"
      - "apps/backend/app/models/shared_hosting.py"
      - "apps/backend/app/models/billing.py"
      - "apps/backend/app/models/__init__.py"
      - "apps/backend/app/services/hosting_metering.py"
      - "apps/backend/app/services/hosting_operation_scheduler.py"
      - "apps/backend/app/services/operation_resource_locks.py"
      - "apps/backend/app/services/maintenance_drain_planner.py"
      - "apps/backend/app/services/database_replication.py"
      - "apps/backend/app/services/external_fencing.py"
      - "apps/backend/app/services/postgres_replica_telemetry.py"
      - "apps/backend/app/services/postgres_replication_groups.py"
      - "apps/backend/app/services/postgres_topology_repair.py"
      - "apps/backend/app/services/postgres_rpo_policy.py"
      - "apps/backend/app/services/postgres_rto_slo.py"
      - "apps/backend/app/services/postgres_endpoints.py"
      - "apps/backend/app/services/database_gateway_ha.py"
      - "apps/backend/app/services/hosting_node_health_daemon.py"
      - "apps/backend/app/services/hosting_webhooks.py"
      - "apps/backend/app/services/failure_domains.py"
      - "apps/backend/app/services/smart_failover_ranking.py"
      - "apps/backend/app/services/hosting_failover.py"
      - "apps/backend/app/services/billing.py"
      - "apps/backend/alembic/versions/*hosting*.py"
      - "apps/backend/alembic/versions/00*_pg_*.py"
      - "apps/backend/alembic/versions/*zip*.py"
      - "apps/backend/tests/test_application_hosting.py"
      - "apps/backend/tests/test_hosting_operations*.py"
      - "apps/backend/tests/test_hosting_failover.py"
      - "apps/backend/tests/test_failure_domains.py"
      - "apps/backend/tests/test_hosting_database_backup_contract.py"
      - "apps/backend/tests/test_hosting_project_operations_contract.py"
      - "apps/backend/tests/test_operation_resource_locks.py"
      - "apps/backend/tests/test_maintenance_drain_planner.py"
      - "apps/backend/tests/test_database_replication.py"
      - "apps/backend/tests/test_database_failover_orchestration_contract.py"
      - "apps/backend/tests/test_external_fencing_contract.py"
      - "apps/backend/tests/test_postgres_replica_telemetry.py"
      - "apps/backend/tests/test_postgres_replication_groups.py"
      - "apps/backend/tests/test_postgres_group_failover_execution_contract.py"
      - "apps/backend/tests/test_postgres_topology_repair_contract.py"
      - "apps/backend/tests/test_postgres_rpo_policy.py"
      - "apps/backend/tests/test_postgres_rto_slo.py"
      - "apps/backend/tests/test_postgres_stable_endpoints.py"
      - "apps/backend/tests/test_postgres_stable_endpoint_contract.py"
      - "apps/backend/tests/test_database_gateway_ha.py"
      - "apps/backend/tests/test_hosting_builds_contract.py"
      - "apps/backend/tests/test_hosting_build_logs_contract.py"
      - "apps/backend/tests/test_hosting_git_webhooks_contract.py"
      - "apps/backend/tests/test_hosting_uploads_contract.py"
      - "apps/backend/tests/test_hosting_metering.py"
      - "apps/backend/tests/test_shared_hosting_contract.py"
      - "apps/backend/tests/test_alembic_single_head.py"
      - "apps/backend/tests/conftest.py"
      - "infrastructure/hosting-agent/**"
      - "infrastructure/hosting-node/**"
      - "infrastructure/hosting-builder/**"
      - "infrastructure/hosting-upload/**"
      - "infrastructure/database-gateway/**"
      - ".github/workflows/hosting-operations-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosting-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ithute_hosting_test
          POSTGRES_USER: ithute
          POSTGRES_PASSWORD: ithute-hosting-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute -d ithute_hosting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ithute:ithute-hosting-test-password@127.0.0.1:5432/ithute_hosting_test
      SECRET_KEY: ci-hosting-secret-key-0000000000000000000000000000
      ENVIRONMENT: test
      PLATFORM_MODE: bootstrap
      ITHUTE_HOSTING_UPLOAD_SERVICE_TOKEN: ith_upload_ci_only_not_for_production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate hosting test database
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Run hosting regressions
        working-directory: apps/backend
        run: >-
          pytest -q
          tests/test_application_hosting.py
          tests/test_hosting_operations_unit.py
          tests/test_hosting_operations_integration.py
          tests/test_hosting_failover.py
          tests/test_failure_domains.py
          tests/test_hosting_operation_scheduler.py
          tests/test_hosting_database_backup_contract.py
          tests/test_hosting_project_operations_contract.py
          tests/test_operation_resource_locks.py
          tests/test_maintenance_drain_planner.py
          tests/test_database_replication.py
          tests/test_database_failover_orchestration_contract.py
          tests/test_external_fencing_contract.py
          tests/test_postgres_replica_telemetry.py
          tests/test_postgres_replication_groups.py
          tests/test_postgres_group_failover_execution_contract.py
          tests/test_postgres_topology_repair_contract.py
          tests/test_postgres_rpo_policy.py
          tests/test_postgres_rto_slo.py
          tests/test_postgres_stable_endpoints.py
          tests/test_postgres_stable_endpoint_contract.py
          tests/test_database_gateway_ha.py
          tests/test_hosting_builds_contract.py
          tests/test_hosting_build_logs_contract.py
          tests/test_hosting_git_webhooks_contract.py
          tests/test_hosting_uploads_contract.py
          tests/test_hosting_metering.py
          tests/test_shared_hosting_contract.py
          tests/test_alembic_single_head.py

      - name: Set up Go for database router chaos tests
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: engines/go-worker/go.sum

      - name: Run database router race and chaos tests
        working-directory: engines/go-worker
        run: go test -race ./cmd/db-router

      - name: Run ZIP quarantine, retention, builder, backup-remote and network-policy regressions
        run: |
          python3 -m unittest discover -s infrastructure/hosting-upload -p 'test_*.py'
          python3 -m unittest discover -s infrastructure/hosting-builder -p 'test_*.py'
          python3 -m unittest discover -s infrastructure/hosting-agent -p 'test_*.py'

      - name: Validate hosting runtime boundaries
        run: |
          set -euo pipefail
          python3 -m py_compile infrastructure/hosting-agent/agent.py infrastructure/hosting-agent/agent_v3.py infrastructure/hosting-agent/agent_v4.py infrastructure/hosting-agent/network_policy.py infrastructure/hosting-agent/backup_remote.py
          python3 -m py_compile infrastructure/hosting-builder/builder.py infrastructure/hosting-builder/verified_zip.py
          python3 -m py_compile infrastructure/hosting-upload/service.py infrastructure/hosting-upload/cleanup.py infrastructure/hosting-upload/zip_safety.py
          bash -n infrastructure/hosting-node/apply-egress-firewall.sh infrastructure/hosting-node/validate-host.sh
          grep -Fq 'no-new-privileges:true' infrastructure/hosting-agent/agent.py
          grep -Fq '"--cap-drop"' infrastructure/hosting-agent/agent.py
          grep -Fq '"--read-only"' infrastructure/hosting-agent/agent.py
          grep -Fq 'docker("image", "inspect"' infrastructure/hosting-agent/agent.py
          grep -Fq 'Refusing hosted workload that requests public host ports' infrastructure/hosting-agent/agent.py
          grep -Fq 'PGPASSWORD' infrastructure/hosting-agent/agent.py
          grep -Fq 'MYSQL_PWD' infrastructure/hosting-agent/agent.py
          grep -Fq 'ithute-db-gateway:host-gateway' infrastructure/hosting-agent/agent.py
          ! grep -Fq 'ITHUTE_HOSTING_POSTGRES_ADMIN_DSN' infrastructure/hosting-agent/agent.py
          ! grep -Fq 'docker("pull"' infrastructure/hosting-agent/agent.py
          ! grep -Fq 'git clone' infrastructure/hosting-agent/agent.py
          grep -Fq '/hosting/agent/project-operations/claim' infrastructure/hosting-agent/agent_v3.py
          grep -Fq '/heartbeat' infrastructure/hosting-agent/agent_v3.py
          grep -Fq 'fencing_token' infrastructure/hosting-agent/agent_v3.py
          grep -Fq 'docker("restart"' infrastructure/hosting-agent/agent_v3.py
          grep -Fq 'docker("logs"' infrastructure/hosting-agent/agent_v3.py
          grep -Fq 'uuid.UUID(project_id)' infrastructure/hosting-agent/agent_v3.py
          ! grep -Fq 'shell=True' infrastructure/hosting-agent/agent_v3.py
          grep -Fq 'ITHUTE_HOSTING_NETWORK_POOL' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'choose_project_subnet' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'base.ensure_network = ensure_hosted_network' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'base.postgres_operation = postgres_operation_v4' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'REVOKE CONNECT, TEMPORARY ON DATABASE' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'REVOKE CREATE ON SCHEMA public FROM PUBLIC' infrastructure/hosting-agent/agent_v4.py
          grep -Fq '"--role", username' infrastructure/hosting-agent/agent_v4.py
          ! grep -Fq 'f"--owner={username}"' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'backup_remote.require_configuration()' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'backup_remote.replicate' infrastructure/hosting-agent/agent_v4.py
          grep -Fq 'backup_remote.hydrate' infrastructure/hosting-agent/agent_v4.py
          grep -Fq '"--immutable"' infrastructure/hosting-agent/backup_remote.py
          grep -Fq 'ITHUTE_HOSTING_BACKUP_REMOTE_REQUIRED=true' infrastructure/hosting-node/agent.env.example
          grep -Fq 'ITHUTE_HOSTING_RCLONE_CONFIG=' infrastructure/hosting-node/agent.env.example
          grep -Fq '10.240.0.0/12' infrastructure/hosting-node/agent.env.example
          grep -Fq 'ITHUTE-HOSTING-EGRESS' infrastructure/hosting-node/apply-egress-firewall.sh
          grep -Fq '169.254.0.0/16' infrastructure/hosting-node/apply-egress-firewall.sh
          grep -Fq 'iptables -I DOCKER-USER 1 -s "$NETWORK_POOL"' infrastructure/hosting-node/apply-egress-firewall.sh
          grep -Fq 'Before=ithute-hosting-agent.service' infrastructure/hosting-node/ithute-hosting-egress.service
          grep -Fq 'ExecStart=/opt/ithute-hosting-node/apply-egress-firewall.sh' infrastructure/hosting-node/ithute-hosting-egress.service
          grep -Fq 'WantedBy=multi-user.target' infrastructure/hosting-node/ithute-hosting-egress.service
          grep -Fq 'systemctl is-enabled --quiet ithute-hosting-egress.service' infrastructure/hosting-node/validate-host.sh
          grep -Fq 'systemctl is-active --quiet ithute-hosting-egress.service' infrastructure/hosting-node/validate-host.sh
          grep -Fq 'ITHUTE_HOSTING_REQUIRE_AGENT_ACTIVE' infrastructure/hosting-node/validate-host.sh
          grep -Fq 'ExecStart=/usr/bin/python3 /opt/ithute-hosting-agent/agent_v4.py' infrastructure/hosting-node/ithute-hosting-agent.service
          grep -Fq 'ReadWritePaths=/var/lib/ithute-hosting' infrastructure/hosting-node/ithute-hosting-agent.service
          grep -Fq 'GIT_TERMINAL_PROMPT' infrastructure/hosting-builder/builder.py
          grep -Fq 'StrictHostKeyChecking=yes' infrastructure/hosting-builder/builder.py
          grep -Fq 'Unable to detect a supported runtime' infrastructure/hosting-builder/builder.py
          grep -Fq 'buildx' infrastructure/hosting-builder/builder.py
          grep -Fq 'containerimage.digest' infrastructure/hosting-builder/builder.py
          grep -Fq 'ALLOW_CUSTOM_DOCKERFILE' infrastructure/hosting-builder/builder.py
          grep -Fq 'materialize_verified_zip' infrastructure/hosting-builder/builder.py
          grep -Fq 'ITHUTE_HOSTING_BUILDER_VERIFIED_ROOT' infrastructure/hosting-builder/builder.py
          grep -Fq 'emit_build_log' infrastructure/hosting-builder/builder.py
          grep -Fq '[redacted]' infrastructure/hosting-builder/builder.py
          ! grep -Fq 'extractall' infrastructure/hosting-builder/verified_zip.py
          ! grep -Fq 'ITHUTE_HOSTING_AGENT_TOKEN' infrastructure/hosting-builder/builder.py
          grep -Fq 'inspect_zip' infrastructure/hosting-upload/service.py
          grep -Fq 'os.replace' infrastructure/hosting-upload/service.py
          grep -Fq 'max_unpacked_size_bytes' infrastructure/hosting-upload/service.py
          grep -Fq 'stat.S_ISLNK' infrastructure/hosting-upload/zip_safety.py
          grep -Fq 'compression ratio is too high' infrastructure/hosting-upload/zip_safety.py
          grep -Fq '/hosting/upload/storage/inventory' infrastructure/hosting-upload/cleanup.py
          grep -Fq 'referenced_paths' infrastructure/hosting-upload/cleanup.py
          ! grep -Fq 'extractall' infrastructure/hosting-upload/service.py
