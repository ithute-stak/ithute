name: Ithute Auth Next.js SDK CI
on:
  pull_request:
    paths:
      - "packages/ithute-auth-nextjs/**"
      - ".github/workflows/ithute-auth-nextjs-sdk.yml"
  push:
    branches: [main]
    paths:
      - "packages/ithute-auth-nextjs/**"
      - ".github/workflows/ithute-auth-nextjs-sdk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install SDK dependencies
        working-directory: packages/ithute-auth-nextjs
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Ithute Auth migration ancestry
        run: python3 platform/ithute-auth/check_migration_heads.py
      - name: Type-check SDK
        working-directory: packages/ithute-auth-nextjs
        run: npm run typecheck
      - name: Validate SDK contract tests
        working-directory: packages/ithute-auth-nextjs
        run: npm test
      - name: Compile SDK distribution
        working-directory: packages/ithute-auth-nextjs
        run: npm run build
      - name: Validate npm package contents
        working-directory: packages/ithute-auth-nextjs
        run: |
          npm pack --ignore-scripts --pack-destination /tmp --json > /tmp/ithute-sdk-pack.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/ithute-sdk-pack.json').read_text())
          files={entry['path'] for entry in result[0]['files']}
          assert 'dist/index.js' in files, files
          assert 'dist/index.d.ts' in files, files
          assert not any(name.startswith('src/') or name.startswith('tests/') for name in files), files
          print('Packed files verified:', sorted(files))
          PY
      - name: Test tarball in isolated consumer
        run: |
          set -euo pipefail
          mkdir -p /tmp/ithute-sdk-consumer
          cd /tmp/ithute-sdk-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund /tmp/ithute-auth-*.tgz
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { existsSync } from "node:fs";
            const manifest=JSON.parse(readFileSync("./node_modules/ithute-auth/package.json","utf8"));
            if(manifest.name!=="ithute-auth") throw Error("wrong package");
            for(const file of ["dist/index.js","dist/index.d.ts"]){
              if(!existsSync("./node_modules/ithute-auth/"+file)) throw Error("missing "+file);
            }
            if(!import.meta.resolve("ithute-auth").endsWith("/dist/index.js")) throw Error("invalid export map");
            console.log("Packaged SDK resolves in isolated consumer");
          '
