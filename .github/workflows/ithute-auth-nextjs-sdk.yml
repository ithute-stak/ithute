name: Ithute Auth Next.js SDK CI
on:
  pull_request:
    paths:
      - "packages/ithute-auth-nextjs/**"
      - ".github/workflows/ithute-auth-nextjs-sdk.yml"
  push:
    branches: [main]
    paths:
      - "packages/ithute-auth-nextjs/**"
      - ".github/workflows/ithute-auth-nextjs-sdk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install SDK dependencies
        working-directory: packages/ithute-auth-nextjs
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Ithute Auth migration ancestry
        run: python3 platform/ithute-auth/check_migration_heads.py
      - name: Verify npm distribution manifest
        run: python3 packages/ithute-auth-nextjs/scripts/release_preflight.py
      - name: Verify public release is blocked pending licensing
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("packages/ithute-auth-nextjs/scripts/release_preflight.py")
          spec=importlib.util.spec_from_file_location("release_preflight",p)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert not module.check(), "Package layout must be valid"
          assert any("license" in err.lower() for err in module.check(strict=True)), "Strict release must stay blocked without approval"
          PY
      - name: Type-check SDK
        working-directory: packages/ithute-auth-nextjs
        run: npm run typecheck
      - name: Validate SDK contract tests
        working-directory: packages/ithute-auth-nextjs
        run: npm test
      - name: Compile SDK distribution
        working-directory: packages/ithute-auth-nextjs
        run: npm run build
      - name: Validate npm package contents
        working-directory: packages/ithute-auth-nextjs
        run: |
          npm pack --ignore-scripts --pack-destination /tmp --json > /tmp/ithute-sdk-pack.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/ithute-sdk-pack.json').read_text())
          files={entry['path'] for entry in result[0]['files']}
          assert 'dist/index.js' in files, files
          assert 'dist/index.d.ts' in files, files
          assert not any(name.startswith('src/') or name.startswith('tests/') for name in files), files
          print('Packed files verified:', sorted(files))
          PY
      - name: Test tarball in isolated consumer
        run: |
          set -euo pipefail
          mkdir -p /tmp/ithute-sdk-consumer
          cd /tmp/ithute-sdk-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund /tmp/ithute-auth-*.tgz
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { existsSync } from "node:fs";
            const manifest=JSON.parse(readFileSync("./node_modules/ithute-auth/package.json","utf8"));
            if(manifest.name!=="ithute-auth") throw Error("wrong package");
            for(const file of ["dist/index.js","dist/index.d.ts"]){
              if(!existsSync("./node_modules/ithute-auth/"+file)) throw Error("missing "+file);
            }
            if(!import.meta.resolve("ithute-auth").endsWith("/dist/index.js")) throw Error("invalid export map");
            console.log("Packaged SDK resolves in isolated consumer");
          '
      - name: Verify Next.js App Router consumer types from packed SDK
        run: |
          set -euo pipefail
          cd /tmp/ithute-sdk-consumer
          npm install --ignore-scripts --no-audit --no-fund next@15 typescript@5.9.3 @types/node@22 @types/react@19 react@19 react-dom@19
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["app.ts"]
          }
          JSON
          cat > app.ts <<'TS'
          import { createIthuteAuth } from "ithute-auth";
          const auth = createIthuteAuth({
            issuer: "https://auth.example.test",
            clientId: "test-nextjs-consumer",
            callbackUrl: "https://app.example.test/api/auth/ithute/callback",
            secret: "a-long-random-server-only-secret-of-at-least-32-bytes",
          });
          async function verifySdkShape() {
            const session = await auth.getSession();
            if (session) console.log(session.expiresAt);
            await auth.authenticatedRequest("/v1/account/developer/access-requests");
          }
          void verifySdkShape;
          TS
          ./node_modules/.bin/tsc --project tsconfig.json
      - name: Build real Next.js App Router consuming packed SDK
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          cd /tmp/ithute-sdk-consumer
          mkdir -p app/api/auth/ithute/'[action]'
          cat > package.json <<'JSON'
          {
            "name":"ithute-auth-consumer-fixture",
            "version":"0.0.0",
            "private":true,
            "type":"module",
            "scripts":{"build":"next build"},
            "dependencies":{
              "ithute-auth":"file:../ithute-auth-0.1.0.tgz",
              "next":"^15.0.0",
              "react":"^19.0.0",
              "react-dom":"^19.0.0"
            },
            "devDependencies":{
              "typescript":"^5.9.3",
              "@types/node":"^22.15.0",
              "@types/react":"^19.0.0"
            }
          }
          JSON
          cat > app/layout.tsx <<'TS'
          import type { ReactNode } from "react";
          export default function RootLayout({children}:{children:ReactNode}){
            return <html lang="en"><body>{children}</body></html>;
          }
          TS
          cat > app/page.tsx <<'TS'
          export default function Home(){return <main>Ithute SDK Next.js packaging smoke test</main>}
          TS
          cat > app/api/auth/ithute/'[action]'/route.ts <<'TS'
          import { NextRequest } from "next/server";
          import { createIthuteAuth } from "ithute-auth";
          const auth = createIthuteAuth({
            issuer: "https://auth.example.test",
            clientId: "test-nextjs-consumer",
            callbackUrl: "https://app.example.test/api/auth/ithute/callback",
            secret: "a-long-random-server-only-secret-of-at-least-32-bytes",
          });
          export async function GET(request:NextRequest,context:{params:Promise<{action:string}>}){
            const {action}=await context.params;
            if(action==="login") return auth.login(request);
            if(action==="callback") return auth.callback(request);
            return new Response("Not found",{status:404});
          }
          export async function POST(request:NextRequest,context:{params:Promise<{action:string}>}){
            const {action}=await context.params;
            if(action==="logout") return auth.logout(request);
            return new Response("Not found",{status:404});
          }
          TS
          npm run build
