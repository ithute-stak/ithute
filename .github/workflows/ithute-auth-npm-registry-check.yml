name: Ithute Auth npm Registry Check (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test registry result classification
        run: python3 -m pytest packages/ithute-auth-nextjs/tests/test_public_registry_check.py
      - name: Query public npm registry (no credentials, no publication)
        run: python3 packages/ithute-auth-nextjs/scripts/check_public_registry.py
