name: Ithute Notification

on:
  pull_request:
    paths:
      - "platform/ithute-notification/**"
      - "platform/ithute-push/app/auth.py"
      - "platform/ithute-push/app/config.py"
      - "platform/ithute-push/app/platform_api.py"
      - "platform/ithute-auth/alembic/versions/0011_notification_gateway_client.py"
      - ".github/workflows/ithute-notification.yml"
  push:
    branches: [main]
    paths:
      - "platform/ithute-notification/**"
      - "platform/ithute-push/app/auth.py"
      - "platform/ithute-push/app/config.py"
      - "platform/ithute-push/app/platform_api.py"
      - "platform/ithute-auth/alembic/versions/0011_notification_gateway_client.py"
      - ".github/workflows/ithute-notification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ithute_notification
          POSTGRES_USER: ithute_notification
          POSTGRES_PASSWORD: notification_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute_notification -d ithute_notification"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://ithute_notification:notification_ci_password@127.0.0.1:5432/ithute_notification
      NOTIFICATION_AUTH_JWKS_URL: https://auth.invalid/.well-known/jwks.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/ithute-notification/requirements.txt

      - name: Install Notification dependencies
        working-directory: platform/ithute-notification
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Notification service
        working-directory: platform/ithute-notification
        run: python -m compileall -q app alembic tests

      - name: Migrate Notification database
        working-directory: platform/ithute-notification
        run: alembic upgrade head

      - name: Run Notification contracts
        working-directory: platform/ithute-notification
        run: python -m pytest -q

      - name: Build Notification image
        run: docker build -t ithute-notification:ci platform/ithute-notification
