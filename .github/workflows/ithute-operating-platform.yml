name: Ithute Operating Platform

on:
  pull_request:
    paths:
      - 'apps/backend/app/models/ithute_operating.py'
      - 'apps/backend/app/models/mail_intelligence.py'
      - 'apps/backend/app/services/ithute_operating.py'
      - 'apps/backend/app/api/v1/ithute_operating*.py'
      - 'apps/backend/app/api/v1/mail_intelligence.py'
      - 'apps/backend/alembic/versions/0013_ithute_operating_core.py'
      - 'apps/backend/alembic/versions/0014_ithute_operating_ops.py'
      - 'apps/backend/alembic/versions/0015_mail_intelligence.py'
      - 'apps/frontend/app/ithute-platform/**'
      - 'apps/frontend/app/ithute-account/**'
      - 'apps/frontend/app/mail-intelligence/**'
      - 'product.manifest.yaml'
      - 'scripts/validate-ithute-operating-platform.sh'
      - '.github/workflows/ithute-operating-platform.yml'
  push:
    branches: [main]
    paths:
      - 'product.manifest.yaml'
      - 'scripts/validate-ithute-operating-platform.sh'
      - '.github/workflows/ithute-operating-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate operating-platform contracts
        run: sh scripts/validate-ithute-operating-platform.sh
