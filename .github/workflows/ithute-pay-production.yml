name: Deploy Ithute Pay Production

on:
  workflow_run:
    workflows: ["Ithute Pay"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ithute-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ithute-stak/ithute-pay-bridge
  GHCR_USERNAME: ithute-stak
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_APP_DIR: /home/administrator/mailbox-dns
  BOOTSTRAP_ADMIN_EMAIL: thekoetlisi@gmail.com

jobs:
  build-and-publish:
    name: Build immutable Ithute Pay image
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Authenticate GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

      - name: Initialize Docker Buildx
        run: |
          set -eu
          docker buildx create --name ithute-pay-builder --use
          docker buildx inspect --bootstrap

      - name: Build and publish Ithute Pay
        run: |
          set -eu
          docker buildx build --platform linux/amd64 --pull --push \
            --build-arg NEXT_PUBLIC_API_BASE=/api/v1 \
            --build-arg NEXT_PUBLIC_PARTNER_API_BASE=https://api.pay.ithute.co.ls/api/v1 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            -t "${IMAGE}:${DEPLOY_SHA}" -t "${IMAGE}:latest" \
            ./products/ithute-pay

  deploy:
    name: Deploy only Ithute Pay product services
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          set -eu
          for name in VPS_SSH_KEY BOOTSTRAP_ADMIN_PASSWORD; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::$name is required"; exit 1; }
          done

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_pay_deploy"
          chmod 600 "$HOME/.ssh/ithute_pay_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-pay-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-pay-askpass.sh
            SSH_ASKPASS=/tmp/ithute-pay-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_pay_deploy" </dev/null
            rm -f /tmp/ithute-pay-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_pay_deploy" </dev/null
          fi
          cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage Ithute Pay manifest
        run: |
          set -eu
          scp docker-compose.ithute-pay.yml \
            "${VPS_USER}@${VPS_HOST}:/tmp/docker-compose.ithute-pay-${DEPLOY_SHA}.yml"

      - name: Deploy product without restarting central platform
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          logged_in=false
          cleanup_registry() {
            if [ "$logged_in" = true ]; then
              ssh "$remote" "docker logout '$REGISTRY' >/dev/null 2>&1 || true" || true
            fi
          }
          trap cleanup_registry EXIT HUP INT TERM

          printf '%s' "$GHCR_TOKEN" | ssh "$remote" "docker login '$REGISTRY' -u '$GHCR_USERNAME' --password-stdin"
          logged_in=true

          ssh "$remote" "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' BOOTSTRAP_ADMIN_EMAIL='$BOOTSTRAP_ADMIN_EMAIL' BOOTSTRAP_ADMIN_PASSWORD='$BOOTSTRAP_ADMIN_PASSWORD' sh -s" <<'REMOTE'
          set -eu

          if command -v flock >/dev/null 2>&1; then
            exec 9>/tmp/ithute-production.lock
            lock_attempt=1
            while ! flock -n 9; do
              if [ "$lock_attempt" -ge 120 ]; then
                echo "Timed out waiting for the shared Ithute production lock." >&2
                exit 1
              fi
              echo "Waiting for shared Ithute production lock (attempt $lock_attempt/120)..."
              sleep 10
              lock_attempt=$((lock_attempt + 1))
            done
            echo "Acquired shared Ithute production lock."
          fi

          cd "$APP_DIR"
          [ -f .env ] || { echo "Ithute production .env is missing" >&2; exit 1; }
          cp "/tmp/docker-compose.ithute-pay-${DEPLOY_SHA}.yml" docker-compose.ithute-pay.yml
          rm -f "/tmp/docker-compose.ithute-pay-${DEPLOY_SHA}.yml"
          chmod 600 .env

          upsert_env() {
            key="$1"; value="$2"; tmp="$(mktemp)"
            awk -v k="$key" 'index($0, k "=") != 1 { print }' .env > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"
          }
          env_value() {
            key="$1"
            awk -F= -v k="$key" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' .env
          }
          ensure_random_hex() {
            key="$1"; value="$(env_value "$key")"
            case "$value" in
              ""|*replace-with*|*replace-this*|*ChangeMe*|*changeme*) upsert_env "$key" "$(openssl rand -hex 32)" ;;
            esac
          }
          require_contains() {
            key="$1"; expected="$2"; value="$(env_value "$key")"
            case "$value" in
              *"$expected"*) ;;
              *) echo "Central platform registration is missing $expected in $key" >&2; exit 1 ;;
            esac
          }

          upsert_env ITHUTE_PAY_IMAGE_TAG "$DEPLOY_SHA"
          upsert_env ITHUTE_PAY_BOOTSTRAP_ADMIN_EMAIL "$BOOTSTRAP_ADMIN_EMAIL"
          upsert_env ITHUTE_PAY_BOOTSTRAP_ADMIN_PASSWORD "$BOOTSTRAP_ADMIN_PASSWORD"
          ensure_random_hex ITHUTE_PAY_DB_PASSWORD
          ensure_random_hex ITHUTE_PAY_SECRET_KEY
          ensure_random_hex ITHUTE_PAY_DATA_ENCRYPTION_KEY
          ensure_random_hex ITHUTE_SERVICE_ITHUTE_PAY_SECRET

          # Product deploys may validate central registration, but they may not
          # mutate or restart Auth, Push, Realtime or the shared Nginx gateway.
          require_contains ITHUTE_AUTH_FIRST_PARTY_CLIENTS 'ithute-pay:Ithute Pay'
          require_contains ITHUTE_PUSH_ALLOWED_USER_CLIENTS 'ithute-pay'
          require_contains ITHUTE_PUSH_ALLOWED_SERVICE_CLIENTS 'ithute-pay'
          require_contains ITHUTE_AUTH_CORS_ORIGINS 'https://pay.ithute.co.ls'
          require_contains ITHUTE_AUTH_REDIRECT_URIS_JSON 'https://pay.ithute.co.ls/api/v1/auth/ithute/callback'
          require_contains ITHUTE_AUTH_SERVICE_CLIENT_SECRETS_JSON '"ithute-pay"'

          chmod 600 .env

          COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.phase6-mail.yml -f docker-compose.phase11-backup.yml -f docker-compose.phase12-monitoring.yml -f docker-compose.ithute-platform.yml -f docker-compose.ithute-pay.yml -f docker-compose.deploy.yml"
          compose() { docker compose $COMPOSE_FILES "$@"; }
          wait_service() {
            service="$1"; attempts="${2:-90}"; n=1
            while [ "$n" -le "$attempts" ]; do
              status="not-started"
              id="$(compose ps -q "$service" 2>/dev/null || true)"
              if [ -n "$id" ]; then
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id" 2>/dev/null || true)"
                case "$status" in healthy|running) return 0 ;; exited|dead|unhealthy) compose logs --tail=200 "$service" || true; return 1 ;; esac
              fi
              if [ $((n % 10)) -eq 0 ]; then
                echo "Waiting for $service (status: $status, attempt $n/$attempts)..."
              fi
              sleep 2; n=$((n + 1))
            done
            compose logs --tail=200 "$service" || true
            return 1
          }

          compose config >/dev/null
          compose pull ithute-pay
          compose up -d --no-build ithute-pay-db ithute-pay-redis
          wait_service ithute-pay-db 60
          wait_service ithute-pay-redis 60
          compose up -d --no-deps --force-recreate ithute-pay
          wait_service ithute-pay 120

          # Existing central Nginx uses runtime DNS for product upstreams, so it
          # must not be recreated by an Ithute Pay release.
          compose exec -T nginx wget -qO- --header='Host: pay.ithute.co.ls' http://127.0.0.1/ >/dev/null
          compose exec -T nginx wget -qO- --header='Host: api.pay.ithute.co.ls' http://127.0.0.1/health >/dev/null
          compose exec -T nginx wget -qO- --header='Host: portal.pay.ithute.co.ls' http://127.0.0.1/portal >/dev/null

          echo "Ithute Pay deployed at immutable image ${DEPLOY_SHA}; central platform services were left untouched."
          REMOTE

      - name: Require public domain health
        run: |
          set -eu
          for url in \
            https://pay.ithute.co.ls/ \
            https://api.pay.ithute.co.ls/health \
            https://portal.pay.ithute.co.ls/portal; do
            healthy=false
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --connect-timeout 8 --max-time 20 "$url" >/dev/null; then
                healthy=true
                break
              fi
              sleep 3
            done
            [ "$healthy" = true ] || { echo "::error::Public Ithute Pay route is unhealthy: $url"; exit 1; }
            echo "Public route ready: $url"
          done
