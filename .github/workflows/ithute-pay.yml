name: Ithute Pay

on:
  pull_request:
    paths:
      - "products/ithute-pay/**"
      - "platform/ithute-auth/**"
      - "platform/ithute-push/**"
      - "docker-compose.ithute-pay.yml"
      - "docker-compose.ithute-platform.yml"
      - "infrastructure/nginx/default.conf"
      - ".github/workflows/ithute-pay.yml"
      - ".github/workflows/ithute-pay-production.yml"
  push:
    branches: [main]
    paths:
      - "products/ithute-pay/**"
      - "platform/ithute-auth/**"
      - "platform/ithute-push/**"
      - "docker-compose.ithute-pay.yml"
      - "docker-compose.ithute-platform.yml"
      - "infrastructure/nginx/default.conf"
      - ".github/workflows/ithute-pay.yml"
      - ".github/workflows/ithute-pay-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/ithute-pay/apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/ithute-pay/apps/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q api core database integrations providers routers services utils workers alembic tests
      - name: Run authentication, portal, central-platform and central integration contracts
        run: python -m pytest -q tests/test_auth_security.py tests/test_ithute_central_integration.py tests/test_partner_portal.py tests/test_platform_contract.py

  frontend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/ithute-pay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm --dir apps/frontend typecheck
      - name: Lint frontend
        run: pnpm --dir apps/frontend lint
      - name: Build frontend
        run: pnpm --dir apps/frontend build
