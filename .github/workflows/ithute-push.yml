name: Ithute Push

on:
  pull_request:
    paths:
      - "platform/ithute-push/**"
      - ".github/workflows/ithute-push.yml"
  push:
    branches: [main]
    paths:
      - "platform/ithute-push/**"
      - ".github/workflows/ithute-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/ithute-push
    env:
      PUSH_DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1/unused
      PUSH_ENDPOINT_ENCRYPTION_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform/ithute-push/requirements.txt
      - name: Show Python
        run: python3 --version
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile service
        run: python3 -m compileall -q app alembic tests
      - name: Run Push contract tests
        run: python3 -m pytest -q
