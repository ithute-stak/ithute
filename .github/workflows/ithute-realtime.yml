name: Ithute Realtime

on:
  pull_request:
    paths:
      - 'platform/ithute-realtime/**'
      - 'platform/ithute-auth/**'
      - 'platform/ithute-push/**'
      - 'docker-compose.ithute-platform.yml'
      - 'infrastructure/nginx/default.conf'
      - '.github/workflows/ithute-realtime.yml'
  push:
    branches: [main]
    paths:
      - 'platform/ithute-realtime/**'
      - 'platform/ithute-auth/**'
      - 'platform/ithute-push/**'
      - 'docker-compose.ithute-platform.yml'
      - 'infrastructure/nginx/default.conf'
      - '.github/workflows/ithute-realtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/ithute-realtime

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/ithute-realtime/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile Realtime
        run: python -m compileall -q app alembic tests

      - name: Run Realtime contract tests
        run: python -m pytest -q tests

  push-delegation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/ithute-push

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/ithute-push/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile Push
        run: python -m compileall -q app tests

      - name: Run Push tests
        run: python -m pytest -q tests
