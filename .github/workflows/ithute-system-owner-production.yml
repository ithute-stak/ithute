name: Synchronize Ithute System Owner

on:
  workflow_run:
    workflows: ["Deploy Shared TLS Edge Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ithute-system-owner-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_APP_DIR: /home/administrator/mailbox-dns
  ITHUTE_SYSTEM_OWNER_EMAIL: supperadmin@ithute.co.ls

jobs:
  synchronize-owner:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      ITHUTE_SYSTEM_OWNER_PASSWORD: ${{ secrets.ITHUTE_SYSTEM_OWNER_PASSWORD }}

    steps:
      - name: Check protected owner secret
        id: owner-secret
        shell: bash
        run: |
          set -eu
          if [ -z "${ITHUTE_SYSTEM_OWNER_PASSWORD:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ITHUTE_SYSTEM_OWNER_PASSWORD is not configured in the production environment; owner synchronization is safely skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure production SSH identity
        if: steps.owner-secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -eu
          test -n "${VPS_SSH_KEY:-}" || { echo "::error::VPS_SSH_KEY is required"; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"

          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-owner-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-owner-askpass.sh
            SSH_ASKPASS=/tmp/ithute-owner-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-owner-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage protected owner material
        if: steps.owner-secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -eu
          umask 077
          owner_file="/tmp/ithute-system-owner-${GITHUB_RUN_ID}.secret"
          printf '%s\n%s\n' "$ITHUTE_SYSTEM_OWNER_EMAIL" "$ITHUTE_SYSTEM_OWNER_PASSWORD" > "$owner_file"
          scp "$owner_file" "${VPS_USER}@${VPS_HOST}:/tmp/ithute-system-owner-${GITHUB_RUN_ID}.secret"
          rm -f "$owner_file"

      - name: Synchronize owner and central OAuth callback
        if: steps.owner-secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' OWNER_FILE='/tmp/ithute-system-owner-${GITHUB_RUN_ID}.secret' sh -s" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          [ -f .env ] || { echo "Missing production .env" >&2; exit 1; }
          [ -f "$OWNER_FILE" ] || { echo "Missing staged owner secret" >&2; exit 1; }

          owner_email="$(sed -n '1p' "$OWNER_FILE")"
          owner_password="$(sed -n '2p' "$OWNER_FILE")"
          [ -n "$owner_email" ] || { echo "Owner email is empty" >&2; exit 1; }
          [ -n "$owner_password" ] || { echo "Owner password is empty" >&2; exit 1; }

          env_value() {
            key="$1"
            awk -F= -v k="$key" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' .env
          }

          upsert_env() {
            key="$1"
            value="$2"
            tmp="$(mktemp)"
            awk -v k="$key" 'index($0, k "=") != 1 { print }' .env > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"
          }

          COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.phase6-mail.yml -f docker-compose.phase11-backup.yml -f docker-compose.phase12-monitoring.yml -f docker-compose.ithute-platform.yml -f docker-compose.deploy.yml"
          compose() {
            # shellcheck disable=SC2086
            docker compose $COMPOSE_FILES "$@"
          }

          current_redirects="$(env_value ITHUTE_AUTH_REDIRECT_URIS_JSON)"
          [ -n "$current_redirects" ] || current_redirects='{}'
          merged_redirects="$(compose exec -T -e CURRENT_REDIRECTS="$current_redirects" backend python - <<'PY'
          import json
          import os

          raw = os.environ.get("CURRENT_REDIRECTS", "{}")
          data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit("ITHUTE_AUTH_REDIRECT_URIS_JSON must be a JSON object")
          callback = "https://panel.ithute.co.ls/api/v1/auth/ithute/callback"
          values = data.get("mailbox-dns")
          if values is None:
              values = []
          if not isinstance(values, list):
              raise SystemExit("mailbox-dns redirect configuration must be a JSON array")
          if callback not in values:
              values.append(callback)
          data["mailbox-dns"] = values
          print(json.dumps(data, separators=(",", ":")))
          PY
          )"

          upsert_env ITHUTE_AUTH_REDIRECT_URIS_JSON "$merged_redirects"
          upsert_env ITHUTE_SYSTEM_OWNER_EMAIL "$owner_email"
          upsert_env ITHUTE_SYSTEM_OWNER_PASSWORD "$owner_password"
          chmod 600 .env
          rm -f "$OWNER_FILE"

          # Auth's entrypoint applies migrations and synchronizes the one global
          # owner before serving traffic. Recreate only Auth; product databases
          # and independently deployed product containers are untouched.
          compose up -d --no-deps --force-recreate ithute-auth

          id="$(compose ps -q ithute-auth)"
          [ -n "$id" ] || { echo "ithute-auth container was not created" >&2; exit 1; }
          attempt=1
          while [ "$attempt" -le 60 ]; do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id" 2>/dev/null || true)"
            case "$health" in
              healthy|running) break ;;
              unhealthy|exited|dead)
                compose logs --tail=200 ithute-auth >&2 || true
                exit 1
                ;;
            esac
            sleep 2
            attempt=$((attempt + 1))
          done
          [ "$attempt" -le 60 ] || { compose logs --tail=200 ithute-auth >&2 || true; exit 1; }
          compose exec -T ithute-auth curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          REMOTE

      - name: Verify public central Auth health
        if: steps.owner-secret.outputs.configured == 'true'
        run: |
          set -eu
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --connect-timeout 10 \
            https://auth.ithute.co.ls/healthz >/dev/null
          echo "Central Ithute system owner synchronization completed without exposing the credential."
