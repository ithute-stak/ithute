name: Deploy Ithute Tutor Production

on:
  workflow_run:
    workflows: ["Ithute Tutor"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Tutor has its own workflow queue. VPS mutations are serialized by the
  # shared production lock inside the Tutor deploy script.
  group: ithute-tutor-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ithute-stak/ithute-tutor-backend
  FRONTEND_IMAGE: ghcr.io/ithute-stak/ithute-tutor-frontend
  GHCR_USERNAME: ithute-stak
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_APP_DIR: /home/administrator/mailbox-dns
  TUTOR_HOST: tutor.ithute.co.ls

jobs:
  build-and-publish:
    name: Build immutable Ithute Tutor images
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Authenticate GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

      - name: Initialize Docker Buildx
        run: |
          set -eu
          docker buildx create --name ithute-tutor-builder --use
          docker buildx inspect --bootstrap

      - name: Build and publish Tutor backend
        run: |
          set -eu
          docker buildx build --platform linux/amd64 --pull --load \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            -t "${BACKEND_IMAGE}:${DEPLOY_SHA}" -t "${BACKEND_IMAGE}:latest" \
            ./products/ithute-tutor/sms_back_end
          docker push "${BACKEND_IMAGE}:${DEPLOY_SHA}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Build and publish Tutor frontend
        run: |
          set -eu
          docker buildx build --platform linux/amd64 --pull --load \
            --build-arg NEXT_PUBLIC_TUTOR_API_URL=/api \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            -t "${FRONTEND_IMAGE}:${DEPLOY_SHA}" -t "${FRONTEND_IMAGE}:latest" \
            ./products/ithute-tutor/sms-frontend
          docker push "${FRONTEND_IMAGE}:${DEPLOY_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Stage exact Tutor images on production VPS
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }
          docker image inspect "${BACKEND_IMAGE}:${DEPLOY_SHA}" >/dev/null
          docker image inspect "${FRONTEND_IMAGE}:${DEPLOY_SHA}" >/dev/null

          bundle="/tmp/ithute-tutor-images-${DEPLOY_SHA}.tar.gz"
          docker save \
            "${BACKEND_IMAGE}:${DEPLOY_SHA}" \
            "${FRONTEND_IMAGE}:${DEPLOY_SHA}" \
            | gzip -1 > "$bundle"
          test -s "$bundle"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_tutor_build_deploy"
          chmod 600 "$HOME/.ssh/ithute_tutor_build_deploy"
          eval "$(ssh-agent -s)"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-tutor-build-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-tutor-build-askpass.sh
            SSH_ASKPASS=/tmp/ithute-tutor-build-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_tutor_build_deploy" </dev/null
            rm -f /tmp/ithute-tutor-build-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_tutor_build_deploy" </dev/null
          fi
          cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          remote="${VPS_USER}@${VPS_HOST}"
          scp "$bundle" "$remote:/tmp/ithute-tutor-images-${DEPLOY_SHA}.tar.gz"
          ssh "$remote" "test -s '/tmp/ithute-tutor-images-${DEPLOY_SHA}.tar.gz'"
          rm -f "$bundle"

  deploy:
    name: Deploy Ithute Tutor only
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Validate Tutor deployment assets
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }
          sh -n scripts/ithute-tutor-deploy.sh
          python3 -m py_compile scripts/ithute-tutor-sync-env.py
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ithute-platform.yml \
            -f docker-compose.ithute-tutor.yml \
            -f docker-compose.ithute-tutor-prod.yml \
            -f docker-compose.deploy.yml \
            config >/dev/null

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_tutor_deploy"
          chmod 600 "$HOME/.ssh/ithute_tutor_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-tutor-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-tutor-askpass.sh
            SSH_ASKPASS=/tmp/ithute-tutor-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_tutor_deploy" </dev/null
            rm -f /tmp/ithute-tutor-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_tutor_deploy" </dev/null
          fi
          cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage Tutor-only production assets
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          scp docker-compose.ithute-tutor.yml "$remote:/tmp/docker-compose.ithute-tutor-${DEPLOY_SHA}.yml"
          scp docker-compose.ithute-tutor-prod.yml "$remote:/tmp/docker-compose.ithute-tutor-prod-${DEPLOY_SHA}.yml"
          scp scripts/ithute-tutor-deploy.sh "$remote:/tmp/ithute-tutor-deploy-${DEPLOY_SHA}.sh"
          scp scripts/ithute-tutor-sync-env.py "$remote:/tmp/ithute-tutor-sync-env-${DEPLOY_SHA}.py"

          ssh "$remote" \
            "sh -n '/tmp/ithute-tutor-deploy-${DEPLOY_SHA}.sh' && python3 -m py_compile '/tmp/ithute-tutor-sync-env-${DEPLOY_SHA}.py'"

      - name: Deploy Tutor and register Tutor DNS
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" \
            "APP_DIR='$VPS_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' TUTOR_HOST='$TUTOR_HOST' VPS_HOST='$VPS_HOST' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' TUTOR_SYNC_SCRIPT='/tmp/ithute-tutor-sync-env-${DEPLOY_SHA}.py' sh '/tmp/ithute-tutor-deploy-${DEPLOY_SHA}.sh'"

      - name: Require public Tutor DNS and HTTPS
        run: |
          set -eu
          dns_ready=false
          for attempt in $(seq 1 30); do
            answer="$(dig +short A "$TUTOR_HOST" | tail -n1 || true)"
            if [ "$answer" = "$VPS_HOST" ]; then
              dns_ready=true
              break
            fi
            echo "Waiting for public Tutor DNS ($attempt/30): ${answer:-no answer}"
            sleep 5
          done
          [ "$dns_ready" = true ] || { echo "::error::$TUTOR_HOST does not resolve to $VPS_HOST"; exit 1; }

          https_ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --connect-timeout 8 --max-time 20 "https://$TUTOR_HOST/" >/dev/null; then
              https_ready=true
              break
            fi
            echo "Waiting for public Tutor HTTPS ($attempt/20)..."
            sleep 5
          done
          [ "$https_ready" = true ] || { echo "::error::Public Tutor HTTPS route is unhealthy"; exit 1; }

          cert="$(echo | openssl s_client -connect "$TUTOR_HOST:443" -servername "$TUTOR_HOST" 2>/dev/null | openssl x509 -noout -ext subjectAltName)"
          printf '%s\n' "$cert"
          printf '%s\n' "$cert" | grep -Fq "DNS:$TUTOR_HOST" || {
            echo "::error::Tutor hostname is missing from the public TLS certificate."
            exit 1
          }
          echo "Ithute Tutor is publicly available at https://$TUTOR_HOST"
