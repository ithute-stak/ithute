name: Ithute Tutor

on:
  pull_request:
    paths:
      - 'products/ithute-tutor/**'
      - 'platform/ithute-auth/**'
      - 'platform/ithute-push/**'
      - 'docker-compose.ithute-tutor.yml'
      - 'docker-compose.ithute-tutor-prod.yml'
      - 'docker-compose.ithute-tutor-caddy.yml'
      - 'infrastructure/nginx/default.conf'
      - 'infrastructure/ithute-edge/**'
      - 'infrastructure/caddy/bootstrap.sh'
      - 'scripts/ithute-tutor-deploy.sh'
      - 'scripts/ithute-tutor-sync-env.py'
      - '.env.example'
      - '.github/workflows/ithute-tutor.yml'
      - '.github/workflows/ithute-tutor-production.yml'
  push:
    branches: [main, ithute-tutor]
    paths:
      - 'products/ithute-tutor/**'
      - 'platform/ithute-auth/**'
      - 'platform/ithute-push/**'
      - 'docker-compose.ithute-tutor.yml'
      - 'docker-compose.ithute-tutor-prod.yml'
      - 'docker-compose.ithute-tutor-caddy.yml'
      - 'infrastructure/nginx/default.conf'
      - 'infrastructure/ithute-edge/**'
      - 'infrastructure/caddy/bootstrap.sh'
      - 'scripts/ithute-tutor-deploy.sh'
      - 'scripts/ithute-tutor-sync-env.py'
      - '.env.example'
      - '.github/workflows/ithute-tutor.yml'
      - '.github/workflows/ithute-tutor-production.yml'

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/ithute-tutor/sms_back_end

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: products/ithute-tutor/sms_back_end/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q .

      - name: Test Tutor contracts
        run: python -m pytest -q tests

  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/ithute-tutor/sms-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_TUTOR_API_URL: /api
        run: pnpm build

  docker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate Tutor production topology
        env:
          ITHUTE_AUTH_DB_PASSWORD: ci-auth-db-password-only
          ITHUTE_AUTH_TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ITHUTE_PUSH_DB_PASSWORD: ci-push-db-password-only
          ITHUTE_PUSH_ENDPOINT_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ITHUTE_TUTOR_DB_PASSWORD: ci-tutor-db-password-only
          ITHUTE_TUTOR_PUSH_SERVICE_CLIENT_SECRET: ci-tutor-service-secret-0123456789
        run: |
          set -eu
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ithute-platform.yml \
            -f docker-compose.ithute-tutor.yml \
            -f docker-compose.ithute-tutor-prod.yml \
            -f docker-compose.deploy.yml \
            config >/tmp/ithute-tutor-compose.yml

          grep -q 'tutor-db:' /tmp/ithute-tutor-compose.yml
          grep -q 'tutor-backend:' /tmp/ithute-tutor-compose.yml
          grep -q 'tutor-frontend:' /tmp/ithute-tutor-compose.yml
          grep -q 'ithute-auth:' /tmp/ithute-tutor-compose.yml
          grep -q 'ithute-push:' /tmp/ithute-tutor-compose.yml
          grep -q 'ghcr.io/ithute-stak/ithute-tutor-backend' /tmp/ithute-tutor-compose.yml
          grep -q 'ghcr.io/ithute-stak/ithute-tutor-frontend' /tmp/ithute-tutor-compose.yml
          grep -q 'tutor.ithute.co.ls' infrastructure/ithute-edge/default.conf.template

          # The production workflow is product-scoped. Its large remote heredoc
          # was replaced by syntax-validated checked-in scripts.
          grep -q 'Deploy Ithute Tutor only' .github/workflows/ithute-tutor-production.yml
          grep -q 'sh -n scripts/ithute-tutor-deploy.sh' .github/workflows/ithute-tutor-production.yml
          grep -q 'python3 -m py_compile scripts/ithute-tutor-sync-env.py' .github/workflows/ithute-tutor-production.yml
          ! grep -q 'ithute-tutor-edge-finalize' .github/workflows/ithute-tutor-production.yml

          # Tutor keeps its own GitHub queue while the shared VPS mutation is
          # protected by the runtime host lock in the checked-in deploy script.
          grep -q 'group: ithute-tutor-production' .github/workflows/ithute-tutor-production.yml
          grep -q '/tmp/ithute-production.lock' scripts/ithute-tutor-deploy.sh
          ! grep -q 'group: ithute-production-vps' .github/workflows/ithute-tutor-production.yml

          # Exact Tutor images are staged over SSH and loaded locally. The VPS
          # does not need private GHCR pull permission for a Tutor release.
          grep -q 'Stage exact Tutor images on production VPS' .github/workflows/ithute-tutor-production.yml
          grep -q 'docker save' .github/workflows/ithute-tutor-production.yml
          grep -q 'gzip -dc.*docker load' scripts/ithute-tutor-deploy.sh
          grep -q 'docker image inspect.*BACKEND_IMAGE.*DEPLOY_SHA' scripts/ithute-tutor-deploy.sh
          grep -q 'docker image inspect.*FRONTEND_IMAGE.*DEPLOY_SHA' scripts/ithute-tutor-deploy.sh
          ! grep -q 'compose pull tutor-backend tutor-frontend' scripts/ithute-tutor-deploy.sh

          # A normal release recreates only Tutor containers and must never
          # remove sibling product containers just because Compose sees orphans.
          grep -q 'COMPOSE_IGNORE_ORPHANS=true' scripts/ithute-tutor-deploy.sh
          grep -q 'force-recreate tutor-backend' scripts/ithute-tutor-deploy.sh
          grep -q 'force-recreate tutor-frontend' scripts/ithute-tutor-deploy.sh
          ! grep -Eq '^[[:space:]]*(docker compose|compose).*--remove-orphans' scripts/ithute-tutor-deploy.sh
          ! grep -q 'ithute-pay' scripts/ithute-tutor-deploy.sh

          sh -n scripts/ithute-tutor-deploy.sh
          python3 -m py_compile scripts/ithute-tutor-sync-env.py

      - name: Build Tutor containers
        run: |
          set -eu
          docker build -t ithute-tutor-backend-ci products/ithute-tutor/sms_back_end
          docker build \
            --build-arg NEXT_PUBLIC_TUTOR_API_URL=/api \
            -t ithute-tutor-frontend-ci \
            products/ithute-tutor/sms-frontend

      - name: Verify Tutor backend startup import root
        run: |
          set -eu
          grep -q 'python -m scripts.ensure_central_auth_schema' products/ithute-tutor/sms_back_end/docker-entrypoint.sh
          grep -q 'python -m scripts.ensure_academic_core_schema' products/ithute-tutor/sms_back_end/docker-entrypoint.sh
          grep -q 'python -m scripts.ensure_student_transfer_schema' products/ithute-tutor/sms_back_end/docker-entrypoint.sh
          grep -q 'python -m scripts.ensure_learning_exchange_schema' products/ithute-tutor/sms_back_end/docker-entrypoint.sh
          docker run --rm --entrypoint sh ithute-tutor-backend-ci -c 'set -eu; cd /tmp; test "${PYTHONPATH:-}" = "/app"; python -c "import importlib; modules=(\"database.session\",\"scripts.ensure_central_auth_schema\",\"scripts.ensure_academic_core_schema\",\"scripts.ensure_student_transfer_schema\",\"scripts.ensure_learning_exchange_schema\"); [importlib.import_module(module) for module in modules]; print(\"Tutor startup modules resolve from the production image.\")"'
