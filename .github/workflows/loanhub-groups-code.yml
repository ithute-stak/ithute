name: LoanHub Groups Code Branch Build

on:
  push:
    branches:
      - groups/code
    paths:
      - .github/scripts/loanhub_groups_code.py
      - .github/workflows/loanhub-groups-code.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out groups/code
        uses: actions/checkout@v4
        with:
          ref: groups/code
          fetch-depth: 0

      - name: Make patch anchors duplicate-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path(".github/scripts/loanhub_groups_code.py")
          content = script.read_text(encoding="utf-8")
          old = '''    if count != 1:\n        raise RuntimeError(f"Expected exactly one match in {relative}, found {count}: {old[:120]!r}")\n'''
          new = '''    if count < 1:\n        raise RuntimeError(f"Expected at least one match in {relative}, found {count}: {old[:120]!r}")\n'''
          if old not in content:
              raise SystemExit("replace_once guard was not found")
          script.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply employer group implementation
        run: python .github/scripts/loanhub_groups_code.py

      - name: Compile LoanHub backend
        working-directory: products/LoanHub/apps/backend
        run: python -m compileall -q .

      - name: Install backend test dependencies
        working-directory: products/LoanHub/apps/backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run focused employer-group tests
        working-directory: products/LoanHub/apps/backend
        run: pytest -q tests/test_employer_groups.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/LoanHub/apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: products/LoanHub/apps/frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: products/LoanHub/apps/frontend
        run: npm run typecheck --if-present

      - name: Lint frontend
        working-directory: products/LoanHub/apps/frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: products/LoanHub/apps/frontend
        run: npm run build

      - name: Commit validated branch implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/loanhub_groups_code.py .github/workflows/loanhub-groups-code.yml
          git add products/LoanHub
          git commit -m "feat(loanhub): add employer groups and income pay-day classification"
          git push origin HEAD:groups/code
