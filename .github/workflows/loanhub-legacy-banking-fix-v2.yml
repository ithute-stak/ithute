name: LoanHub Legacy Banking Policy Fix V2

on:
  push:
    branches:
      - loanhub-legacy-banking-fix-v2
    paths:
      - '.github/workflows/loanhub-legacy-banking-fix-v2.yml'
      - '.github/scripts/loanhub_legacy_banking_fix.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: loanhub-legacy-banking-fix-v2

      - name: Apply Legacy banking policy patch
        run: python3 .github/scripts/loanhub_legacy_banking_fix.py

      - name: Compile backend
        working-directory: products/LoanHub/apps/backend
        run: python -m compileall -q .

      - name: Install backend dependencies and test runner
        working-directory: products/LoanHub/apps/backend
        run: pip install -r requirements.txt pytest

      - name: Run targeted banking regression tests
        working-directory: products/LoanHub/apps/backend
        run: python -m pytest -q tests/test_lesotho_banking_policy.py tests/test_legacy_cashout_schema.py

      - name: Install frontend dependencies
        working-directory: products/LoanHub/apps/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm lint

      - name: Build production frontend
        working-directory: products/LoanHub/apps/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.loanhub.co.ls/api/v1
        run: pnpm build

      - name: Commit validated Legacy banking policy repair
        run: |
          set -euo pipefail
          git config user.name 'ithute-stak'
          git config user.email 'thekoetlisi@ithute.co.ls'
          git add \
            'products/LoanHub/apps/frontend/app/(dashboard)/company/legacy-cashout-register/page.tsx' \
            'products/LoanHub/apps/backend/database/schemas/legacy_cashout.py' \
            'products/LoanHub/apps/backend/tests/test_legacy_cashout_schema.py'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Legacy banking changes to commit.'
            exit 1
          fi
          git commit -m 'fix(loanhub): enforce banking policy in legacy cashout'
          git push origin HEAD:loanhub-legacy-banking-fix-v2
