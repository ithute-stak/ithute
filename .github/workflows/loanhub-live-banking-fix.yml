name: LoanHub Live Banking Route Fix

on:
  push:
    branches: [loanhub-live-banking-fix]
    paths:
      - '.github/workflows/loanhub-live-banking-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: loanhub-live-banking-fix

      - name: Wire shared banking editor into live routes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          origination = Path('products/LoanHub/apps/frontend/app/(dashboard)/company/origination/new/page.tsx')
          borrower = Path('products/LoanHub/apps/frontend/app/(dashboard)/borrower/profile/page.tsx')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def remove_empty_bank(text: str, label: str) -> str:
              pattern = r'\nconst emptyBank = \([^\n]+\): BankAccountInput => \(\{.*?\n\}\);\n'
              updated, count = re.subn(pattern, '\n', text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: could not remove exactly one legacy emptyBank helper')
              return updated

          def replace_banking_step(text: str, replacement: str, label: str) -> str:
              start = text.find('function BankingStep({')
              if start < 0:
                  raise SystemExit(f'{label}: BankingStep start not found')
              end = text.find('\nfunction AffordabilityStep', start)
              if end < 0:
                  raise SystemExit(f'{label}: AffordabilityStep boundary not found')
              return text[:start] + replacement.rstrip() + '\n' + text[end:]

          orig_text = origination.read_text()
          orig_text = replace_once(
              orig_text,
              'import { originationApi } from "@/api/origination";\n',
              'import { originationApi } from "@/api/origination";\nimport { BankAccountsStep } from "@/components/clients/bank-accounts-step";\n',
              'origination import',
          )
          orig_text = remove_empty_bank(orig_text, 'origination')
          orig_text = replace_banking_step(
              orig_text,
              '''function BankingStep({
            values,
            onChange,
            identityName,
          }: {
            values: BankAccountInput[];
            onChange: (value: BankAccountInput[]) => void;
            identityName: string;
          }) {
            return (
              <BankAccountsStep
                values={values}
                onChange={onChange}
                identityName={identityName}
                allowVerification
                allowTokenizedCard
                ownerLabel="Borrower"
              />
            );
          }''',
              'origination',
          )
          if 'Field label="Bank name"><Input' in orig_text:
              raise SystemExit('origination: legacy free-text bank input still present')
          origination.write_text(orig_text)

          borrower_text = borrower.read_text()
          borrower_text = replace_once(
              borrower_text,
              'import { BorrowerEvaluationEvidence } from "@/components/borrower/borrower-evaluation-evidence";\n',
              'import { BorrowerEvaluationEvidence } from "@/components/borrower/borrower-evaluation-evidence";\nimport { BankAccountsStep } from "@/components/clients/bank-accounts-step";\n',
              'borrower import',
          )
          borrower_text = remove_empty_bank(borrower_text, 'borrower')
          borrower_text = replace_banking_step(
              borrower_text,
              '''function BankingStep({ values, onChange, identityName }: {
            values: BankAccountInput[];
            onChange: (value: BankAccountInput[]) => void;
            identityName: string;
          }) {
            return (
              <BankAccountsStep
                values={values}
                onChange={onChange}
                identityName={identityName}
                ownerLabel="My"
              />
            );
          }''',
              'borrower',
          )
          if 'Field label="Bank name"><Input' in borrower_text:
              raise SystemExit('borrower: legacy free-text bank input still present')
          borrower.write_text(borrower_text)

          print('Live origination and borrower banking routes now use BankAccountsStep.')
          PY

      - name: Install frontend dependencies
        working-directory: products/LoanHub/apps/frontend
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm typecheck

      - name: Lint frontend (errors block; existing warnings remain visible)
        working-directory: products/LoanHub/apps/frontend
        run: pnpm lint

      - name: Build production frontend
        working-directory: products/LoanHub/apps/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.loanhub.co.ls/api/v1
        run: pnpm build

      - name: Commit only validated live-route wiring
        run: |
          set -euo pipefail
          git config user.name 'ithute-stak'
          git config user.email 'thekoetlisi@ithute.co.ls'
          git add \
            'products/LoanHub/apps/frontend/app/(dashboard)/company/origination/new/page.tsx' \
            'products/LoanHub/apps/frontend/app/(dashboard)/borrower/profile/page.tsx'
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No route changes to commit.'
            exit 1
          fi
          git commit -m 'fix(loanhub): wire banking policy into live routes'
          git push origin HEAD:loanhub-live-banking-fix
