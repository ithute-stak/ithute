name: LoanHub Owner Payment Backdate

on:
  push:
    branches:
      - loanhub-owner-payment-backdate
    paths:
      - '.github/workflows/loanhub-owner-payment-backdate.yml'
      - '.github/scripts/loanhub_owner_payment_backdate.py'
      - '.github/scripts/prepare_owner_payment_backdate_patch.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: loanhub-owner-payment-backdate

      - name: Prepare scope-aware patch
        run: python3 .github/scripts/prepare_owner_payment_backdate_patch.py

      - name: Apply owner-only payment backdate patch
        run: python3 .github/scripts/loanhub_owner_payment_backdate.py

      - name: Compile backend
        working-directory: products/LoanHub/apps/backend
        run: python -m compileall -q .

      - name: Install backend dependencies and pytest
        working-directory: products/LoanHub/apps/backend
        run: pip install -r requirements.txt pytest

      - name: Run payment backdating tests
        working-directory: products/LoanHub/apps/backend
        run: python -m pytest -q tests/test_payment_backdating_policy.py

      - name: Install frontend dependencies
        working-directory: products/LoanHub/apps/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm lint

      - name: Build production frontend
        working-directory: products/LoanHub/apps/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.loanhub.co.ls/api/v1
        run: pnpm build

      - name: Commit validated product changes
        run: |
          set -euo pipefail
          git config user.name 'ithute-stak'
          git config user.email 'thekoetlisi@ithute.co.ls'
          git add \
            'products/LoanHub/apps/backend/utils/payment_dates.py' \
            'products/LoanHub/apps/backend/database/schemas/cash.py' \
            'products/LoanHub/apps/backend/routers/loans.py' \
            'products/LoanHub/apps/backend/services/loan_service.py' \
            'products/LoanHub/apps/backend/services/accounting_service.py' \
            'products/LoanHub/apps/backend/services/treasury_service.py' \
            'products/LoanHub/apps/backend/tests/test_payment_backdating_policy.py' \
            'products/LoanHub/apps/frontend/api/loans.ts' \
            'products/LoanHub/apps/frontend/app/(dashboard)/company/cashier/page.tsx'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 1
          fi
          git commit -m 'feat(loanhub): allow owner-only backdated repayments'
          git push origin HEAD:loanhub-owner-payment-backdate
