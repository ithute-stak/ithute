name: LoanHub Owner Payment Backdating Audit

on:
  push:
    branches:
      - loanhub-owner-payment-backdating
    paths:
      - '.github/workflows/loanhub-owner-payment-backdating-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loanhub-owner-payment-backdating
      - name: Locate payment write paths
        run: |
          cd products/LoanHub
          echo '=== CashRepaymentCreate ==='
          rg -n 'CashRepaymentCreate|cash.?repayment|repayment.*cash' apps/backend apps/frontend || true
          echo '=== Opening fee settlement ==='
          rg -n 'CashOpeningFeeSettlementCreate|opening.?fee.*settle|settle.*opening.?fee' apps/backend apps/frontend || true
          echo '=== External debt payments ==='
          rg -n 'ExternalDebtPaymentCreate|paid_on' apps/backend apps/frontend || true
          echo '=== PaymentTransaction writes ==='
          rg -n 'PaymentTransaction\(' apps/backend | head -n 200 || true
          echo '=== Payment API calls / UI ==='
          rg -n 'repayment|opening-fee|external-debt|payment_date|paid_on' apps/frontend/app apps/frontend/components apps/frontend/lib | head -n 500 || true
