name: LoanHub Product Production

on:
  push:
    branches: [main]
    paths:
      - 'products/LoanHub/**'
      - '.github/workflows/loanhub-product-production.yml'
  workflow_dispatch:

concurrency:
  group: ithute-edge-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ithute-stak/loanhub-backend
  FRONTEND_IMAGE: ghcr.io/ithute-stak/loanhub-frontend
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_PLATFORM_ROOT: /home/administrator/mailbox-dns
  LOANHUB_RUNTIME_DIR: loanhub
  LEGACY_LOANHUB_DIR: /opt/loanhub
  PRODUCT_DIR: products/LoanHub
  PRODUCTION_API_URL: https://api.loanhub.co.ls/api/v1
  GHCR_USERNAME: ithute-stak

jobs:
  validate:
    name: Validate LoanHub product deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ithute repository
        uses: actions/checkout@v6

      - name: Validate product Compose manifest
        working-directory: products/LoanHub
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.edge-nginx.yml config -q
          docker compose -f compose.yaml -f compose.edge-nginx.yml --profile production config -q

      - name: Compile backend
        working-directory: products/LoanHub/apps/backend
        run: python -m compileall -q .

      - name: Verify production data invariants
        run: |
          set -eu
          grep -Fq 'name: ${COMPOSE_PROJECT_NAME:-loanhub}' products/LoanHub/compose.yaml
          grep -Fq -- '- postgres_data:/var/lib/postgresql/data' products/LoanHub/compose.yaml
          grep -Fq 'COMPOSE_PROJECT_NAME=loanhub' products/LoanHub/.env.production.example
          grep -Fq 'profiles: ["legacy-caddy"]' products/LoanHub/compose.edge-nginx.yml
          grep -Fq 'edge-nginx:' products/LoanHub/compose.edge-nginx.yml
          grep -Fq 'certbot:' products/LoanHub/compose.edge-nginx.yml

  build-and-publish:
    name: Build LoanHub product images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ithute repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push LoanHub backend
        uses: docker/build-push-action@v7
        with:
          context: ./products/LoanHub/apps/backend
          file: ./products/LoanHub/apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push LoanHub frontend
        uses: docker/build-push-action@v7
        with:
          context: ./products/LoanHub/apps/frontend
          file: ./products/LoanHub/apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PRODUCTION_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-to-existing-loanhub-vps:
    name: Deploy LoanHub under Ithute platform root
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ithute repository
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY must be configured in the Ithute repository or organization Actions secrets"
            exit 1
          fi

      - name: Copy LoanHub production manifests to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: products/LoanHub/compose.yaml,products/LoanHub/compose.edge-nginx.yml,products/LoanHub/infra/nginx-edge/default.conf.template,products/LoanHub/infra/nginx-edge/ithute-tls.conf,products/LoanHub/infra/nginx-edge/bootstrap-cert.sh
          target: /tmp/ithute-loanhub-${{ github.sha }}
          overwrite: true

      - name: Deploy into the Ithute mother runtime
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 30m
          envs: GHCR_TOKEN
          script: |
            set -eu

            PLATFORM_ROOT='${{ env.VPS_PLATFORM_ROOT }}'
            APP_DIR="$PLATFORM_ROOT/${{ env.LOANHUB_RUNTIME_DIR }}"
            LEGACY_APP_DIR='${{ env.LEGACY_LOANHUB_DIR }}'
            SRC='/tmp/ithute-loanhub-${{ github.sha }}/products/LoanHub'

            test -d "$PLATFORM_ROOT"
            test -f "$SRC/compose.yaml"
            test -f "$SRC/compose.edge-nginx.yml"
            test -f "$SRC/infra/nginx-edge/default.conf.template"
            test -f "$SRC/infra/nginx-edge/ithute-tls.conf"
            test -f "$SRC/infra/nginx-edge/bootstrap-cert.sh"

            mkdir -p "$APP_DIR/infra/nginx-edge" "$APP_DIR/backups" "$APP_DIR/secrets"

            # First migration from /opt/loanhub: copy only production identity/config.
            # The old directory remains untouched as a rollback reference.
            if [ ! -s "$APP_DIR/.env.production" ]; then
              if [ -s "$LEGACY_APP_DIR/.env.production" ]; then
                cp -p "$LEGACY_APP_DIR/.env.production" "$APP_DIR/.env.production"
              else
                echo "Missing LoanHub .env.production in both $APP_DIR and $LEGACY_APP_DIR." >&2
                exit 1
              fi
            fi
            if [ -d "$LEGACY_APP_DIR/secrets" ] && [ -z "$(find "$APP_DIR/secrets" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              cp -a "$LEGACY_APP_DIR/secrets/." "$APP_DIR/secrets/"
            fi

            cp "$SRC/compose.yaml" "$APP_DIR/compose.yaml"
            cp "$SRC/compose.edge-nginx.yml" "$APP_DIR/compose.edge-nginx.yml"
            cp "$SRC/infra/nginx-edge/default.conf.template" "$APP_DIR/infra/nginx-edge/default.conf.template"
            cp "$SRC/infra/nginx-edge/ithute-tls.conf" "$APP_DIR/infra/nginx-edge/ithute-tls.conf"
            cp "$SRC/infra/nginx-edge/bootstrap-cert.sh" "$APP_DIR/infra/nginx-edge/bootstrap-cert.sh"
            chmod 700 "$APP_DIR/infra/nginx-edge/bootstrap-cert.sh"
            cd "$APP_DIR"

            set -a
            . ./.env.production
            set +a

            export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-loanhub}"
            export LOANHUB_ENV_FILE=.env.production
            export LOANHUB_BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}'
            export LOANHUB_FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}'
            export LOANHUB_IMAGE_TAG='${{ github.sha }}'
            export TLS_EMAIL="${TLS_EMAIL:-admin@ithute.co.ls}"

            compose() {
              docker compose --env-file .env.production -f compose.yaml -f compose.edge-nginx.yml --profile production "$@"
            }

            EXPECTED_DB_VOLUME="${COMPOSE_PROJECT_NAME}_postgres_data"
            if ! docker volume inspect "$EXPECTED_DB_VOLUME" >/dev/null 2>&1; then
              echo "Expected existing LoanHub database volume not found: $EXPECTED_DB_VOLUME" >&2
              echo 'Deployment aborted before Docker can create an empty replacement volume.' >&2
              exit 1
            fi

            docker network inspect mailbox-dns_mailbox_dns >/dev/null 2>&1 || docker network create mailbox-dns_mailbox_dns
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ env.GHCR_USERNAME }}' --password-stdin

            compose config -q
            compose pull backend frontend edge-nginx certbot db redis

            # Reuse the existing database and Redis volumes. Never use down -v here.
            compose up -d --no-build db redis

            DB_CONTAINER="$(compose ps -q db)"
            if [ -z "$DB_CONTAINER" ]; then
              echo 'LoanHub database container did not start.' >&2
              exit 1
            fi

            ACTUAL_DB_VOLUME="$(docker inspect "$DB_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')"
            if [ "$ACTUAL_DB_VOLUME" != "$EXPECTED_DB_VOLUME" ]; then
              echo "LoanHub database volume mismatch. Expected $EXPECTED_DB_VOLUME, got ${ACTUAL_DB_VOLUME:-none}." >&2
              echo 'Deployment aborted before migration.' >&2
              exit 1
            fi

            # Mandatory pre-migration database backup. A failed or empty dump stops deployment.
            BACKUP_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_FILE="$APP_DIR/backups/loanhub-pre-migrate-${BACKUP_STAMP}-${{ github.sha }}.dump"
            compose exec -T db \
              pg_dump -U "${DB_USER:-loanhub}" -d "${DB_NAME:-loan_db}" -Fc > "$BACKUP_FILE"
            if [ ! -s "$BACKUP_FILE" ]; then
              echo 'Pre-migration PostgreSQL backup is empty or missing; aborting.' >&2
              exit 1
            fi
            sha256sum "$BACKUP_FILE" > "${BACKUP_FILE}.sha256"

            # Apply only forward Alembic migrations against the verified existing volume.
            compose run --rm --no-deps migrate
            compose up -d --no-build backend maintenance frontend

            # The dedicated shared-edge workflow performs the first certificate
            # migration with rollback. Product deploys only take over the edge
            # after that certificate already exists.
            edge_cert_ready=false
            if compose run --rm --no-deps --entrypoint /bin/sh certbot \
              -c 'test -s /etc/letsencrypt/live/ithute-edge/fullchain.pem && test -s /etc/letsencrypt/live/ithute-edge/privkey.pem'; then
              edge_cert_ready=true
            fi

            if [ "$edge_cert_ready" = true ]; then
              docker ps \
                --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                --filter 'label=com.docker.compose.service=caddy' \
                -q | xargs -r docker rm -f
              compose up -d --no-build edge-nginx certbot
              compose exec -T edge-nginx nginx -t
            else
              echo 'Nginx certificate is not present yet; leaving the existing Caddy edge running until the shared-edge migration completes.'
            fi
            compose ps

            for url in https://api.loanhub.co.ls/health/ready https://loanhub.co.ls/; do
              healthy=false
              for attempt in $(seq 1 30); do
                if curl -fsS "$url" >/dev/null; then
                  healthy=true
                  break
                fi
                sleep 5
              done
              if [ "$healthy" != true ]; then
                echo "Production health check failed: $url" >&2
                compose logs --tail=200 edge-nginx certbot >&2 || true
                exit 1
              fi
            done

            if [ "$edge_cert_ready" = true ]; then
              curl -fsS --retry 12 --retry-delay 5 https://auth.ithute.co.ls/healthz >/dev/null
            fi

            docker logout ghcr.io >/dev/null 2>&1 || true
            printf '%s\n' \
              "LoanHub runtime: $APP_DIR" \
              "Preserved database volume: $EXPECTED_DB_VOLUME" \
              "Pre-migration backup: $BACKUP_FILE" \
              "Shared edge ready: $edge_cert_ready" \
              "Legacy runtime retained: $LEGACY_APP_DIR"
