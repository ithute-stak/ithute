name: LoanHub Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'products/LoanHub/**'
      - '.github/workflows/loanhub-quality.yml'
      - '.github/workflows/loanhub-product-production.yml'
  push:
    branches: [main]
    paths:
      - 'products/LoanHub/**'
      - '.github/workflows/loanhub-quality.yml'
      - '.github/workflows/loanhub-product-production.yml'
  workflow_dispatch:

concurrency:
  group: loanhub-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Backend, security, DR, browser E2E and frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: products/LoanHub
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      FERNET_SECRET_KEY: ci-only-fernet-key-not-for-production
      JWT_PRIVATE_KEY_PATH: /tmp/loanhub-ci-jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/loanhub-ci-jwt-public.pem
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/loan_db
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://127.0.0.1:3000
      AUTH_RATE_LIMIT: 5/minute
      TREASURY_AUTO_SUBMIT_ENABLED: 'false'
      MIDNIGHT_REPORTS_ENABLED: 'false'
      COLLECTION_DAILY_REPORT_ENABLED: 'false'
      PRODUCTION_API_URL: https://api.loanhub.co.ls/api/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d loan_db"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            products/LoanHub/apps/backend/requirements.txt
            products/LoanHub/apps/backend/requirements-dev.txt

      - name: Install backend and security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt

      - name: Generate ephemeral CI JWT keys
        run: |
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          Path('/tmp/loanhub-ci-jwt-private.pem').write_bytes(key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          ))
          Path('/tmp/loanhub-ci-jwt-public.pem').write_bytes(key.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          PY

      - name: Repository secret scan
        run: python scripts/secret_scan.py

      - name: Static application security testing
        run: python -m bandit -r apps/backend -x apps/backend/tests -lll

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate

      - name: Install frontend dependencies
        working-directory: products/LoanHub/apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Compile backend
        working-directory: products/LoanHub/apps/backend
        run: python -m compileall -q .

      - name: Run complete backend test suite
        working-directory: products/LoanHub/apps/backend
        run: python -m pytest -q

      - name: Validate Alembic migration graph on PostgreSQL
        working-directory: products/LoanHub/apps/backend
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic upgrade head
          python -m alembic current

      - name: Validate double-entry accounting integrity
        run: python scripts/accounting_integrity_check.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run PostgreSQL backup and restore disaster-recovery drill
        env:
          PGPASSWORD: postgres
          DRILL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loan_db_drill
        run: |
          createdb -h 127.0.0.1 -U postgres loan_db_drill
          trap 'dropdb -h 127.0.0.1 -U postgres --if-exists loan_db_drill' EXIT
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/loan_db bash ./scripts/drill_backup_restore.sh

      - name: Type-check frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: products/LoanHub/apps/frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: products/LoanHub/apps/frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: pnpm build

      - name: Install Chromium for browser E2E
        timeout-minutes: 5
        run: python -m playwright install chromium

      - name: Run real browser and API E2E gate
        env:
          LOANHUB_WEB_BASE_URL: http://127.0.0.1:3000
          LOANHUB_API_BASE_URL: http://127.0.0.1:8000
          LOANHUB_E2E_PHONE: '59000000'
          LOANHUB_E2E_PASSWORD: 'CI-LoanHub-E2E-Password-2026!'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          python apps/backend/scripts/create_superadmin.py \
            --phone "$LOANHUB_E2E_PHONE" --email ci-owner@example.com \
            --first-name CI --last-name Owner --password "$LOANHUB_E2E_PASSWORD"
          (cd apps/backend && python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/loanhub-api.log 2>&1 & echo $! > /tmp/loanhub-api.pid)
          (cd apps/frontend && NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" pnpm dev --hostname 127.0.0.1 > /tmp/loanhub-web.log 2>&1 & echo $! > /tmp/loanhub-web.pid)
          cleanup() { kill "$(cat /tmp/loanhub-api.pid)" "$(cat /tmp/loanhub-web.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then ready=true; break; fi
            sleep 1
          done
          [ "$ready" = true ] || { cat /tmp/loanhub-api.log /tmp/loanhub-web.log; exit 1; }
          python -m pytest -q apps/backend/tests/e2e/test_browser_lending_journey.py
          python scripts/dast_smoke.py

      - name: Validate production scripts and Compose
        run: |
          bash -n scripts/deploy_hostinger.sh
          bash -n scripts/prepare_production_env.sh
          bash -n scripts/production_preflight.sh
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile production config >/dev/null

      - name: Smoke-build production images
        run: |
          docker build --pull --tag loanhub-backend-ci:${{ github.sha }} ./apps/backend
          docker build --pull --build-arg NEXT_PUBLIC_API_URL="$PRODUCTION_API_URL" --tag loanhub-frontend-ci:${{ github.sha }} ./apps/frontend
