name: Multi-Engine CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "engines/**"
      - "apps/backend/Dockerfile"
      - "apps/backend/app/services/engine_runtime.py"
      - "apps/backend/app/services/engine_router.py"
      - "apps/backend/app/api/v1/engine_operations.py"
      - "apps/backend/app/api/v1/router.py"
      - "apps/backend/app/api/v1/infrastructure_servers.py"
      - "apps/backend/tests/test_engine_runtime.py"
      - "apps/backend/tests/test_engine_router.py"
      - "apps/backend/tests/test_engine_operations.py"
      - "apps/backend/tests/test_webmail_message_resilience.py"
      - "apps/backend/tests/test_platform_mail_attachments.py"
      - "apps/backend/tests/test_dmarc_reports.py"
      - "apps/backend/tests/test_deliverability.py"
      - "apps/backend/tests/test_domain_mail_health.py"
      - "apps/backend/tests/test_edge_platform.py"
      - "apps/backend/tests/test_security_hardening.py"
      - "apps/backend/tests/test_audit_integrity.py"
      - "apps/backend/tests/test_infrastructure_monitoring.py"
      - "apps/backend/app/services/dmarc_reports.py"
      - "apps/backend/app/services/deliverability.py"
      - "apps/backend/app/services/domain_mail_health.py"
      - "apps/backend/app/services/reputation.py"
      - "apps/backend/app/services/edge_inspection.py"
      - "apps/backend/app/services/security_audit.py"
      - "apps/backend/app/services/audit_integrity.py"
      - "apps/backend/app/api/v1/deliverability.py"
      - "apps/backend/app/services/webmail.py"
      - "apps/backend/app/services/platform_mail_attachments.py"
      - "apps/backend/app/services/metrics.py"
      - "apps/backend/benchmarks/**"
      - ".github/workflows/multi-engine-ci.yml"
      - ".github/workflows/release-images.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-multiengine-secret-key-000000000000000000000000
      DATABASE_URL: postgresql+psycopg://ithute:unused@127.0.0.1:5432/ithute_unused
      ENVIRONMENT: test
      PLATFORM_MODE: bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate shared engine contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path("contracts/engine-task.schema.json").read_text())
          assert schema["properties"]["engine"]["enum"] == ["python", "rust", "go", "cpp", "java"]
          assert set(schema["required"]) == {"version", "task_id", "engine", "operation", "payload"}
          PY

      - name: Test Rust safe core
        working-directory: engines/rust-core
        run: cargo test --release --locked

      - name: Test Go worker
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - name: Build and test Go worker
        working-directory: engines/go-worker
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/worker

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java worker
        run: |
          mkdir -p /tmp/ithute-java/classes
          javac --release 21 --add-modules jdk.httpserver -d /tmp/ithute-java/classes $(find engines/java-worker/src -name '*.java')

      - name: Test C++ turbo library
        run: |
          cmake -S engines/cpp-native -B /tmp/ithute-cpp-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ithute-cpp-build --parallel 2
          ctest --test-dir /tmp/ithute-cpp-build --output-on-failure

      - name: Test Python engine fallback
        working-directory: apps/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pytest -q tests/test_engine_runtime.py tests/test_engine_router.py tests/test_engine_operations.py tests/test_webmail_message_resilience.py tests/test_platform_mail_attachments.py tests/test_dmarc_reports.py tests/test_infrastructure_monitoring.py

      - name: Build API with native engines
        run: |
          docker build --pull -f apps/backend/Dockerfile -t ithute-app-api:engine-ci .
          docker run --rm -i --entrypoint python ithute-app-api:engine-ci - <<'PY'
          from app.services.engine_runtime import engine_status, sample_native_result
          status = engine_status()
          assert status["brain"]["authoritative"] is True
          assert status["engines"]["rust"]["available"] is True
          assert status["engines"]["cpp"]["available"] is True
          from app.services.engine_runtime import hmac_sha256
          result = sample_native_result(b"Subject: engine\\n\\nbody")
          hmac_value, hmac_engine = hmac_sha256(b"key", b"audit")
          assert hmac_engine == "rust"
          assert len(hmac_value) == 64
          assert result["stats_engine"] == "rust"
          assert result["mime_engine"] == "rust"
          assert result["sha256_engine"] == "rust"
          assert result["fingerprint_engine"] == "cpp"
          print(result)
          PY
          docker run --rm --entrypoint python ithute-app-api:engine-ci -m benchmarks.benchmark_mime_scan
          docker run --rm --entrypoint python ithute-app-api:engine-ci -m benchmarks.benchmark_sha256
          docker run --rm --entrypoint python ithute-app-api:engine-ci -m benchmarks.benchmark_blob_profile

      - name: Build and test Java worker image
        run: |
          docker build --pull -t ithute-java-worker:engine-ci engines/java-worker
          container="$(docker run -d -p 18081:8080 ithute-java-worker:engine-ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz | grep -q '"engine":"java"'; then
              break
            fi
            sleep 1
          done
          curl -fsS -X POST -H 'Content-Type: application/xml' --data-binary @engines/java-worker/testdata/dmarc-sample.xml             http://127.0.0.1:18081/v1/dmarc/parse > /tmp/dmarc-java.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/dmarc-java.json'))
          assert body['engine']=='java'
          assert body['policy']['domain']=='example.com'
          assert body['summary']['total_messages']==10
          assert body['summary']['passed_messages']==8
          assert body['summary']['failed_messages']==2
          assert body['summary']['pass_rate_percent']==80.0
          assert len(body['records'])==2
          PY
          printf '%s' '<!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><feedback>&xxe;</feedback>' > /tmp/xxe.xml
          code="$(curl -sS -o /tmp/xxe-response.json -w '%{http_code}' -X POST -H 'Content-Type: application/xml' --data-binary @/tmp/xxe.xml http://127.0.0.1:18081/v1/dmarc/parse)"
          test "$code" = "422"
          printf '%s' '<invoice xmlns="urn:ithute:test" id="A1"><line qty="2">Service</line><line qty="1">Hosting</line></invoice>' > /tmp/enterprise.xml
          curl -fsS -X POST -H 'Content-Type: application/xml' --data-binary @/tmp/enterprise.xml \
            http://127.0.0.1:18081/v1/xml/inspect > /tmp/enterprise-java.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/enterprise-java.json'))
          assert body['engine']=='java'
          assert body['root']=='invoice'
          assert body['namespace']=='urn:ithute:test'
          assert body['element_count']==3
          assert body['attribute_count']==3
          assert body['max_depth']==2
          assert body['top_elements'][0]=={'name':'line','count':2}
          PY
          code="$(curl -sS -o /tmp/xml-xxe.json -w '%{http_code}' -X POST -H 'Content-Type: application/xml' --data-binary @/tmp/xxe.xml http://127.0.0.1:18081/v1/xml/inspect)"
          test "$code" = "422"

      - name: Build Go worker image
        run: |
          docker build --pull -t ithute-go-worker:engine-ci engines/go-worker
          container="$(docker run -d -p 18080:8080 ithute-go-worker:engine-ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"engine":"go"'; then
              break
            fi
            sleep 1
          done
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"targets":[{"id":"self","host":"127.0.0.1","port":8080,"timeout_ms":500}],"concurrency":4}' \
            http://127.0.0.1:18080/v1/network/probe > /tmp/go-network-probe.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/go-network-probe.json'))
          assert body['engine']=='go'
          assert body['checked']==1
          assert body['results'][0]['id']=='self'
          assert body['results'][0]['reachable'] is True
          PY
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"queries":[{"id":"localhost","name":"localhost","type":"A","timeout_ms":1000}],"concurrency":2}' \
            http://127.0.0.1:18080/v1/dns/lookup > /tmp/go-dns.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/go-dns.json'))
          assert body['engine']=='go'
          assert body['checked']==1
          assert body['results'][0]['id']=='localhost'
          assert body['results'][0]['values']
          PY
