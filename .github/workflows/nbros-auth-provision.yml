name: Provision NBros Central Auth Login

on:
  workflow_run:
    workflows: ["Deploy NBros Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ithute-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_PLATFORM_ROOT: /home/administrator/mailbox-dns
  NBROS_ADMIN_EMAIL: justy@ithute.co.ls

jobs:
  provision:
    name: Provision and verify NBros login
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      NBROS_ADMIN_PASSWORD: ${{ secrets.NBROS_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate required production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_KEY:-}" || { echo '::error::VPS_SSH_KEY is required'; exit 1; }
          test -n "${NBROS_ADMIN_PASSWORD:-}" || { echo '::error::NBROS_ADMIN_PASSWORD is required'; exit 1; }
          test "${#NBROS_ADMIN_PASSWORD}" -ge 12 || { echo '::error::NBROS_ADMIN_PASSWORD must be at least 12 characters'; exit 1; }

      - name: Validate provisioner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile platform/ithute-auth/scripts/provision_nbros_user.py
          ! grep -Fq 'NBROS_ADMIN_PASSWORD=' platform/ithute-auth/scripts/provision_nbros_user.py

      - name: Configure production SSH identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/nbros_auth_provision"
          chmod 600 "$HOME/.ssh/nbros_auth_provision"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/nbros-auth-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/nbros-auth-askpass.sh
            SSH_ASKPASS=/tmp/nbros-auth-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/nbros_auth_provision" </dev/null
            rm -f /tmp/nbros-auth-askpass.sh
          else
            ssh-add "$HOME/.ssh/nbros_auth_provision" </dev/null
          fi
          cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage provisioner and runtime-only password
        shell: bash
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          secret_file="/tmp/nbros-auth-secret-${GITHUB_RUN_ID}"
          printf '%s\n' "$NBROS_ADMIN_PASSWORD" > /tmp/nbros-admin-password
          chmod 600 /tmp/nbros-admin-password
          scp platform/ithute-auth/scripts/provision_nbros_user.py \
            "$remote:/tmp/provision-nbros-user-${GITHUB_RUN_ID}.py"
          scp /tmp/nbros-admin-password "$remote:$secret_file"
          rm -f /tmp/nbros-admin-password
          ssh "$remote" "chmod 600 '$secret_file' '/tmp/provision-nbros-user-${GITHUB_RUN_ID}.py'"

      - name: Provision account in central Ithute Auth
        shell: bash
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" \
            "PLATFORM_ROOT='$VPS_PLATFORM_ROOT' NBROS_ADMIN_EMAIL='$NBROS_ADMIN_EMAIL' RUN_ID='$GITHUB_RUN_ID' sh -s" <<'REMOTE'
          set -eu
          secret_file="/tmp/nbros-auth-secret-${RUN_ID}"
          provisioner="/tmp/provision-nbros-user-${RUN_ID}.py"
          cleanup() {
            rm -f "$secret_file" "$provisioner" /tmp/nbros-auth-token.json
          }
          trap cleanup EXIT HUP INT TERM

          if command -v flock >/dev/null 2>&1; then
            exec 9>/tmp/ithute-production.lock
            attempt=1
            while ! flock -n 9; do
              [ "$attempt" -lt 120 ] || { echo 'Timed out waiting for shared Ithute production lock.' >&2; exit 1; }
              sleep 5
              attempt=$((attempt + 1))
            done
          fi

          [ -s "$secret_file" ] || { echo 'NBros password staging file is missing.' >&2; exit 1; }
          [ -s "$provisioner" ] || { echo 'NBros Auth provisioner is missing.' >&2; exit 1; }
          NBROS_ADMIN_PASSWORD="$(cat "$secret_file")"
          [ "${#NBROS_ADMIN_PASSWORD}" -ge 12 ] || { echo 'NBros password is invalid.' >&2; exit 1; }

          cd "$PLATFORM_ROOT"
          [ -s .env ] || { echo 'Central Ithute production .env is missing.' >&2; exit 1; }
          COMPOSE_FILES='-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ithute-platform.yml -f docker-compose.deploy.yml'
          compose() {
            docker compose --env-file .env $COMPOSE_FILES "$@"
          }
          compose config >/dev/null

          auth_id="$(compose ps -q ithute-auth)"
          [ -n "$auth_id" ] || { echo 'Central Ithute Auth container is not running.' >&2; exit 1; }
          auth_state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$auth_id")"
          case "$auth_state" in healthy|running) ;; *) echo "Central Ithute Auth is not healthy: $auth_state" >&2; exit 1 ;; esac

          NBROS_ADMIN_EMAIL="$NBROS_ADMIN_EMAIL" \
          NBROS_ADMIN_PASSWORD="$NBROS_ADMIN_PASSWORD" \
            compose exec -T \
              -e NBROS_ADMIN_EMAIL \
              -e NBROS_ADMIN_PASSWORD \
              ithute-auth python - < "$provisioner"

          # Prove the password hash saved by the provisioner can be verified by
          # the very Auth container that serves Central Ithute Auth. This never
          # emits the password, hash, token, or any other secret material.
          NBROS_ADMIN_EMAIL="$NBROS_ADMIN_EMAIL" \
          NBROS_ADMIN_PASSWORD="$NBROS_ADMIN_PASSWORD" \
            compose exec -T \
              -e NBROS_ADMIN_EMAIL \
              -e NBROS_ADMIN_PASSWORD \
              ithute-auth python - <<'PY'
          import os
          from sqlalchemy import select

          from app.db import SessionLocal
          from app.models import User
          from app.security import normalize_email, verify_password

          email = normalize_email(os.environ["NBROS_ADMIN_EMAIL"])
          password = os.environ["NBROS_ADMIN_PASSWORD"]
          with SessionLocal() as db:
              user = db.scalar(select(User).where(User.email == email))
              if user is None or not user.is_active:
                  raise SystemExit("Provisioned NBros account is unavailable in deployed Ithute Auth")
              if not verify_password(password, user.password_hash):
                  raise SystemExit("Provisioned NBros password hash does not verify in deployed Ithute Auth")
          print("Provisioned NBros credential verified inside deployed Ithute Auth.")
          PY

          # Verify the exact central email/password flow for the NBros client
          # without printing the credential or returned bearer token.
          payload="$(NBROS_ADMIN_EMAIL="$NBROS_ADMIN_EMAIL" NBROS_ADMIN_PASSWORD="$NBROS_ADMIN_PASSWORD" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'identifier': os.environ['NBROS_ADMIN_EMAIL'],
              'password': os.environ['NBROS_ADMIN_PASSWORD'],
              'client_id': 'nbros',
          }))
          PY
          )"
          login_code="$(curl --silent --show-error \
            --connect-timeout 8 --max-time 20 \
            -o /tmp/nbros-auth-token.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d "$payload" \
            https://auth.ithute.co.ls/v1/auth/login)"
          if [ "$login_code" != "200" ]; then
            echo "Public Central Auth login returned HTTP $login_code after the credential verified inside its deployed container." >&2
            echo "This indicates that public Auth routing is not reaching the provisioned Auth service/database." >&2
            exit 1
          fi
          token="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/nbros-auth-token.json'))
          token=data.get('access_token','')
          if not token:
              raise SystemExit('Central Auth login returned no access token')
          print(token)
          PY
          )"
          curl --fail --silent --show-error \
            --connect-timeout 8 --max-time 20 \
            -H "Authorization: Bearer $token" \
            https://auth.ithute.co.ls/v1/me \
            | NBROS_ADMIN_EMAIL="$NBROS_ADMIN_EMAIL" python3 -c "import json,os,sys; data=json.load(sys.stdin); assert data.get('email')==os.environ['NBROS_ADMIN_EMAIL']"

          # Verify the NBros same-origin password form can complete and create a
          # product session through Central Auth.
          headers="$(mktemp)"
          curl --silent --show-error \
            --connect-timeout 8 --max-time 20 \
            -D "$headers" -o /dev/null \
            -X POST \
            --data-urlencode "identifier=$NBROS_ADMIN_EMAIL" \
            --data-urlencode "password=$NBROS_ADMIN_PASSWORD" \
            https://nbro.ithute.co.ls/api/auth/password
          grep -Eq '^HTTP/[^ ]+ 303' "$headers"
          grep -Eiq '^location: https://nbro\.ithute\.co\.ls/fleet' "$headers"
          grep -Eiq '^set-cookie: nbros_access=' "$headers"
          grep -Eiq '^set-cookie: nbros_refresh=' "$headers"
          rm -f "$headers"

          echo 'NBros email/password login and Central Ithute Auth verification passed.'
          REMOTE
