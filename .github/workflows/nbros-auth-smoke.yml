name: NBros Auth Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "products/nbros/apps/frontend/**"
      - "platform/ithute-auth/**"
      - ".github/workflows/nbros-auth-smoke.yml"
  push:
    branches: ["hotfix/nbros-auth-smoke-diagnostics"]
    paths:
      - ".github/workflows/nbros-auth-smoke.yml"
  workflow_run:
    workflows: ["Deploy NBros Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Simple login contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify NBros delegates credentials to Central Auth
        run: |
          set -euo pipefail
          grep -Fq 'action="/api/auth/password"' products/nbros/apps/frontend/app/page.tsx
          grep -Fq 'defaultValue="justy@ithute.co.ls"' products/nbros/apps/frontend/app/page.tsx
          grep -Fq 'type="password"' products/nbros/apps/frontend/app/page.tsx
          grep -Fq '`${authIssuer()}/v1/auth/login`' products/nbros/apps/frontend/app/api/auth/password/route.ts
          grep -Fq 'client_id: clientId()' products/nbros/apps/frontend/app/api/auth/password/route.ts
          grep -Fq 'httpOnly: true' products/nbros/apps/frontend/app/api/auth/password/route.ts
          grep -Fq 'The email or password is incorrect.' platform/ithute-auth/app/oauth.py
          if grep -Eq 'defaultValue=.*password|value=.*password' products/nbros/apps/frontend/app/page.tsx; then
            echo '::error::NBros must never prefill or embed a password.'
            exit 1
          fi

  smoke:
    name: Production password and OIDC smoke
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/hotfix/nbros-auth-smoke-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require NBros simple login and Central Auth contracts
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=NBros Auth Smoke::$*"
            exit 1
          }

          home="$(mktemp)"
          home_code="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 30 \
            -o "$home" -w '%{http_code}' \
            https://nbro.ithute.co.ls/)"
          echo "NBros homepage HTTP ${home_code}"
          [ "$home_code" = "200" ] || fail "NBros homepage returned HTTP ${home_code}; expected 200"
          grep -Fq '/api/auth/password' "$home" || fail "NBros homepage does not expose the local password-login form action"
          grep -Fq 'justy@ithute.co.ls' "$home" || fail "NBros homepage does not render the expected administrator email field"
          rm -f "$home"
          echo "NBros homepage login form contract passed"

          # A deliberately invalid account must reach Central Auth as the NBros
          # first-party client. 401 proves the client/endpoint contract exists;
          # an unregistered client would fail with 400 before credential checks.
          direct_body="$(mktemp)"
          direct_code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -o "$direct_body" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data "{\"identifier\":\"nbros-auth-probe-${GITHUB_RUN_ID}@invalid.example\",\"password\":\"not-a-real-password\",\"client_id\":\"nbros\"}" \
            https://auth.ithute.co.ls/v1/auth/login)"
          echo "Central Auth direct password contract HTTP ${direct_code}"
          if [ "$direct_code" != "401" ]; then
            echo "Safe response body:"
            cat "$direct_body"
            fail "Central Auth NBros password-login contract returned HTTP ${direct_code}; expected 401"
          fi
          grep -Fqi 'invalid credentials' "$direct_body" || {
            echo "Safe response body:"
            cat "$direct_body"
            fail "Central Auth 401 response did not contain the expected invalid-credentials detail"
          }
          rm -f "$direct_body"
          echo "Central Auth direct password contract passed"

          # The product-side simple form must reject an empty submission with a
          # friendly local redirect rather than throwing or exposing Auth data.
          headers="$(mktemp)"
          product_code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -D "$headers" -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/x-www-form-urlencoded' --data '' \
            https://nbro.ithute.co.ls/api/auth/password)"
          echo "NBros empty password form HTTP ${product_code}"
          if [ "$product_code" != "303" ]; then
            grep -Eia '^(location|content-type):' "$headers" || true
            fail "NBros empty password form returned HTTP ${product_code}; expected 303"
          fi
          if ! grep -Eiq '^location: https://nbro\.ithute\.co\.ls/\?auth_error=missing_credentials' "$headers"; then
            grep -Eia '^(location|content-type):' "$headers" || true
            fail "NBros empty password form did not redirect to the missing_credentials page"
          fi
          rm -f "$headers"
          echo "NBros local password form redirect contract passed"

          # OIDC login failures must remain on a human-readable HTML form. This
          # protects the browser flow from regressing to a raw JSON error page.
          oidc_body="$(mktemp)"
          oidc_headers="$(mktemp)"
          oidc_code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -D "$oidc_headers" -o "$oidc_body" -w '%{http_code}' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'response_type=code' \
            --data-urlencode 'client_id=nbros' \
            --data-urlencode 'redirect_uri=https://nbro.ithute.co.ls/api/auth/oidc/callback' \
            --data-urlencode 'code_challenge=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            --data-urlencode 'code_challenge_method=S256' \
            --data-urlencode 'state=nbros-smoke-state' \
            --data-urlencode 'nonce=nbros-smoke-nonce-1234567890' \
            --data-urlencode 'scope=openid profile email phone' \
            --data-urlencode "identifier=nbros-oidc-probe-${GITHUB_RUN_ID}@invalid.example" \
            --data-urlencode 'password=not-a-real-password' \
            https://auth.ithute.co.ls/oauth/authorize)"
          echo "Central Auth OIDC invalid-login contract HTTP ${oidc_code}"
          if [ "$oidc_code" != "401" ]; then
            grep -Eia '^(location|content-type):' "$oidc_headers" || true
            fail "Central Auth OIDC invalid-login contract returned HTTP ${oidc_code}; expected 401"
          fi
          if ! grep -Eiq '^content-type: text/html' "$oidc_headers"; then
            grep -Eia '^(location|content-type):' "$oidc_headers" || true
            fail "Central Auth OIDC invalid-login response is not HTML"
          fi
          grep -Fq 'The email or password is incorrect.' "$oidc_body" || fail "Central Auth OIDC HTML did not render the human-readable invalid-credentials message"
          ! grep -Fq '"detail":"invalid_credentials"' "$oidc_body" || fail "Central Auth OIDC browser flow leaked a raw JSON invalid_credentials response"
          rm -f "$oidc_body" "$oidc_headers"

          echo 'NBros simple login and Ithute Auth production contracts are healthy.'
