name: NBros Fleet CI

on:
  push:
    branches: [nbros]
    paths:
      - "products/nbros/**"
      - "platform/ithute-auth/**"
      - "platform/ithute-realtime/**"
      - ".github/workflows/nbros-fleet-ci.yml"
  pull_request:
    branches: [main, nbros]
    paths:
      - "products/nbros/**"
      - "platform/ithute-auth/**"
      - "platform/ithute-realtime/**"
      - ".github/workflows/nbros-fleet-ci.yml"

permissions:
  contents: read

concurrency:
  group: nbros-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: FastAPI · Alembic · Fleet + Operations rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nbros_test
          POSTGRES_USER: nbros
          POSTGRES_PASSWORD: nbros-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nbros -d nbros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: products/nbros/apps/backend
    env:
      PYTHONPATH: .
      NBROS_DATABASE_URL: postgresql+psycopg://nbros:nbros-test-password@127.0.0.1:5432/nbros_test
      NBROS_REDIS_URL: redis://127.0.0.1:6379/0
      NBROS_REALTIME_PUBLISH_ENABLED: "false"
      NBROS_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            products/nbros/apps/backend/requirements.txt
            products/nbros/apps/backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app alembic tests
      - name: Apply NBros migrations to PostgreSQL
        run: alembic upgrade head
      - name: Verify Alembic/model drift
        run: alembic check
      - name: Verify Fleet + Operations + production API contract
        run: |
          python - <<'PY'
          from app.file_compat import router as file_compat_router
          from app.main import app
          paths = set(app.openapi()["paths"])
          required = {
              "/api/v1/fleet/dashboard",
              "/api/v1/fleet/advisor",
              "/api/v1/fleet/reports/summary",
              "/api/v1/fleet/inventory",
              "/api/v1/operations/summary",
              "/api/v1/operations/workshop",
              "/api/v1/operations/procurement",
              "/api/v1/operations/dispatch",
              "/api/v1/operations/tyres",
              "/api/v1/operations/insurance/claims",
              "/api/v1/operations/telematics/events",
              "/api/v1/operations/finance/tco",
              "/api/v1/operations/executive",
              "/api/v1/operations/observability",
              "/api/v1/operations/exports/fleet.csv",
              "/api/v1/operations/exports/tco.csv",
              "/api/v1/operations/exports/audit.csv",
              "/api/v1/governance/profiles",
              "/api/v1/governance/branch-access",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Missing NBros API paths: {missing}")
          if "/metrics" in paths:
              raise SystemExit("Internal metrics endpoint must not be exposed in OpenAPI")
          legacy_paths = {getattr(route, "path", "") for route in file_compat_router.routes}
          legacy = "/api/fleet/files/{branch_id}/{filename}"
          if legacy not in legacy_paths:
              raise SystemExit(f"Missing Fleet compatibility route: {legacy}")
          print(f"NBros API contract OK: {len(paths)} OpenAPI paths + internal metrics + legacy file route")
          PY
      - name: Run backend regression tests
        run: python -m pytest -q --maxfail=1
      - name: PostgreSQL backup and restore round-trip
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export PGPASSWORD=nbros-test-password
          docker run --rm --network host -e PGPASSWORD postgres:17-alpine \
            pg_dump -h 127.0.0.1 -U nbros -d nbros_test --format=custom --no-owner --no-privileges > /tmp/nbros-ci.dump
          test -s /tmp/nbros-ci.dump
          docker run --rm --network host -e PGPASSWORD postgres:17-alpine \
            createdb -h 127.0.0.1 -U nbros nbros_restore_test
          docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine \
            pg_restore -h 127.0.0.1 -U nbros -d nbros_restore_test --no-owner --no-privileges < /tmp/nbros-ci.dump
          test "$(docker run --rm --network host -e PGPASSWORD postgres:17-alpine psql -h 127.0.0.1 -U nbros -d nbros_restore_test -Atc 'SELECT count(*) FROM alembic_version')" = "1"
          restored_tables="$(docker run --rm --network host -e PGPASSWORD postgres:17-alpine psql -h 127.0.0.1 -U nbros -d nbros_restore_test -Atc \"SELECT count(*) FROM information_schema.tables WHERE table_schema='public'\")"
          test "$restored_tables" -ge 20
          echo "Backup restore verified with $restored_tables public tables."

  frontend:
    name: Next.js · TypeScript · production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/nbros/apps/frontend
    env:
      NBROS_PUBLIC_URL: https://nbro.ithute.co.ls
      NBROS_AUTH_ISSUER: https://auth.ithute.co.ls
      NBROS_AUTH_CLIENT_ID: nbros
      NBROS_OIDC_REDIRECT_URI: https://nbro.ithute.co.ls/api/auth/oidc/callback
      NBROS_COOKIE_SECURE: "true"
      NBROS_REALTIME_WS_URL: wss://realtime.ithute.co.ls/v1/ws
      NBROS_BACKEND_INTERNAL_URL: http://127.0.0.1:8203
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/nbros/apps/frontend/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build

  compose:
    name: Compose · deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NBros Compose
        env:
          NBROS_DB_PASSWORD: nbros-compose-validation-password
          NBROS_REALTIME_SERVICE_CLIENT_SECRET: ""
          NBROS_AI_ENABLED: "false"
        run: docker compose -f products/nbros/compose.yaml config -q
      - name: Validate operational scripts
        run: bash -n products/nbros/scripts/backup.sh products/nbros/scripts/verify-backup.sh
      - name: Verify Caddy routes and security headers
        run: |
          grep -F '/api/v1/*' products/nbros/deploy/Caddyfile.nbro
          grep -F '/api/fleet/*' products/nbros/deploy/Caddyfile.nbro
          grep -F 'Strict-Transport-Security' products/nbros/deploy/Caddyfile.nbro
          grep -F 'X-Content-Type-Options' products/nbros/deploy/Caddyfile.nbro
          grep -F 'X-Frame-Options' products/nbros/deploy/Caddyfile.nbro
