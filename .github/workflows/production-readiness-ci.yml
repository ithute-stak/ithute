name: Production Readiness CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-runtime-readiness:
    name: Live runtime readiness and load gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ithute_app
          POSTGRES_USER: ithute_app
          POSTGRES_PASSWORD: ci-app-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute_app -d ithute_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: production
      PLATFORM_MODE: bootstrap
      SECRET_KEY: ci-production-readiness-secret-key-000000000000000000000000
      DKIM_ENCRYPTION_KEY: ci-production-readiness-dkim-key-000000000000000000000000
      BILLING_WEBHOOK_SECRET: ci-production-readiness-billing-secret-000000000000000000
      DATABASE_URL: postgresql+psycopg://ithute_app:ci-app-db-password@127.0.0.1:5432/ithute_app
      REDIS_URL: redis://127.0.0.1:6379/0
      RSPAMD_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_URL: https://ithute.co.ls
      BOOTSTRAP_ADMIN_EMAIL: readiness-owner@ithute.invalid
      BOOTSTRAP_ADMIN_PASSWORD: ci-owner-password-12345
      COOKIE_SECURE: "true"
      TRANSACTIONAL_SMTP_VERIFY_TLS: "true"
      RECOVERY_OPS_TOKEN: ci-production-readiness-recovery-token-000000000000
      SECURITY_DUAL_CONTROL_ENABLED: "true"
      SECURITY_APPROVAL_TTL_MINUTES: "30"
      BOOTSTRAP_PUBLIC_IP: 204.12.205.224
      MAIL_PUBLIC_IP: 204.12.205.224
      POWERDNS_API_KEY: readiness-powerdns-token-6e4f2398c5a17d20
      MAIL_OPS_TOKEN: readiness-mail-ops-token-b6391fd406e72845
      MAIL_NODE_TOKEN: readiness-mail-node-token-24a7d1f95c80e362

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r apps/backend/requirements.txt

      - name: Upgrade disposable production-schema database
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Start production-mode API candidate
        working-directory: apps/backend
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 >/tmp/ithute-readiness-api.log 2>&1 &
          echo $! > /tmp/ithute-readiness-api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/tmp/ithute-ready.json; then
              cat /tmp/ithute-ready.json
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ithute-readiness-api.pid)" 2>/dev/null; then
              echo "API candidate exited before becoming ready." >&2
              cat /tmp/ithute-readiness-api.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "API candidate did not become ready in time." >&2
          cat /tmp/ithute-readiness-api.log >&2 || true
          exit 1

      - name: Verify production security headers
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/headers -o /tmp/body http://127.0.0.1:8000/health/live
          grep -Eiq '^x-content-type-options: nosniff' /tmp/headers
          grep -Eiq '^x-frame-options: DENY' /tmp/headers
          grep -Eiq '^content-security-policy:.*default-src.*none' /tmp/headers
          grep -Eiq '^permissions-policy:.*camera=\(\)' /tmp/headers
          test -s /tmp/body

      - name: Run live concurrency and latency gate
        run: |
          set -euo pipefail
          python scripts/production-readiness-probe.py             --url http://127.0.0.1:8000/health/ready             --requests 1200             --concurrency 32             --p95-ms 500             --p99-ms 1000             --max-error-rate 0

      - name: Preserve API diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-readiness-api-log-${{ github.sha }}
          path: /tmp/ithute-readiness-api.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API candidate
        if: always()
        run: |
          if test -f /tmp/ithute-readiness-api.pid; then
            kill "$(cat /tmp/ithute-readiness-api.pid)" >/dev/null 2>&1 || true
          fi
