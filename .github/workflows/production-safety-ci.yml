name: Production Safety CI

on:
  pull_request:
    paths:
      - "scripts/deploy-production.sh"
      - "scripts/deploy-production-manual.sh"
      - "platform/ithute-auth/**"
      - ".github/workflows/release-images.yml"
      - ".github/workflows/deploy-backup-assurance.yml"
      - ".github/workflows/deploy-telemetry.yml"
      - ".github/workflows/vps-disk-maintenance.yml"
      - ".github/workflows/production-safety-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reject destructive runtime and migration hazards
        run: |
          set -euo pipefail
          bash -n scripts/deploy-production.sh
          bash -n scripts/deploy-production-manual.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          deploy_paths = [
              Path("scripts/deploy-production.sh"),
              Path("scripts/deploy-production-manual.sh"),
          ]
          forbidden = (
              "docker compose down",
              "compose down",
              "docker stop",
              "docker rm",
          )
          failures = []
          for path in deploy_paths:
              for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "--remove-orphans" in line:
                      failures.append(f"{path}:{number}: --remove-orphans is forbidden in routine production deployment")
                  for needle in forbidden:
                      if needle in line:
                          failures.append(f"{path}:{number}: destructive operation {needle!r}")

          script = Path("scripts/deploy-production.sh").read_text(encoding="utf-8")
          manual = Path("scripts/deploy-production-manual.sh").read_text(encoding="utf-8")
          release = Path(".github/workflows/release-images.yml").read_text(encoding="utf-8")

          for required in (
              ".last-known-good.env",
              ".last-known-good-runtime.tgz",
              "rollback_to_last_good",
              "ITHUTE_FALLBACK_IMAGE_TAG",
              "require_public_marker",
          ):
              if required not in script:
                  failures.append(f"deploy-production.sh is missing rollback/health contract: {required}")

          for required in (
              "/home/administrator/ithute-platform",
              "ghcr.io/ithute-stak",
              "ITHUTE_FALLBACK_IMAGE_TAG",
              "scripts/deploy-production.sh",
              "Production is already running release",
          ):
              if required not in manual:
                  failures.append(f"deploy-production-manual.sh is missing production contract: {required}")

          if ':latest' in manual or ':latest' in release:
              failures.append('Mutable latest image tags are forbidden for Ithute production.')
          if 'ssh ' in release or 'scp ' in release or 'VPS_HOST' in release or 'VPS_SSH' in release:
              failures.append('Ithute Release Images must never connect to the production VPS.')
          if 'packages: write' not in release:
              failures.append('Ithute Release Images must be able to publish packages.')
          if 'Ithute Standalone CI' not in release or 'Production Safety CI' not in release:
              failures.append('Ithute Release Images must require both CI gates for the exact SHA.')

          # With `set -o pipefail`, `curl ... | grep -q` can make curl exit 23
          # after grep finds its match and closes the pipe. Public checks must
          # capture the response first and then inspect it without a streaming pipe.
          marker = "verify_public_health() {"
          end_marker = "\n}\n\ndump_failure_logs()"
          if marker in script and end_marker in script.split(marker, 1)[1]:
              public_health = script.split(marker, 1)[1].split(end_marker, 1)[0]
              if "| grep" in public_health:
                  failures.append("verify_public_health must not stream curl output into grep under pipefail")

          disk = Path(".github/workflows/vps-disk-maintenance.yml").read_text(encoding="utf-8")
          header = disk.split("jobs:", 1)[0]
          if "push:" in header:
              failures.append("VPS disk maintenance must not run automatically on every push")
          if ".last-known-good.env" not in disk:
              failures.append("VPS disk maintenance must preserve last-known-good images")

          # Alembic creates alembic_version.version_num as VARCHAR(32) unless a
          # project explicitly customizes it. A longer revision ID executes the
          # migration DDL and then crashes while stamping the version table.
          revision_pattern = re.compile(r'^revision\s*=\s*["\']([^"\']+)["\']', re.MULTILINE)
          seen = {}
          for path in sorted(Path("platform/ithute-auth/alembic/versions").glob("*.py")):
              text = path.read_text(encoding="utf-8")
              match = revision_pattern.search(text)
              if not match:
                  failures.append(f"{path}: missing Alembic revision identifier")
                  continue
              revision = match.group(1)
              if len(revision) > 32:
                  failures.append(
                      f"{path}: Alembic revision {revision!r} is {len(revision)} characters; maximum is 32"
                  )
              previous = seen.get(revision)
              if previous:
                  failures.append(f"duplicate Alembic revision {revision!r}: {previous} and {path}")
              seen[revision] = path

          if failures:
              raise SystemExit("Unsafe production automation or migration:\n" + "\n".join(failures))
          PY

      - name: Build Auth candidate for startup smoke test
        run: |
          set -euo pipefail
          docker build --pull -t ithute-auth:production-smoke ./platform/ithute-auth

      - name: Start disposable Auth database
        run: |
          set -euo pipefail
          docker network create ithute-production-smoke
          docker run -d --name ithute-auth-smoke-db \
            --network ithute-production-smoke \
            -e POSTGRES_DB=ithute_auth \
            -e POSTGRES_USER=ithute_auth \
            -e POSTGRES_PASSWORD=ci-auth-password \
            postgres:16-alpine
          for attempt in $(seq 1 40); do
            if docker exec ithute-auth-smoke-db pg_isready -U ithute_auth -d ithute_auth >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs ithute-auth-smoke-db >&2 || true
          exit 1

      - name: Run full Auth entrypoint and health check
        run: |
          set -euo pipefail
          mkdir -p /tmp/ithute-auth-smoke-secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/ithute-auth-smoke-secrets/jwt-private.pem >/dev/null 2>&1
          openssl rsa -pubout \
            -in /tmp/ithute-auth-smoke-secrets/jwt-private.pem \
            -out /tmp/ithute-auth-smoke-secrets/jwt-public.pem >/dev/null 2>&1

          docker run -d --name ithute-auth-smoke \
            --network ithute-production-smoke \
            -v /tmp/ithute-auth-smoke-secrets:/run/secrets:ro \
            -e AUTH_DATABASE_URL=postgresql+psycopg://ithute_auth:ci-auth-password@ithute-auth-smoke-db:5432/ithute_auth \
            -e AUTH_ISSUER=https://auth.ithute.co.ls \
            -e AUTH_ACCOUNT_BASE_URL=https://auth.ithute.co.ls \
            -e AUTH_SYSTEM_OWNER_EMAIL=ci-owner@ithute.invalid \
            -e AUTH_SYSTEM_OWNER_PASSWORD=ci-owner-password-12345 \
            -e AUTH_TOTP_ENCRYPTION_KEY=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg= \
            ithute-auth:production-smoke api

          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' ithute-auth-smoke)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Auth candidate exited during production startup smoke test." >&2
              docker logs ithute-auth-smoke >&2 || true
              exit 1
            fi
            body="$(docker exec ithute-auth-smoke curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null || true)"
            if [[ "$body" == *"ithute-auth"* ]]; then
              docker logs ithute-auth-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Auth candidate never became healthy." >&2
          docker logs ithute-auth-smoke >&2 || true
          exit 1

      - name: Cleanup smoke-test containers
        if: always()
        run: |
          docker rm -f ithute-auth-smoke ithute-auth-smoke-db >/dev/null 2>&1 || true
          docker network rm ithute-production-smoke >/dev/null 2>&1 || true
