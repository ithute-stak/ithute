name: Production SSH Reliability Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-ssh-keepalive.conf'
      - 'scripts/ithute-tutor-deploy.sh'
      - '.github/workflows/ithute-pay-production.yml'
      - '.github/workflows/ithute-tutor-production.yml'
      - '.github/workflows/production-ssh-reliability-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/production-ssh-keepalive.conf'
      - 'scripts/ithute-tutor-deploy.sh'
      - '.github/workflows/ithute-pay-production.yml'
      - '.github/workflows/ithute-tutor-production.yml'
      - '.github/workflows/production-ssh-reliability-contract.yml'

permissions:
  contents: read

jobs:
  production-ssh-reliability:
    name: Verify long-running production SSH protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate OpenSSH keepalive profile
        run: |
          set -eu
          test -s scripts/production-ssh-keepalive.conf
          resolved="$(ssh -G -F scripts/production-ssh-keepalive.conf 204.12.205.224 2>/dev/null)"
          printf '%s\n' "$resolved" | grep -Eq '^serveraliveinterval 20$'
          printf '%s\n' "$resolved" | grep -Eq '^serveralivecountmax 90$'
          printf '%s\n' "$resolved" | grep -Eq '^tcpkeepalive yes$'

      - name: Require Pay and Tutor SSH reliability protections
        run: |
          set -eu

          pay=.github/workflows/ithute-pay-production.yml
          tutor_workflow=.github/workflows/ithute-tutor-production.yml
          tutor_script=scripts/ithute-tutor-deploy.sh

          # Pay still keeps its long-running remote loop inline.
          grep -Fq 'cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"' "$pay"
          grep -Fq 'Waiting for shared Ithute production lock' "$pay"
          grep -Fq 'Acquired shared Ithute production lock.' "$pay"
          grep -Fq 'Waiting for $service (status:' "$pay"

          # Tutor installs the same SSH keepalive profile in its workflow, but
          # its production lock and health waits now live in a checked-in,
          # syntax-validated remote deploy script instead of a fragile heredoc.
          grep -Fq 'cp scripts/production-ssh-keepalive.conf "$HOME/.ssh/config"' "$tutor_workflow"
          grep -Fq 'Waiting for shared Ithute production lock' "$tutor_script"
          grep -Fq 'Acquired shared Ithute production lock for Tutor deployment.' "$tutor_script"
          grep -Fq 'Waiting for $service (runtime: $runtime, health:' "$tutor_script"
          sh -n "$tutor_script"

      - name: Keep persistent-data protections intact
        run: |
          set -eu
          sh scripts/verify-force-redeploy-safety.sh
