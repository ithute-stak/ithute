name: Publish Ithute Production Images

on:
  workflow_run:
    workflows: ["Ithute Standalone CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      GHCR_REGISTRY: ghcr.io/ithute-stak

    steps:
      - name: Download exact tested image bundle
        uses: actions/download-artifact@v4
        with:
          name: ithute-images-${{ env.RELEASE_SHA }}
          path: /tmp/ithute-images
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify and load tested images
        run: |
          set -euo pipefail
          cd /tmp/ithute-images
          test -f "ithute-images-${RELEASE_SHA}.tar.gz"
          test -f "ithute-images-${RELEASE_SHA}.sha256"
          sha256sum -c "ithute-images-${RELEASE_SHA}.sha256"
          gzip -dc "ithute-images-${RELEASE_SHA}.tar.gz" | docker load
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker image inspect "$image:$RELEASE_SHA" >/dev/null
          done

      - name: Publish immutable release to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            local_ref="$image:$RELEASE_SHA"
            remote_ref="$GHCR_REGISTRY/$image:$RELEASE_SHA"
            docker tag "$local_ref" "$remote_ref"
            docker push "$remote_ref"
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Verify published release manifests
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker manifest inspect "$GHCR_REGISTRY/$image:$RELEASE_SHA" >/dev/null
          done
          docker logout ghcr.io >/dev/null 2>&1 || true
          echo "Published tested Ithute release $RELEASE_SHA to GHCR."
