name: Temporary Next.js lockfile refresh

on:
  push:
    branches:
      - feature/registered-company-landing-2026
    paths:
      - ".github/workflows/refresh-next-lockfile-temporary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.ref == 'refs/heads/feature/registered-company-landing-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout approved feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/registered-company-landing-2026
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate npm lockfile from pinned package manifest
        working-directory: apps/frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit the regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/frontend/package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/package-lock.json
          git commit -m "fix(security): refresh Next.js lockfile for patched release"
          git push origin HEAD:feature/registered-company-landing-2026
