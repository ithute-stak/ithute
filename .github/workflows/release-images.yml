name: Ithute Release Images

on:
  workflow_run:
    workflows: ["Production Safety CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ithute-release-images
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish tested Ithute images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Require exact green CI gates
        id: gates
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "Release SHA $RELEASE_SHA has been superseded by main at $current_main; skipping image publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          require_success() {
            workflow="$1"
            label="$2"
            echo "Waiting for $label on $RELEASE_SHA. No image publication occurs before every required gate passes."
            for attempt in $(seq 1 120); do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=100")"
              row="$(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] | if . == null then "" else [.status, (.conclusion // ""), (.html_url // "")] | @tsv end')"
              if [ -z "$row" ]; then
                echo "$label has no run for $RELEASE_SHA yet (${attempt}/120)."
                sleep 5
                continue
              fi
              IFS=$'\t' read -r status conclusion url <<< "$row"
              echo "$label: status=$status conclusion=${conclusion:-pending} $url"
              if [ "$status" = completed ]; then
                test "$conclusion" = success || {
                  echo "$label did not pass for $RELEASE_SHA" >&2
                  exit 1
                }
                return 0
              fi
              test "$attempt" -lt 120 || {
                echo "Timed out waiting for $label on $RELEASE_SHA" >&2
                exit 1
              }
              sleep 5
            done
          }
          require_success ci.yml 'Ithute Standalone CI'
          require_success production-safety-ci.yml 'Production Safety CI'
          require_success security-ci.yml 'Security CI'
          require_success backup-assurance-ci.yml 'Backup Assurance CI'
          require_success production-readiness-ci.yml 'Production Readiness CI'
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.gates.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.gates.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Publish web image
        if: steps.gates.outputs.publish == 'true'
        id: web
        uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: ${{ env.REGISTRY }}/ithute-web:${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Publish app API image
        if: steps.gates.outputs.publish == 'true'
        id: app_api
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/ithute-app-api:${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Publish auth image
        if: steps.gates.outputs.publish == 'true'
        id: auth
        uses: docker/build-push-action@v7
        with:
          context: platform/ithute-auth
          file: platform/ithute-auth/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/ithute-auth:${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Publish push image
        if: steps.gates.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: platform/ithute-push
          file: platform/ithute-push/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/ithute-push:${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Publish realtime image
        if: steps.gates.outputs.publish == 'true'
        id: realtime
        uses: docker/build-push-action@v7
        with:
          context: platform/ithute-realtime
          file: platform/ithute-realtime/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/ithute-realtime:${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Attest web image provenance
        if: steps.gates.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/ithute-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Attest app API image provenance
        if: steps.gates.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/ithute-app-api
          subject-digest: ${{ steps.app_api.outputs.digest }}
          push-to-registry: true

      - name: Attest auth image provenance
        if: steps.gates.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/ithute-auth
          subject-digest: ${{ steps.auth.outputs.digest }}
          push-to-registry: true

      - name: Attest push image provenance
        if: steps.gates.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/ithute-push
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest realtime image provenance
        if: steps.gates.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/ithute-realtime
          subject-digest: ${{ steps.realtime.outputs.digest }}
          push-to-registry: true

      - name: Release summary
        if: steps.gates.outputs.publish == 'true'
        run: |
          echo "Ithute images are published only; no VPS deployment is performed."
          echo "Release SHA: $RELEASE_SHA"
          for image in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            echo "$REGISTRY/$image:$RELEASE_SHA"
          done
          echo "Production changes only when an operator deploys this exact SHA from the VPS."
