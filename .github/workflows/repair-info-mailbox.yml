name: Repair info mailbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-info-mailbox.yml"

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      VPS_APP_DIR: /home/administrator/ithute-platform

    steps:
      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_info_mailbox_repair"
          chmod 600 "$HOME/.ssh/ithute_info_mailbox_repair"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_info_mailbox_repair" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_info_mailbox_repair" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect and repair info mailbox
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          target='info@ithute.co.ls'
          test "$(docker inspect --format '{{.State.Health.Status}}' ithute-mail 2>/dev/null || true)" = healthy
          test -f "$VPS_APP_DIR/.env.production"
          test -f "$VPS_APP_DIR/.image.env"
          test -f "$VPS_APP_DIR/compose.production.yml"

          app_id="$(docker compose \
            --env-file "$VPS_APP_DIR/.env.production" \
            --env-file "$VPS_APP_DIR/.image.env" \
            -p ithute \
            -f "$VPS_APP_DIR/compose.production.yml" \
            ps -q ithute-app-api)"
          test -n "$app_id"
          echo "Production app API image: $(docker inspect --format '{{.Config.Image}}' "$app_id")"

          docker exec ithute-mail doveadm user "$target" >/dev/null
          echo 'Dovecot account lookup succeeded for info@ithute.co.ls.'

          echo 'Mailbox status before repair:'
          docker exec ithute-mail doveadm mailbox status -u "$target" "messages unseen uidnext uidvalidity" INBOX

          # A normal index pass is safe and fixes stale index/cache state without
          # touching the underlying Maildir messages.
          docker exec ithute-mail doveadm index -u "$target" INBOX

          if docker exec ithute-mail doveadm search -u "$target" mailbox INBOX ALL >/dev/null 2>&1; then
            echo 'Dovecot INBOX search succeeded after index refresh.'
          else
            echo 'Dovecot INBOX search is unhealthy; forcing a mailbox resync.'
            docker exec ithute-mail doveadm force-resync -u "$target" INBOX
            docker exec ithute-mail doveadm index -u "$target" INBOX
            docker exec ithute-mail doveadm search -u "$target" mailbox INBOX ALL >/dev/null
            echo 'Dovecot INBOX search succeeded after force-resync.'
          fi

          echo 'Mailbox status after repair:'
          docker exec ithute-mail doveadm mailbox status -u "$target" "messages unseen uidnext uidvalidity" INBOX

          # Show only mailbox-specific Dovecot error lines; do not print message
          # bodies or authentication material.
          docker logs ithute-mail --since 30m 2>&1 \
            | grep -Ei 'info@ithute\.co\.ls.*(error|corrupt|index|mailbox|imap)|imap.*info@ithute\.co\.ls' \
            | tail -n 40 || true
          REMOTE
