name: Repair Ithute Mail Runtime Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-mail-runtime-path.yml"

concurrency:
  group: ithute-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_MAIL_DIR: /home/administrator/ithute-platform-mail
      APP_NETWORK: ithute_ithute

    steps:
      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_mail_repair"
          chmod 600 "$HOME/.ssh/ithute_mail_repair"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_mail_repair" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_mail_repair" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Repair private mail path and verify protocols
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "VPS_APP_DIR='$VPS_APP_DIR' VPS_MAIL_DIR='$VPS_MAIL_DIR' APP_NETWORK='$APP_NETWORK' bash -s" <<'REMOTE'
          set -euo pipefail

          test -f "$VPS_APP_DIR/.env.production"
          test -f "$VPS_APP_DIR/.image.env"
          test -f "$VPS_APP_DIR/compose.production.yml"
          test -f "$VPS_MAIL_DIR/compose.yml"
          docker network inspect "$APP_NETWORK" >/dev/null
          test "$(docker inspect --format '{{.State.Health.Status}}' ithute-mail 2>/dev/null || true)" = healthy

          app_compose() {
            docker compose \
              --env-file "$VPS_APP_DIR/.env.production" \
              --env-file "$VPS_APP_DIR/.image.env" \
              -p ithute \
              -f "$VPS_APP_DIR/compose.production.yml" \
              "$@"
          }

          app_id="$(app_compose ps -q ithute-app-api)"
          test -n "$app_id"

          mail_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "ithute_ithute"}}{{.IPAddress}}{{end}}' ithute-mail 2>/dev/null || true)"
          if [ -z "$mail_ip" ]; then
            echo 'Mail container is not attached to the Ithute application network; attaching it.'
            docker network connect --alias mail.ithute.co.ls "$APP_NETWORK" ithute-mail
            mail_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "ithute_ithute"}}{{.IPAddress}}{{end}}' ithute-mail)"
          fi
          test -n "$mail_ip"

          resolved_ip="$(docker exec "$app_id" python -c 'import socket; print(socket.gethostbyname("mail.ithute.co.ls"))')"
          if [ "$resolved_ip" != "$mail_ip" ]; then
            echo 'Private mail DNS alias is stale; refreshing only the application-network attachment.'
            docker network disconnect "$APP_NETWORK" ithute-mail || true
            docker network connect --alias mail.ithute.co.ls "$APP_NETWORK" ithute-mail
            mail_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "ithute_ithute"}}{{.IPAddress}}{{end}}' ithute-mail)"
            resolved_ip="$(docker exec "$app_id" python -c 'import socket; print(socket.gethostbyname("mail.ithute.co.ls"))')"
          fi
          test "$resolved_ip" = "$mail_ip"
          echo 'App API resolves mail.ithute.co.ls through the private Ithute network.'

          app_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "ithute_ithute"}}{{.IPAddress}}{{end}}' "$app_id")"
          test -n "$app_ip"

          # The App API is a trusted in-host mail client. If Fail2Ban learned its
          # private Docker IP from previous failed mailbox attempts, unban only
          # that private address. Never alter bans for public clients here.
          case "$app_ip" in
            10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2?.*|172.30.*|172.31.*|192.168.*)
              jail_status="$(docker exec ithute-mail fail2ban-client status 2>/dev/null || true)"
              jails="$(printf '%s\n' "$jail_status" | sed -n 's/.*Jail list:[[:space:]]*//p' | tr ',' ' ')"
              for jail in $jails; do
                jail="$(printf '%s' "$jail" | xargs)"
                [ -n "$jail" ] || continue
                docker exec ithute-mail fail2ban-client set "$jail" unbanip "$app_ip" >/dev/null 2>&1 || true
              done
              ;;
            *)
              echo 'Refusing to alter Fail2Ban because the App API address is not private.' >&2
              exit 1
              ;;
          esac

          docker exec "$app_id" python -c 'import imaplib, ssl; c=imaplib.IMAP4_SSL("mail.ithute.co.ls", 993, ssl_context=ssl.create_default_context(), timeout=10); c.logout()'
          docker exec "$app_id" python -c 'import smtplib, ssl; c=smtplib.SMTP("mail.ithute.co.ls", 587, timeout=10); c.ehlo(); c.starttls(context=ssl.create_default_context()); c.ehlo(); c.quit()'
          echo 'Private webmail-to-mail-server connectivity is healthy.'
          REMOTE
