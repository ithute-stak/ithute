name: Security CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:multi"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            platform/ithute-auth/requirements.txt
            platform/ithute-push/requirements.txt
            platform/ithute-realtime/requirements.txt
      - name: Audit Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit
          for requirements in \
            apps/backend/requirements.txt \
            platform/ithute-auth/requirements.txt \
            platform/ithute-push/requirements.txt \
            platform/ithute-realtime/requirements.txt; do
            echo "Auditing $requirements"
            pip-audit -r "$requirements" --progress-spinner off
          done
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Audit production npm dependencies
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  secret-policy:
    name: Repository secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed secret material
        run: |
          set -euo pipefail
          failures=0

          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.p12|.*\.pfx)$' | grep -vE '(\.env\.example)$'; then
            echo "Tracked runtime secret file detected." >&2
            failures=1
          fi

          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}'
          if git grep -nEI "$patterns" -- ':!*.md' ':!*.example' ':!**/tests/**'; then
            echo "Potential committed credential/private key detected." >&2
            failures=1
          fi

          test "$failures" -eq 0

  trivy:
    name: Critical vulnerability and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  sbom:
    name: Generate repository SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            anchore/syft:v1.18.1 \
            dir:/workspace -o spdx-json=/workspace/ithute-sbom.spdx.json
          test -s ithute-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: ithute-sbom-${{ github.sha }}
          path: ithute-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  compiled-codeql:
    name: Compiled engines CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize compiled-language CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go,java-kotlin,c-cpp
          queries: security-extended
          build-mode: manual
      - name: Build Go engine
        working-directory: engines/go-worker
        run: go build ./cmd/worker
      - name: Build Java engine
        run: |
          mkdir -p /tmp/ithute-java-codeql/classes
          javac --release 21 --add-modules jdk.httpserver -d /tmp/ithute-java-codeql/classes $(find engines/java-worker/src -name '*.java')
      - name: Build C++ engines
        run: |
          cmake -S engines/cpp-native -B /tmp/ithute-cpp-codeql -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/ithute-cpp-codeql --parallel 2
          cmake -S engines/cpp-cluster -B /tmp/ithute-cpp-cluster-codeql -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/ithute-cpp-cluster-codeql --parallel 2
      - name: Analyze compiled engines
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:compiled-engines"

  rust-security:
    name: Rust audit and unsafe lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust security tooling
        run: |
          rustup component add clippy
          cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: engines/rust-core
        run: cargo audit --deny warnings
      - name: Clippy Rust core
        working-directory: engines/rust-core
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test Rust core
        working-directory: engines/rust-core
        run: cargo test --release --locked

  go-security:
    name: Go vulnerability and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go security toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: engines/go-worker/go.mod
      - name: Install Go security tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run Go vulnerability scan
        working-directory: engines/go-worker
        run: govulncheck ./...
      - name: Run gosec
        working-directory: engines/go-worker
        run: gosec ./...
      - name: Run staticcheck
        working-directory: engines/go-worker
        run: staticcheck ./...
      - name: Run Go tests
        working-directory: engines/go-worker
        run: go test -race ./...
      - name: Fuzz public-target parser
        working-directory: engines/go-worker
        run: go test ./cmd/worker -run=^$ -fuzz=FuzzPublicTargetIPNeverPanics -fuzztime=10s

  cpp-sanitizers:
    name: C++ ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build with sanitizers
        run: |
          cmake -S engines/cpp-native -B /tmp/ithute-cpp-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/ithute-cpp-sanitized --parallel 2
          cmake -S engines/cpp-cluster -B /tmp/ithute-cpp-cluster-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/ithute-cpp-cluster-sanitized --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir /tmp/ithute-cpp-sanitized --output-on-failure
          ctest --test-dir /tmp/ithute-cpp-cluster-sanitized --output-on-failure

