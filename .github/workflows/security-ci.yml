name: Security CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:multi"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            platform/ithute-auth/requirements.txt
            platform/ithute-push/requirements.txt
            platform/ithute-realtime/requirements.txt
      - name: Audit Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit
          for requirements in \
            apps/backend/requirements.txt \
            platform/ithute-auth/requirements.txt \
            platform/ithute-push/requirements.txt \
            platform/ithute-realtime/requirements.txt; do
            echo "Auditing $requirements"
            pip-audit -r "$requirements" --progress-spinner off
          done
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Audit production npm dependencies
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  secret-policy:
    name: Repository secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed secret material
        run: |
          set -euo pipefail
          failures=0

          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.p12|.*\.pfx)$' | grep -vE '(\.env\.example)$'; then
            echo "Tracked runtime secret file detected." >&2
            failures=1
          fi

          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}'
          if git grep -nEI "$patterns" -- ':!*.md' ':!*.example' ':!**/tests/**'; then
            echo "Potential committed credential/private key detected." >&2
            failures=1
          fi

          test "$failures" -eq 0

  trivy:
    name: Critical vulnerability and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  sbom:
    name: Generate repository SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            anchore/syft:v1.18.1 \
            dir:/workspace -o spdx-json=/workspace/ithute-sbom.spdx.json
          test -s ithute-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: ithute-sbom-${{ github.sha }}
          path: ithute-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
