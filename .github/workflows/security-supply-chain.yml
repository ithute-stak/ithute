name: Security Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: "/language:${{ matrix.language }}"

  python-security:
    name: Python dependency and SAST gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            platform/ithute-auth/requirements.txt
            platform/ithute-push/requirements.txt
            platform/ithute-realtime/requirements.txt
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit
      - name: Audit backend dependencies
        run: pip-audit -r apps/backend/requirements.txt
      - name: Audit Auth dependencies
        run: pip-audit -r platform/ithute-auth/requirements.txt
      - name: Audit Push dependencies
        run: pip-audit -r platform/ithute-push/requirements.txt
      - name: Audit Realtime dependencies
        run: pip-audit -r platform/ithute-realtime/requirements.txt
      - name: Security lint production Python
        run: >-
          bandit -r
          apps/backend/app
          platform/ithute-auth/app
          platform/ithute-push/app
          platform/ithute-realtime/app
          -ll -ii

  frontend-security:
    name: Frontend dependency gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical vulnerabilities anywhere in dependency tree
        run: npm audit --audit-level=critical
      - name: Prove unpatched braces advisory is not a production dependency
        run: |
          if npm ls --omit=dev braces 2>/dev/null | grep -q "braces@"; then
            echo "braces unexpectedly reachable from production dependencies"
            exit 1
          fi

  secret-scan:
    name: Secret leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
