name: Deploy Shared TLS Edge Production

on:
  push:
    branches: [main]
    paths:
      - 'products/LoanHub/infra/caddy/Caddyfile'
      - '.github/workflows/shared-tls-edge-production.yml'
  workflow_dispatch:

concurrency:
  group: shared-tls-edge-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  LOANHUB_RUNTIME_DIR: /home/administrator/mailbox-dns/loanhub

jobs:
  deploy:
    name: Deploy and verify shared HTTPS edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
    steps:
      - name: Check out exact edge configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/shared_tls_edge"
          chmod 600 "$HOME/.ssh/shared_tls_edge"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/shared-tls-edge-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/shared-tls-edge-askpass.sh
            SSH_ASKPASS=/tmp/shared-tls-edge-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/shared_tls_edge" </dev/null
            rm -f /tmp/shared-tls-edge-askpass.sh
          else
            ssh-add "$HOME/.ssh/shared_tls_edge" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage shared Caddyfile
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          scp products/LoanHub/infra/caddy/Caddyfile "$remote:/tmp/ithute-shared-edge-${GITHUB_SHA}.Caddyfile"

      - name: Validate, reload and verify HTTPS edge
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$LOANHUB_RUNTIME_DIR' EDGE_SHA='$GITHUB_SHA' sh -s" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          [ -s .env.production ] || { echo 'LoanHub production environment is missing' >&2; exit 1; }
          [ -s compose.yaml ] || { echo 'LoanHub production compose.yaml is missing' >&2; exit 1; }

          candidate="/tmp/ithute-shared-edge-${EDGE_SHA}.Caddyfile"
          target="$APP_DIR/infra/caddy/Caddyfile"
          backup="$APP_DIR/infra/caddy/Caddyfile.before-${EDGE_SHA}"
          [ -s "$candidate" ] || { echo 'Staged Caddyfile is missing' >&2; exit 1; }
          mkdir -p "$APP_DIR/infra/caddy"
          [ -f "$target" ] && cp -p "$target" "$backup"
          cp "$candidate" "$target"
          rm -f "$candidate"

          set -a
          . ./.env.production
          set +a
          export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-loanhub}"
          export LOANHUB_ENV_FILE=.env.production

          restore_edge() {
            if [ -s "$backup" ]; then
              cp "$backup" "$target"
              docker compose --env-file .env.production --profile production exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || true
            fi
          }
          trap 'restore_edge' HUP INT TERM ERR

          caddy_id="$(docker compose --env-file .env.production --profile production ps -q caddy)"
          [ -n "$caddy_id" ] || { echo 'Shared Caddy edge is not running' >&2; exit 1; }
          caddy_status="$(docker inspect -f '{{.State.Status}}' "$caddy_id")"
          [ "$caddy_status" = running ] || { echo "Shared Caddy edge state is $caddy_status" >&2; exit 1; }

          docker compose --env-file .env.production --profile production exec -T caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose --env-file .env.production --profile production exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

          # Successful curl transport proves DNS -> TLS -> HTTP. Do not require a
          # particular application status because API roots may intentionally 404.
          for url in \
            https://pay.ithute.co.ls/ \
            https://api.pay.ithute.co.ls/ \
            https://portal.pay.ithute.co.ls/portal; do
            healthy=false
            for attempt in $(seq 1 36); do
              if curl -sS --connect-timeout 5 --max-time 15 -o /dev/null "$url"; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "Public HTTPS edge verification failed: $url" >&2
              exit 1
            fi
            echo "HTTPS verified: $url"
          done

          trap - HUP INT TERM ERR
          rm -f "$backup"
          echo 'Shared TLS edge deployment completed successfully.'
          REMOTE
