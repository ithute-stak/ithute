name: Recover Shared HTTPS Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-tls-edge-production.yml'
  workflow_dispatch:

concurrency:
  group: ithute-edge-recovery
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  LOANHUB_RUNTIME_DIR: /home/administrator/mailbox-dns/loanhub

jobs:
  recover:
    name: Restore public ports 80 and 443
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Validate deployment credentials
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_edge_recovery"
          chmod 600 "$HOME/.ssh/ithute_edge_recovery"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-edge-recovery-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-edge-recovery-askpass.sh
            SSH_ASKPASS=/tmp/ithute-edge-recovery-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
            rm -f /tmp/ithute-edge-recovery-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore an HTTPS listener on the VPS
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$LOANHUB_RUNTIME_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          [ -s .env.production ] || { echo 'LoanHub production environment is missing' >&2; exit 1; }
          [ -s compose.yaml ] || { echo 'LoanHub production compose.yaml is missing' >&2; exit 1; }

          set -a
          . ./.env.production
          set +a
          export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-loanhub}"
          export LOANHUB_ENV_FILE=.env.production

          edge() {
            docker compose --env-file .env.production -f compose.yaml -f compose.edge-nginx.yml --profile production "$@"
          }

          listener_ok() {
            curl -ksS --resolve panel.ithute.co.ls:443:127.0.0.1 \
              --connect-timeout 3 --max-time 10 -o /dev/null https://panel.ithute.co.ls/
          }

          nginx_recovered=false
          if [ -s compose.edge-nginx.yml ] && [ -s infra/nginx-edge/default.conf.template ]; then
            if edge run --rm --no-deps --entrypoint /bin/sh certbot \
              -c 'test -s /etc/letsencrypt/live/ithute-edge/fullchain.pem && test -s /etc/letsencrypt/live/ithute-edge/privkey.pem'; then
              echo 'Existing Nginx certificate found; force-recreating Nginx so the current Ithute template is rendered.'
              docker ps \
                --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                --filter 'label=com.docker.compose.service=caddy' \
                -q | xargs -r docker rm -f

              if edge up -d --no-build --no-deps --force-recreate edge-nginx certbot \
                && edge exec -T edge-nginx nginx -t \
                && edge exec -T edge-nginx nginx -T 2>/dev/null | grep -Fq 'auth.ithute.co.ls' \
                && edge exec -T edge-nginx nginx -T 2>/dev/null | grep -Fq 'panel.ithute.co.ls' \
                && listener_ok; then
                nginx_recovered=true
                echo 'Nginx HTTPS listener restored with the Ithute virtual-host configuration.'
              else
                echo 'Nginx recovery did not become healthy; falling back to the previous Caddy edge.' >&2
                edge logs --tail=200 edge-nginx certbot >&2 || true
                edge rm -sf edge-nginx certbot >/dev/null 2>&1 || true
              fi
            fi
          fi

          if [ "$nginx_recovered" != true ]; then
            if [ -s compose.edge-nginx.yml ]; then
              edge rm -sf edge-nginx certbot >/dev/null 2>&1 || true
            fi
            docker compose --env-file .env.production --profile production up -d caddy

            healthy=false
            for attempt in $(seq 1 20); do
              if listener_ok; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker compose --env-file .env.production --profile production logs --tail=250 caddy >&2 || true
              echo 'Could not restore a listener on port 443.' >&2
              exit 1
            fi
            echo 'Legacy Caddy HTTPS listener restored as an emergency fallback.'
          fi

          ss -lnt | grep -E ':(80|443)[[:space:]]' || true
          listener_ok
          REMOTE

      - name: Verify recovery from the public Internet
        run: |
          set -eu
          for url in \
            https://panel.ithute.co.ls/ \
            https://pay.ithute.co.ls/ \
            https://portal.pay.ithute.co.ls/portal; do
            healthy=false
            for attempt in $(seq 1 12); do
              if curl -sS --connect-timeout 5 --max-time 15 -o /dev/null "$url"; then
                healthy=true
                break
              fi
              sleep 3
            done
            [ "$healthy" = true ] || { echo "::error::Public HTTPS recovery failed: $url"; exit 1; }
            echo "Recovered: $url"
          done

          echo | openssl s_client -connect panel.ithute.co.ls:443 -servername panel.ithute.co.ls 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates
          echo 'Public HTTPS listener recovery completed.'
