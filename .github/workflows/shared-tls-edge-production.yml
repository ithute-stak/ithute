name: Recover Shared HTTPS Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-tls-edge-production.yml'
  workflow_dispatch:

concurrency:
  group: ithute-edge-recovery
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  LOANHUB_RUNTIME_DIR: /home/administrator/mailbox-dns/loanhub
  EDGE_SHA: ${{ github.sha }}

jobs:
  recover:
    name: Restore and validate Nginx HTTPS edge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Check out exact recovery configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EDGE_SHA }}
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_edge_recovery"
          chmod 600 "$HOME/.ssh/ithute_edge_recovery"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-edge-recovery-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-edge-recovery-askpass.sh
            SSH_ASKPASS=/tmp/ithute-edge-recovery-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
            rm -f /tmp/ithute-edge-recovery-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact Nginx edge files
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          stage="/tmp/ithute-edge-recovery-${EDGE_SHA}"
          ssh "$remote" "rm -rf '$stage' && mkdir -p '$stage/infra/nginx-edge'"
          scp products/LoanHub/compose.edge-nginx.yml "$remote:$stage/compose.edge-nginx.yml"
          scp products/LoanHub/infra/nginx-edge/default.conf.template "$remote:$stage/infra/nginx-edge/default.conf.template"
          scp products/LoanHub/infra/nginx-edge/ithute-tls.conf "$remote:$stage/infra/nginx-edge/ithute-tls.conf"

      - name: Prevalidate and switch the VPS edge
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$LOANHUB_RUNTIME_DIR' EDGE_SHA='$EDGE_SHA' sh -s" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          [ -s .env.production ] || { echo 'LoanHub production environment is missing' >&2; exit 1; }
          [ -s compose.yaml ] || { echo 'LoanHub production compose.yaml is missing' >&2; exit 1; }

          stage="/tmp/ithute-edge-recovery-${EDGE_SHA}"
          [ -s "$stage/compose.edge-nginx.yml" ] || { echo 'Staged edge override is missing' >&2; exit 1; }
          mkdir -p infra/nginx-edge
          cp "$stage/compose.edge-nginx.yml" compose.edge-nginx.yml
          cp "$stage/infra/nginx-edge/default.conf.template" infra/nginx-edge/default.conf.template
          cp "$stage/infra/nginx-edge/ithute-tls.conf" infra/nginx-edge/ithute-tls.conf
          rm -rf "$stage"

          set -a
          . ./.env.production
          set +a
          export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-loanhub}"
          export LOANHUB_ENV_FILE=.env.production

          edge() {
            docker compose --env-file .env.production -f compose.yaml -f compose.edge-nginx.yml --profile production "$@"
          }
          caddy_restore() {
            edge rm -sf edge-nginx certbot >/dev/null 2>&1 || true
            docker compose --env-file .env.production --profile production up -d caddy >/dev/null 2>&1 || true
          }
          listener_ok() {
            curl -ksS --resolve panel.ithute.co.ls:443:127.0.0.1 \
              --connect-timeout 3 --max-time 10 -o /dev/null https://panel.ithute.co.ls/
          }

          # Do all template/certificate validation while Caddy is still serving
          # production. Nothing below this point needs ports 80/443 yet.
          edge pull edge-nginx certbot >/dev/null
          if ! edge run --rm --no-deps --entrypoint /bin/sh certbot \
            -c 'test -s /etc/letsencrypt/live/ithute-edge/fullchain.pem && test -s /etc/letsencrypt/live/ithute-edge/privkey.pem'; then
            echo 'Nginx certificate volume is missing; retaining Caddy and aborting the cutover.' >&2
            exit 1
          fi

          rendered="/tmp/ithute-nginx-rendered-${EDGE_SHA}.txt"
          if ! edge run --rm --no-deps --entrypoint /bin/sh edge-nginx -c \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t && nginx -T' >"$rendered" 2>&1; then
            cat "$rendered" >&2 || true
            echo 'Offline Nginx configuration validation failed; Caddy was left untouched.' >&2
            exit 1
          fi
          for required in 'auth.ithute.co.ls' 'panel.ithute.co.ls' 'portal.pay.ithute.co.ls' 'listen 443 ssl'; do
            if ! grep -Fq "$required" "$rendered"; then
              cat "$rendered" >&2 || true
              echo "Offline Nginx configuration is missing: $required" >&2
              exit 1
            fi
          done
          rm -f "$rendered"
          echo 'Offline Nginx template and certificate validation passed while Caddy remained online.'

          trap 'caddy_restore; exit 1' HUP INT TERM
          docker ps \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
            --filter 'label=com.docker.compose.service=caddy' \
            -q | xargs -r docker rm -f

          if ! edge up -d --no-build --no-deps --force-recreate edge-nginx certbot; then
            caddy_restore
            echo 'Nginx failed to start; Caddy restored.' >&2
            exit 1
          fi
          if ! edge exec -T edge-nginx nginx -t \
            || ! edge exec -T edge-nginx nginx -T 2>/dev/null | grep -Fq 'auth.ithute.co.ls' \
            || ! listener_ok; then
            edge logs --tail=250 edge-nginx certbot >&2 || true
            caddy_restore
            echo 'Nginx runtime verification failed; Caddy restored.' >&2
            exit 1
          fi

          trap - HUP INT TERM
          ss -lnt | grep -E ':(80|443)[[:space:]]' || true
          echo 'Nginx is now the active shared HTTPS edge.'
          REMOTE

      - name: Verify Nginx from the public Internet
        run: |
          set -eu
          for url in \
            https://panel.ithute.co.ls/ \
            https://pay.ithute.co.ls/ \
            https://portal.pay.ithute.co.ls/portal \
            https://auth.ithute.co.ls/healthz; do
            healthy=false
            for attempt in $(seq 1 15); do
              if curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null "$url"; then
                healthy=true
                break
              fi
              sleep 3
            done
            [ "$healthy" = true ] || { echo "::error::Public Nginx verification failed: $url"; exit 1; }
            echo "Nginx verified: $url"
          done

          echo | openssl s_client -connect auth.ithute.co.ls:443 -servername auth.ithute.co.ls 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates
          echo 'Nginx shared HTTPS edge is publicly healthy.'
