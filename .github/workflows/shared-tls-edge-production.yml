name: Recover Shared HTTPS Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-tls-edge-production.yml'
      - 'docker-compose.ithute-edge.yml'
      - 'infrastructure/ithute-edge/**'
  workflow_dispatch:

concurrency:
  group: ithute-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 204.12.205.224
  VPS_USER: administrator
  VPS_EDGE_DIR: /home/administrator/ithute-edge
  EDGE_SHA: ${{ github.sha }}

jobs:
  recover:
    name: Restore and validate dedicated Ithute HTTPS edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Check out exact recovery configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EDGE_SHA }}
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          set -eu
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "::error::VPS_SSH_KEY is required"; exit 1; }

      - name: Configure SSH identity
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_edge_recovery"
          chmod 600 "$HOME/.ssh/ithute_edge_recovery"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-edge-recovery-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-edge-recovery-askpass.sh
            SSH_ASKPASS=/tmp/ithute-edge-recovery-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              setsid -w ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
            rm -f /tmp/ithute-edge-recovery-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_edge_recovery" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage dedicated Ithute edge files
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          stage="/tmp/ithute-edge-${EDGE_SHA}"
          ssh "$remote" "rm -rf '$stage' && mkdir -p '$stage/infrastructure/ithute-edge'"
          scp docker-compose.ithute-edge.yml "$remote:$stage/docker-compose.ithute-edge.yml"
          scp infrastructure/ithute-edge/default.conf.template "$remote:$stage/infrastructure/ithute-edge/default.conf.template"
          scp infrastructure/ithute-edge/ithute-tls.conf "$remote:$stage/infrastructure/ithute-edge/ithute-tls.conf"

      - name: Prevalidate and switch the VPS edge
        run: |
          set -eu
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "EDGE_DIR='$VPS_EDGE_DIR' EDGE_SHA='$EDGE_SHA' sh -s" <<'REMOTE'
          set -eu

          if command -v flock >/dev/null 2>&1; then
            exec 9>/tmp/ithute-production.lock
            flock 9
          fi

          stage="/tmp/ithute-edge-${EDGE_SHA}"
          mkdir -p "$EDGE_DIR/infrastructure/ithute-edge"
          cp "$stage/docker-compose.ithute-edge.yml" "$EDGE_DIR/docker-compose.ithute-edge.yml"
          cp "$stage/infrastructure/ithute-edge/default.conf.template" "$EDGE_DIR/infrastructure/ithute-edge/default.conf.template"
          cp "$stage/infrastructure/ithute-edge/ithute-tls.conf" "$EDGE_DIR/infrastructure/ithute-edge/ithute-tls.conf"
          rm -rf "$stage"
          cd "$EDGE_DIR"

          : "${ITHUTE_MAILBOX_NETWORK_NAME:=mailbox-dns_mailbox_dns}"
          : "${ITHUTE_LOANHUB_NETWORK_NAME:=loanhub_loanhub}"
          : "${ITHUTE_LOANHUB_SANDBOX_NETWORK_NAME:=loanhub_sandbox}"
          : "${ITHUTE_EDGE_LETSENCRYPT_VOLUME:=loanhub_edge_letsencrypt}"
          : "${ITHUTE_EDGE_CERTBOT_WEBROOT_VOLUME:=loanhub_edge_certbot_webroot}"
          export ITHUTE_MAILBOX_NETWORK_NAME ITHUTE_LOANHUB_NETWORK_NAME ITHUTE_LOANHUB_SANDBOX_NETWORK_NAME
          export ITHUTE_EDGE_LETSENCRYPT_VOLUME ITHUTE_EDGE_CERTBOT_WEBROOT_VOLUME

          for network in "$ITHUTE_MAILBOX_NETWORK_NAME" "$ITHUTE_LOANHUB_NETWORK_NAME" "$ITHUTE_LOANHUB_SANDBOX_NETWORK_NAME"; do
            docker network inspect "$network" >/dev/null 2>&1 || {
              echo "Required shared edge network is missing: $network" >&2
              exit 1
            }
          done
          for volume in "$ITHUTE_EDGE_LETSENCRYPT_VOLUME" "$ITHUTE_EDGE_CERTBOT_WEBROOT_VOLUME"; do
            docker volume inspect "$volume" >/dev/null 2>&1 || {
              echo "Required shared edge volume is missing: $volume" >&2
              exit 1
            }
          done

          compose() {
            docker compose -p ithute-edge -f docker-compose.ithute-edge.yml "$@"
          }
          listener_ok() {
            curl -ksS --resolve auth.ithute.co.ls:443:127.0.0.1 \
              --connect-timeout 3 --max-time 10 -o /dev/null https://auth.ithute.co.ls/healthz
          }
          restore_legacy_caddy() {
            compose rm -sf edge-nginx certbot >/dev/null 2>&1 || true
            if [ -n "${legacy_caddy:-}" ]; then
              docker start "$legacy_caddy" >/dev/null 2>&1 || true
            fi
          }

          compose config >/dev/null
          compose pull edge-nginx certbot >/dev/null

          if ! compose run --rm --no-deps --entrypoint /bin/sh certbot \
            -c 'test -s /etc/letsencrypt/live/ithute-edge/fullchain.pem && test -s /etc/letsencrypt/live/ithute-edge/privkey.pem'; then
            echo 'Shared Ithute certificate volume is missing the ithute-edge certificate.' >&2
            exit 1
          fi

          rendered="/tmp/ithute-nginx-rendered-${EDGE_SHA}.txt"
          if ! compose run --rm --no-deps --entrypoint /bin/sh edge-nginx -c \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t && nginx -T' >"$rendered" 2>&1; then
            cat "$rendered" >&2 || true
            echo 'Offline Ithute Nginx configuration validation failed.' >&2
            exit 1
          fi
          for required in 'auth.ithute.co.ls' 'ithute.co.ls' 'portal.pay.ithute.co.ls' 'listen 443 ssl'; do
            grep -Fq "$required" "$rendered" || {
              cat "$rendered" >&2 || true
              echo "Offline Nginx configuration is missing: $required" >&2
              exit 1
            }
          done
          rm -f "$rendered"

          legacy_caddy="$(docker ps -a \
            --filter 'label=com.docker.compose.service=caddy' \
            --format '{{.ID}}' | head -n1 || true)"

          for id in $(docker ps --filter publish=443 --format '{{.ID}}'); do
            project="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$id" 2>/dev/null || true)"
            if [ "$project" != "ithute-edge" ]; then
              docker stop "$id" >/dev/null
            fi
          done

          trap 'restore_legacy_caddy; exit 1' HUP INT TERM
          if ! compose up -d --no-build --no-deps --force-recreate edge-nginx certbot; then
            restore_legacy_caddy
            echo 'Dedicated Ithute edge failed to start; legacy Caddy restored.' >&2
            exit 1
          fi

          if ! compose exec -T edge-nginx nginx -t \
            || ! compose exec -T edge-nginx nginx -T 2>/dev/null | grep -Fq 'auth.ithute.co.ls' \
            || ! listener_ok; then
            compose logs --tail=250 edge-nginx certbot >&2 || true
            restore_legacy_caddy
            echo 'Dedicated Ithute edge runtime verification failed; legacy Caddy restored.' >&2
            exit 1
          fi

          trap - HUP INT TERM
          ss -lnt | grep -E ':(80|443)[[:space:]]' || true
          echo 'Dedicated ithute-edge project now owns public HTTP/HTTPS.'
          REMOTE

      - name: Verify edge from the public Internet
        run: |
          set -eu
          for url in \
            https://ithute.co.ls/ \
            https://pay.ithute.co.ls/ \
            https://portal.pay.ithute.co.ls/portal \
            https://auth.ithute.co.ls/healthz; do
            healthy=false
            for attempt in $(seq 1 15); do
              if curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null "$url"; then
                healthy=true
                break
              fi
              sleep 3
            done
            [ "$healthy" = true ] || { echo "::error::Public Ithute edge verification failed: $url"; exit 1; }
            echo "Edge verified: $url"
          done

          echo | openssl s_client -connect auth.ithute.co.ls:443 -servername auth.ithute.co.ls 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates
          echo 'Dedicated Ithute HTTPS edge is publicly healthy.'