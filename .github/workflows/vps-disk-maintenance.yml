name: Ithute VPS Disk Maintenance

# Disk cleanup is intentionally manual. It must never race a production rollout
# or remove rollback images merely because a candidate temporarily replaced the
# running containers.
on:
  workflow_dispatch:

concurrency:
  group: ithute-vps-disk-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: /home/administrator/ithute-platform
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
      EXPECTED_IPV4: 204.12.205.224

    steps:
      - name: Validate VPS inputs
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$VPS_HOST" = "$EXPECTED_IPV4"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ithute_deploy"
          chmod 600 "$HOME/.ssh/ithute_deploy"
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            cat > /tmp/ithute-askpass.sh <<'SH'
          #!/usr/bin/env sh
          printf '%s\n' "$VPS_SSH_PASSPHRASE"
          SH
            chmod 700 /tmp/ithute-askpass.sh
            SSH_ASKPASS=/tmp/ithute-askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
            rm -f /tmp/ithute-askpass.sh
          else
            ssh-add "$HOME/.ssh/ithute_deploy" </dev/null
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reclaim stale Ithute deployment storage safely
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "$remote" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          echo 'Disk usage before Ithute cleanup:'
          df -h / /tmp || true
          docker system df || true

          rm -f \
            /tmp/ithute-images-*.tar.gz \
            /tmp/ithute-runtime-*.tgz \
            /tmp/ithute-deploy-production.sh \
            /tmp/ithute-runtime-compose.yml \
            /tmp/ithute-sso-headers \
            /tmp/ithute-sso-body \
            /tmp/ithute-ip-disabled-headers \
            /tmp/ithute-ip-disabled-body

          running_images="$(docker ps --format '{{.Image}}' | sort -u)"
          last_good_tag=""
          if [ -f "$APP_DIR/.last-known-good.env" ]; then
            last_good_tag="$(sed -n 's/^ITHUTE_IMAGE_TAG=//p' "$APP_DIR/.last-known-good.env" | tail -n1)"
          fi
          case "$last_good_tag" in
            ''|*[!0-9a-f]* ) last_good_tag="" ;;
          esac
          if [ -n "$last_good_tag" ] && [ "${#last_good_tag}" -ne 40 ]; then
            last_good_tag=""
          fi

          for repo in ithute-web ithute-app-api ithute-auth ithute-push ithute-realtime; do
            docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' | sort -u | while IFS= read -r image; do
              [ -n "$image" ] || continue
              if printf '%s\n' "$running_images" | grep -Fxq "$image"; then
                echo "Keeping running image $image"
              elif [ -n "$last_good_tag" ] && [ "$image" = "$repo:$last_good_tag" ]; then
                echo "Keeping last-known-good rollback image $image"
              else
                echo "Removing unused Ithute image $image"
                docker image rm "$image" || true
              fi
            done
          done

          # Only dangling layers are pruned. Named running and last-known-good
          # Ithute images above are retained explicitly.
          docker image prune -f || true

          echo 'Disk usage after Ithute cleanup:'
          df -h / /tmp || true
          docker system df || true

          available_kb="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
          if [ "${available_kb:-0}" -lt 1048576 ]; then
            echo "VPS still has less than 1 GiB free after safe Ithute cleanup; deployment archive transfer is unsafe." >&2
            exit 1
          fi
          REMOTE
