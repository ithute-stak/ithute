name: Webmail Authentication CI

on:
  pull_request:
    paths:
      - "apps/backend/app/services/webmail.py"
      - "apps/backend/tests/test_webmail_transport.py"
      - "apps/frontend/app/webmail/**"
      - "compose.production.yml"
      - "mail/compose.yml"
      - ".github/workflows/webmail-auth-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/app/services/webmail.py"
      - "apps/backend/tests/test_webmail_transport.py"
      - "apps/frontend/app/webmail/**"
      - "compose.production.yml"
      - "mail/compose.yml"
      - ".github/workflows/webmail-auth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify IMAP TLS and error handling
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-webmail-secret-key-000000000000000000000000
          DATABASE_URL: sqlite:///./webmail-auth-ci.db
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-123456
        run: pytest -q tests/test_webmail_transport.py

      - name: Verify production mail transport contract
        run: |
          set -euo pipefail
          grep -Fq 'WEBMAIL_IMAP_HOST: mail.ithute.co.ls' compose.production.yml
          grep -Fq 'WEBMAIL_IMAP_PORT: "993"' compose.production.yml
          grep -Fq 'IMAP4_SSL' apps/backend/app/services/webmail.py
          grep -Fq '"993:993"' mail/compose.yml

      - name: Verify webmail system sign-in uses Ithute Auth
        run: |
          set -euo pipefail
          grep -Fq '${API}/auth/ithute/login' apps/frontend/app/webmail/webmail-entry.tsx
          ! grep -Fq '${API}/auth/login' apps/frontend/app/webmail/webmail-entry.tsx
          ! grep -Fq 'systemPassword' apps/frontend/app/webmail/webmail-entry.tsx
          ! grep -Fq 'systemMfaCode' apps/frontend/app/webmail/webmail-entry.tsx
