services:
  ithute-app-api:
    environment:
      BACKUP_STATUS_DIR: /backup-status/status
      BACKUP_MAX_AGE_SECONDS: ${ITHUTE_BACKUP_MAX_AGE_SECONDS:-93600}
      BACKUP_REQUIRE_OFFSITE: ${ITHUTE_BACKUP_REQUIRE_OFFSITE:-false}
      BACKUP_OFFSITE_MAX_AGE_SECONDS: ${ITHUTE_BACKUP_OFFSITE_MAX_AGE_SECONDS:-10800}
    volumes:
      - ithute_backup_status:/backup-status/status:ro

  ithute-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/opt/ithute-backup/backup-loop.sh"]
    environment:
      ITHUTE_APP_DB_NAME: ${ITHUTE_APP_DB_NAME:-ithute_app}
      ITHUTE_APP_DB_USER: ${ITHUTE_APP_DB_USER:-ithute_app}
      ITHUTE_APP_DB_PASSWORD: ${ITHUTE_APP_DB_PASSWORD}
      ITHUTE_AUTH_DB_NAME: ${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      ITHUTE_AUTH_DB_USER: ${ITHUTE_AUTH_DB_USER:-ithute_auth}
      ITHUTE_AUTH_DB_PASSWORD: ${ITHUTE_AUTH_DB_PASSWORD}
      ITHUTE_PUSH_DB_NAME: ${ITHUTE_PUSH_DB_NAME:-ithute_push}
      ITHUTE_PUSH_DB_USER: ${ITHUTE_PUSH_DB_USER:-ithute_push}
      ITHUTE_PUSH_DB_PASSWORD: ${ITHUTE_PUSH_DB_PASSWORD}
      ITHUTE_REALTIME_DB_NAME: ${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}
      ITHUTE_REALTIME_DB_USER: ${ITHUTE_REALTIME_DB_USER:-ithute_realtime}
      ITHUTE_REALTIME_DB_PASSWORD: ${ITHUTE_REALTIME_DB_PASSWORD}
      BACKUP_ROOT: /backups
      BACKUP_STATUS_DIR: /backup-status/status
      BACKUP_INTERVAL_SECONDS: ${ITHUTE_BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${ITHUTE_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/backup:/opt/ithute-backup:ro
      - ithute_backup_data:/backups
      - ithute_backup_status:/backup-status/status
    depends_on:
      ithute-app-db:
        condition: service_healthy
      ithute-auth-db:
        condition: service_healthy
      ithute-push-db:
        condition: service_healthy
      ithute-realtime-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backup-status/status/last-run.json && grep -q '\"status\": \"success\"' /backup-status/status/last-run.json"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ithute]


  ithute-backup-offsite:
    image: rclone/rclone:1.69.1
    profiles: ["offsite-backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/ithute-backup/offsite-sync-loop.sh"]
    environment:
      BACKUP_ROOT: /backups
      BACKUP_STATUS_DIR: /backup-status/status
      BACKUP_REMOTE: ${ITHUTE_BACKUP_REMOTE:?ITHUTE_BACKUP_REMOTE is required for the offsite-backup profile}
      RCLONE_CONFIG: /config/rclone.conf
      OFFSITE_SYNC_INTERVAL_SECONDS: ${ITHUTE_BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}
    volumes:
      - ./infrastructure/backup:/opt/ithute-backup:ro
      - ithute_backup_data:/backups:ro
      - ithute_backup_status:/backup-status/status
      - ${ITHUTE_BACKUP_RCLONE_CONFIG:?ITHUTE_BACKUP_RCLONE_CONFIG is required for the offsite-backup profile}:/config/rclone.conf:ro
    depends_on:
      ithute-backup:
        condition: service_healthy
    networks: [ithute]

  ithute-restore-drill-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ITHUTE_RESTORE_DRILL_DB_USER:-ithute_restore}
      POSTGRES_PASSWORD: ${ITHUTE_RESTORE_DRILL_DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data:size=2g,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_RESTORE_DRILL_DB_USER:-ithute_restore} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ithute]

  ithute-restore-drill:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/opt/ithute-backup/restore-drill-loop.sh"]
    environment:
      BACKUP_ROOT: /backups
      BACKUP_STATUS_DIR: /backup-status/status
      RESTORE_DRILL_DB_HOST: ithute-restore-drill-db
      RESTORE_DRILL_DB_USER: ${ITHUTE_RESTORE_DRILL_DB_USER:-ithute_restore}
      RESTORE_DRILL_DB_PASSWORD: ${ITHUTE_RESTORE_DRILL_DB_PASSWORD}
      RESTORE_DRILL_INTERVAL_SECONDS: ${ITHUTE_RESTORE_DRILL_INTERVAL_SECONDS:-604800}
      RESTORE_DRILL_INITIAL_DELAY_SECONDS: ${ITHUTE_RESTORE_DRILL_INITIAL_DELAY_SECONDS:-120}
    volumes:
      - ./infrastructure/backup:/opt/ithute-backup:ro
      - ithute_backup_data:/backups:ro
      - ithute_backup_status:/backup-status/status
    depends_on:
      ithute-backup:
        condition: service_healthy
      ithute-restore-drill-db:
        condition: service_healthy
    networks: [ithute]

volumes:
  ithute_backup_data:
  ithute_backup_status:
