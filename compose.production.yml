name: ithute

x-auth-environment: &auth_environment
  AUTH_DATABASE_URL: postgresql+psycopg://${ITHUTE_AUTH_DB_USER:-ithute_auth}:${ITHUTE_AUTH_DB_PASSWORD}@ithute-auth-db:5432/${ITHUTE_AUTH_DB_NAME:-ithute_auth}
  AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
  AUTH_ACCOUNT_BASE_URL: ${ITHUTE_AUTH_ACCOUNT_BASE_URL:-https://auth.ithute.co.ls}
  AUTH_WEBAUTHN_RP_ID: ${ITHUTE_AUTH_WEBAUTHN_RP_ID:-auth.ithute.co.ls}
  AUTH_WEBAUTHN_RP_NAME: ${ITHUTE_AUTH_WEBAUTHN_RP_NAME:-!thute}
  AUTH_WEBAUTHN_ORIGIN: ${ITHUTE_AUTH_WEBAUTHN_ORIGIN:-https://auth.ithute.co.ls}
  AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
  AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
  AUTH_JWT_KEY_ID: ${ITHUTE_AUTH_JWT_KEY_ID:-ithute-auth-2026-01}
  AUTH_TOTP_ENCRYPTION_KEY: ${ITHUTE_AUTH_TOTP_ENCRYPTION_KEY}
  AUTH_SYSTEM_OWNER_EMAIL: ${ITHUTE_SYSTEM_OWNER_EMAIL:-thekoetlisi@ithute.co.ls}
  AUTH_SYSTEM_OWNER_PASSWORD: ${ITHUTE_SYSTEM_OWNER_PASSWORD}
  AUTH_FIRST_PARTY_CLIENTS: ${ITHUTE_AUTH_FIRST_PARTY_CLIENTS:-mailbox-dns:Mailbox DNS,ithute-realtime:!thute Realtime}
  AUTH_SERVICE_CLIENT_SECRETS_JSON: ${ITHUTE_AUTH_SERVICE_CLIENT_SECRETS_JSON}
  AUTH_REDIRECT_URIS_JSON: ${ITHUTE_AUTH_REDIRECT_URIS_JSON}
  AUTH_CORS_ORIGINS: ${ITHUTE_AUTH_CORS_ORIGINS:-https://ithute.co.ls,https://auth.ithute.co.ls}
  AUTH_PUSH_EVENTS_URL: http://ithute-push:8080/v1/internal/auth-events
  AUTH_PUSH_EVENT_WORKER_POLL_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_WORKER_POLL_SECONDS:-2}
  AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS:-5}
  AUTH_PUSH_EVENT_LEASE_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_LEASE_SECONDS:-30}
  AUTH_SMTP_HOST: ${ITHUTE_AUTH_SMTP_HOST:-}
  AUTH_SMTP_PORT: ${ITHUTE_AUTH_SMTP_PORT:-587}
  AUTH_SMTP_USERNAME: ${ITHUTE_AUTH_SMTP_USERNAME:-}
  AUTH_SMTP_PASSWORD: ${ITHUTE_AUTH_SMTP_PASSWORD:-}
  AUTH_SMTP_FROM: ${ITHUTE_AUTH_SMTP_FROM:-}
  AUTH_SMTP_STARTTLS: ${ITHUTE_AUTH_SMTP_STARTTLS:-true}

x-push-environment: &push_environment
  PUSH_DATABASE_URL: postgresql+psycopg://${ITHUTE_PUSH_DB_USER:-ithute_push}:${ITHUTE_PUSH_DB_PASSWORD}@ithute-push-db:5432/${ITHUTE_PUSH_DB_NAME:-ithute_push}
  PUSH_AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
  PUSH_AUTH_JWKS_URL: ${ITHUTE_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
  PUSH_ALLOWED_USER_CLIENTS: ${ITHUTE_PUSH_ALLOWED_USER_CLIENTS:-mailbox-dns}
  PUSH_ALLOWED_SERVICE_CLIENTS: ${ITHUTE_PUSH_ALLOWED_SERVICE_CLIENTS:-ithute-realtime}
  PUSH_DELEGATED_SERVICE_CLIENTS: ${ITHUTE_PUSH_DELEGATED_SERVICE_CLIENTS:-ithute-realtime}
  PUSH_ALLOWED_ADMIN_CLIENTS: ${ITHUTE_PUSH_ALLOWED_ADMIN_CLIENTS:-mailbox-dns}
  PUSH_ENDPOINT_ENCRYPTION_KEY: ${ITHUTE_PUSH_ENDPOINT_ENCRYPTION_KEY}
  PUSH_REQUIRED_PROVIDERS: ${ITHUTE_PUSH_REQUIRED_PROVIDERS:-}
  PUSH_FCM_PROJECT_ID: ${ITHUTE_PUSH_FCM_PROJECT_ID:-}
  PUSH_FCM_CREDENTIALS_FILE: /run/secrets/fcm-service-account.json
  PUSH_FCM_ANDROID_CHANNEL_ID: ${ITHUTE_PUSH_FCM_ANDROID_CHANNEL_ID:-ithute_default}
  PUSH_WORKER_POLL_SECONDS: ${ITHUTE_PUSH_WORKER_POLL_SECONDS:-2}
  PUSH_MAX_ATTEMPTS: ${ITHUTE_PUSH_MAX_ATTEMPTS:-4}

services:
  ithute-app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ITHUTE_APP_DB_NAME:-ithute_app}
      POSTGRES_USER: ${ITHUTE_APP_DB_USER:-ithute_app}
      POSTGRES_PASSWORD: ${ITHUTE_APP_DB_PASSWORD}
    volumes:
      - ithute_app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_APP_DB_USER:-ithute_app} -d ${ITHUTE_APP_DB_NAME:-ithute_app}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-app-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ithute_app_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-app-rspamd-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ithute_app_rspamd_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-app-api:
    image: ithute-app-api:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m app.bootstrap &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${ITHUTE_APP_BACKEND_WORKERS:-2} --proxy-headers
    environment:
      APP_NAME: ${ITHUTE_APP_NAME:-Ithute Mail & DNS}
      ENVIRONMENT: production
      PLATFORM_MODE: domain
      BOOTSTRAP_PUBLIC_IP: ${ITHUTE_PUBLIC_IPV4:-204.12.205.224}
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_RUNTIME_FILE: /platform-runtime/Caddyfile
      CADDY_BASE_FILE: /caddy-base/Caddyfile
      CADDY_ROUTES_DIR: /caddy-routes
      ITHUTE_EDGE_PUBLIC_IPS: ${ITHUTE_PUBLIC_IPV4:-204.12.205.224}
      ITHUTE_HOSTING_ORIGIN_CIDRS: ${ITHUTE_HOSTING_ORIGIN_CIDRS:-10.70.0.0/24}
      ITHUTE_WIREGUARD_SUBNET: ${ITHUTE_WIREGUARD_SUBNET:-10.70.0.0/24}
      ITHUTE_WIREGUARD_EDGE_ADDRESS: ${ITHUTE_WIREGUARD_EDGE_ADDRESS:-10.70.0.1}
      ITHUTE_WIREGUARD_EDGE_PUBLIC_KEY: ${ITHUTE_WIREGUARD_EDGE_PUBLIC_KEY:-}
      ITHUTE_WIREGUARD_EDGE_ENDPOINT: ${ITHUTE_WIREGUARD_EDGE_ENDPOINT:-}
      ITHUTE_WIREGUARD_LISTEN_PORT: ${ITHUTE_WIREGUARD_LISTEN_PORT:-51820}
      ITHUTE_WIREGUARD_RECONCILER_TOKEN: ${ITHUTE_WIREGUARD_RECONCILER_TOKEN:-}
      SECRET_KEY: ${ITHUTE_APP_SECRET_KEY}
      DKIM_ENCRYPTION_KEY: ${ITHUTE_APP_DKIM_ENCRYPTION_KEY}
      DKIM_ENCRYPTION_KEY_ID: ${ITHUTE_APP_DKIM_ENCRYPTION_KEY_ID:-v1}
      BILLING_WEBHOOK_SECRET: ${ITHUTE_APP_BILLING_WEBHOOK_SECRET}
      BILLING_GRACE_DAYS: ${ITHUTE_APP_BILLING_GRACE_DAYS:-7}
      SECURITY_DUAL_CONTROL_ENABLED: ${ITHUTE_SECURITY_DUAL_CONTROL_ENABLED:-true}
      SECURITY_APPROVAL_TTL_MINUTES: ${ITHUTE_SECURITY_APPROVAL_TTL_MINUTES:-30}
      DATABASE_URL: postgresql+psycopg://${ITHUTE_APP_DB_USER:-ithute_app}:${ITHUTE_APP_DB_PASSWORD}@ithute-app-db:5432/${ITHUTE_APP_DB_NAME:-ithute_app}
      REDIS_URL: redis://ithute-app-redis:6379/0
      RSPAMD_REDIS_URL: redis://ithute-app-rspamd-redis:6379/0
      FRONTEND_URL: https://ithute.co.ls
      BOOTSTRAP_ADMIN_EMAIL: ${ITHUTE_SYSTEM_OWNER_EMAIL:-thekoetlisi@ithute.co.ls}
      BOOTSTRAP_ADMIN_PASSWORD: ${ITHUTE_APP_BOOTSTRAP_ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      SYSTEM_EMAIL_FROM: ${ITHUTE_APP_SYSTEM_EMAIL_FROM:-info@ithute.co.ls}
      SYSTEM_SMTP_HOST: ${ITHUTE_APP_SYSTEM_SMTP_HOST:-mail.ithute.co.ls}
      SYSTEM_SMTP_PORT: ${ITHUTE_APP_SYSTEM_SMTP_PORT:-587}
      SYSTEM_SMTP_STARTTLS: "true"
      NAMESERVER_1: ns1.ithute.co.ls
      NAMESERVER_2: ns2.ithute.co.ls
      MAIL_HOSTNAME: mail.ithute.co.ls
      MAIL_PUBLIC_IP: ${ITHUTE_PUBLIC_IPV4:-204.12.205.224}
      MAIL_TLS_MODE: external
      MAIL_ACCOUNTS_FILE: /mail-accounts/postfix-accounts.cf
      MAIL_OPS_URL: https://mail.ithute.co.ls
      MAIL_OPS_TOKEN: ${ITHUTE_APP_MAIL_OPS_TOKEN}
      MAIL_NODE_TOKEN: ${ITHUTE_APP_MAIL_NODE_TOKEN}
      MAIL_ROUTING_DIR: /mail-routing
      MAIL_GATEWAY_INTERNAL_HOST: ${ITHUTE_MAIL_GATEWAY_INTERNAL_HOST:-mail.ithute.co.ls}
      MAIL_NODE_CONTROL_PLANE_URL: ${ITHUTE_MAIL_NODE_CONTROL_PLANE_URL:-https://ithute.co.ls}
      MAIL_NODE_PROVISIONER_URL: ${ITHUTE_MAIL_NODE_PROVISIONER_URL:-}
      MAIL_NODE_PROVISIONER_TOKEN: ${ITHUTE_MAIL_NODE_PROVISIONER_TOKEN:-}
      MAIL_NODE_PROVISIONER_TIMEOUT_SECONDS: ${ITHUTE_MAIL_NODE_PROVISIONER_TIMEOUT_SECONDS:-60}
      RECOVERY_OPS_URL: https://ithute.co.ls
      RECOVERY_OPS_TOKEN: ${ITHUTE_APP_RECOVERY_OPS_TOKEN}
      WEBMAIL_IMAP_HOST: mail.ithute.co.ls
      WEBMAIL_IMAP_PORT: "993"
      WEBMAIL_SMTP_HOST: mail.ithute.co.ls
      WEBMAIL_SMTP_PORT: "587"
      TRANSACTIONAL_SMTP_HOST: mail.ithute.co.ls
      TRANSACTIONAL_SMTP_PORT: "587"
      TRANSACTIONAL_SMTP_VERIFY_TLS: "true"
      TRANSACTIONAL_TENANT_PER_MINUTE_LIMIT: ${ITHUTE_TRANSACTIONAL_TENANT_PER_MINUTE_LIMIT:-120}
      TRANSACTIONAL_API_KEY_PER_MINUTE_LIMIT: ${ITHUTE_TRANSACTIONAL_API_KEY_PER_MINUTE_LIMIT:-60}
      MAIL_MTA_STS_ENABLED: "true"
      MAIL_MTA_STS_MODE: ${ITHUTE_MAIL_MTA_STS_MODE:-enforce}
      MAIL_MTA_STS_MAX_AGE_SECONDS: ${ITHUTE_MAIL_MTA_STS_MAX_AGE_SECONDS:-604800}
      MAIL_MTA_STS_POLICY_ID: ${ITHUTE_MAIL_MTA_STS_POLICY_ID:-20261003}
      MAIL_TLS_REPORTING_ADDRESS: ${ITHUTE_MAIL_TLS_REPORTING_ADDRESS:-tls-reports@ithute.co.ls}
      DKIM_ROTATION_DAYS: ${ITHUTE_DKIM_ROTATION_DAYS:-90}
      GROUPWARE_PUBLIC_URL: ${ITHUTE_APP_GROUPWARE_PUBLIC_URL:-https://ithute.co.ls/webmail}
      POWERDNS_API_URL: http://ithute-dns:8081/api/v1
      POWERDNS_API_KEY: ${ITHUTE_APP_POWERDNS_API_KEY}
      POWERDNS_SERVER_ID: localhost
      ITHUTE_AUTH_ENABLED: "true"
      ITHUTE_AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      ITHUTE_AUTH_AUDIENCE: mailbox-dns
      ITHUTE_AUTH_JWKS_URL: http://ithute-auth:8080/.well-known/jwks.json
      ITHUTE_AUTH_INTERNAL_URL: http://ithute-auth:8080
    volumes:
      - ${ITHUTE_MAIL_ACCOUNTS_DIR:-/home/administrator/ithute-platform-mail/accounts}:/mail-accounts
      - ${ITHUTE_MAIL_ROUTING_DIR:-/home/administrator/ithute-platform-mail/routing}:/mail-routing
      - ./infrastructure/caddy/Caddyfile:/caddy-base/Caddyfile:ro
      - ithute_caddy_routes:/caddy-routes
    depends_on:
      ithute-app-db:
        condition: service_healthy
      ithute-app-redis:
        condition: service_healthy
      ithute-app-rspamd-redis:
        condition: service_healthy
      ithute-auth:
        condition: service_healthy
      ithute-dns:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    networks: [ithute]

  ithute-hosting-health-controller:
    image: ithute-app-api:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.services.hosting_node_health_daemon"]
    environment:
      ENVIRONMENT: production
      PLATFORM_MODE: domain
      SECRET_KEY: ${ITHUTE_APP_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${ITHUTE_APP_DB_USER:-ithute_app}:${ITHUTE_APP_DB_PASSWORD}@ithute-app-db:5432/${ITHUTE_APP_DB_NAME:-ithute_app}
      ITHUTE_HOSTING_HEALTH_RECONCILE_SECONDS: ${ITHUTE_HOSTING_HEALTH_RECONCILE_SECONDS:-30}
      ITHUTE_HOSTING_HEALTH_HEARTBEAT_SECONDS: ${ITHUTE_HOSTING_HEALTH_HEARTBEAT_SECONDS:-180}
      ITHUTE_HOSTING_AUTO_ACTIVATE_SECONDS: ${ITHUTE_HOSTING_AUTO_ACTIVATE_SECONDS:-120}
      ITHUTE_HOSTING_AUTO_DRAIN_SECONDS: ${ITHUTE_HOSTING_AUTO_DRAIN_SECONDS:-60}
      ITHUTE_HOSTING_AUTO_RECOVER_SECONDS: ${ITHUTE_HOSTING_AUTO_RECOVER_SECONDS:-180}
      ITHUTE_HOSTING_FAILOVER_AFTER_SECONDS: ${ITHUTE_HOSTING_FAILOVER_AFTER_SECONDS:-300}
    depends_on:
      ithute-app-api:
        condition: service_healthy
    networks: [ithute]

  ithute-web:
    image: ithute-web:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    depends_on:
      ithute-app-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [ithute]

  ithute-auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      POSTGRES_USER: ${ITHUTE_AUTH_DB_USER:-ithute_auth}
      POSTGRES_PASSWORD: ${ITHUTE_AUTH_DB_PASSWORD}
    volumes:
      - ithute_auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_AUTH_DB_USER:-ithute_auth} -d ${ITHUTE_AUTH_DB_NAME:-ithute_auth}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-auth:
    image: ithute-auth:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    command: ["api"]
    restart: unless-stopped
    environment: *auth_environment
    volumes:
      - ./secrets/ithute-auth:/run/secrets:ro
    depends_on:
      ithute-auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [ithute]

  ithute-auth-push-event-worker:
    image: ithute-auth:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    command: ["push-event-worker"]
    restart: unless-stopped
    environment: *auth_environment
    volumes:
      - ./secrets/ithute-auth:/run/secrets:ro
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
    networks: [ithute]

  ithute-push-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ITHUTE_PUSH_DB_NAME:-ithute_push}
      POSTGRES_USER: ${ITHUTE_PUSH_DB_USER:-ithute_push}
      POSTGRES_PASSWORD: ${ITHUTE_PUSH_DB_PASSWORD}
    volumes:
      - ithute_push_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_PUSH_DB_USER:-ithute_push} -d ${ITHUTE_PUSH_DB_NAME:-ithute_push}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-push:
    image: ithute-push:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    command: ["api"]
    restart: unless-stopped
    environment: *push_environment
    volumes:
      - ./secrets/ithute-push:/run/secrets:ro
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [ithute]

  ithute-push-worker:
    image: ithute-push:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    command: ["worker"]
    restart: unless-stopped
    environment: *push_environment
    volumes:
      - ./secrets/ithute-push:/run/secrets:ro
    depends_on:
      ithute-push:
        condition: service_healthy
    networks: [ithute]

  ithute-realtime-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}
      POSTGRES_USER: ${ITHUTE_REALTIME_DB_USER:-ithute_realtime}
      POSTGRES_PASSWORD: ${ITHUTE_REALTIME_DB_PASSWORD}
    volumes:
      - ithute_realtime_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_REALTIME_DB_USER:-ithute_realtime} -d ${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-realtime-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ithute_realtime_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute]

  ithute-realtime:
    image: ithute-realtime:${ITHUTE_IMAGE_TAG:?ITHUTE_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      REALTIME_DATABASE_URL: postgresql+psycopg://${ITHUTE_REALTIME_DB_USER:-ithute_realtime}:${ITHUTE_REALTIME_DB_PASSWORD}@ithute-realtime-db:5432/${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}
      REALTIME_REDIS_URL: redis://ithute-realtime-redis:6379/0
      REALTIME_PUBLIC_URL: ${ITHUTE_REALTIME_PUBLIC_URL:-https://realtime.ithute.co.ls}
      REALTIME_AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      REALTIME_AUTH_JWKS_URL: ${ITHUTE_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
      REALTIME_ALLOWED_USER_CLIENTS: ${ITHUTE_REALTIME_ALLOWED_USER_CLIENTS:-}
      REALTIME_ALLOWED_SERVICE_CLIENTS: ${ITHUTE_REALTIME_ALLOWED_SERVICE_CLIENTS:-}
      REALTIME_AUTH_SERVICE_TOKEN_URL: http://ithute-auth:8080/v1/auth/service-token
      REALTIME_PLATFORM_CLIENT_ID: ithute-realtime
      REALTIME_PLATFORM_CLIENT_SECRET: ${ITHUTE_SERVICE_REALTIME_SECRET}
      REALTIME_PUSH_URL: http://ithute-push:8080
      REALTIME_PUSH_ENABLED: ${ITHUTE_REALTIME_PUSH_ENABLED:-true}
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
      ithute-realtime-db:
        condition: service_healthy
      ithute-realtime-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [ithute]

  ithute-dns:
    image: powerdns/pdns-auth-49:4.9.17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! pdnsutil list-all-zones | grep -Fxq 'ithute.co.ls'; then
          pdnsutil load-zone ithute.co.ls /seed/db.ithute.co.ls
        fi
        pdnsutil check-zone ithute.co.ls
        exec /usr/bin/tini -- /usr/local/sbin/pdns_server-startup
    environment:
      PDNS_AUTH_API_KEY: ${ITHUTE_APP_POWERDNS_API_KEY}
    ports:
      - "${ITHUTE_PUBLIC_IPV4:-204.12.205.224}:53:53/tcp"
      - "${ITHUTE_PUBLIC_IPV4:-204.12.205.224}:53:53/udp"
    volumes:
      - ithute_powerdns_data:/var/lib/powerdns
      - ./infrastructure/dns/zones/db.ithute.co.ls:/seed/db.ithute.co.ls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import os,urllib.request; request=urllib.request.Request("http://127.0.0.1:8081/api/v1/servers/localhost", headers={"X-API-Key": os.environ["PDNS_AUTH_API_KEY"]}); urllib.request.urlopen(request, timeout=3).read()'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks: [ithute]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      ithute-web:
        condition: service_healthy
      ithute-app-api:
        condition: service_healthy
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
      ithute-realtime:
        condition: service_healthy
      ithute-dns:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy:/etc/caddy:ro
      - ithute_caddy_data:/data
      - ithute_caddy_config:/config
      - ithute_caddy_routes:/routes:ro
    networks: [ithute]

networks:
  ithute:
    driver: bridge

volumes:
  ithute_app_postgres:
  ithute_app_redis:
  ithute_app_rspamd_redis:
  ithute_auth_postgres:
  ithute_push_postgres:
  ithute_realtime_postgres:
  ithute_realtime_redis:
  ithute_powerdns_data:
  # Retained so the former BIND cache volume is never removed by this migration.
  ithute_bind_cache:
  ithute_caddy_data:
  ithute_caddy_config:
  ithute_caddy_routes:
