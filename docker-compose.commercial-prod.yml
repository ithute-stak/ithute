services:
  backend:
    environment:
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      CADDY_RUNTIME_FILE: ${CADDY_RUNTIME_FILE:-/platform-runtime/Caddyfile}
    volumes:
      - platform_runtime:/platform-runtime

  caddy:
    image: caddy:2.9-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      radicale:
        condition: service_healthy
    environment:
      BOOTSTRAP_PUBLIC_IP: ${BOOTSTRAP_PUBLIC_IP}
      CADDY_RUNTIME_FILE: ${CADDY_RUNTIME_FILE:-/platform-runtime/Caddyfile}
    entrypoint: ["/bin/sh", "/usr/local/bin/mailbox-dns-caddy-bootstrap"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/bootstrap.sh:/usr/local/bin/mailbox-dns-caddy-bootstrap:ro
      - platform_runtime:/platform-runtime
      - caddy_data:/data
      - caddy_config:/config
    networks: [mailbox_dns]

volumes:
  platform_runtime:
  caddy_data:
  caddy_config:
