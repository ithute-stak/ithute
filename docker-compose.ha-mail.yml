services:
  mail-edge:
    build:
      context: ./infra/mail-edge
    restart: always
    environment:
      MAIL_EDGE_NODE1_HOST: ${MAIL_EDGE_NODE1_HOST}
      MAIL_EDGE_NODE1_SMTP_PORT: ${MAIL_EDGE_NODE1_SMTP_PORT:-25}
      MAIL_EDGE_NODE1_SUBMISSION_PORT: ${MAIL_EDGE_NODE1_SUBMISSION_PORT:-587}
      MAIL_EDGE_NODE1_IMAPS_PORT: ${MAIL_EDGE_NODE1_IMAPS_PORT:-993}
      MAIL_EDGE_NODE2_HOST: ${MAIL_EDGE_NODE2_HOST:-}
      MAIL_EDGE_NODE2_SMTP_PORT: ${MAIL_EDGE_NODE2_SMTP_PORT:-25}
      MAIL_EDGE_NODE2_SUBMISSION_PORT: ${MAIL_EDGE_NODE2_SUBMISSION_PORT:-587}
      MAIL_EDGE_NODE2_IMAPS_PORT: ${MAIL_EDGE_NODE2_IMAPS_PORT:-993}
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/tmp/haproxy.cfg"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [mailbox_dns]
