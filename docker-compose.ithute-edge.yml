name: ithute-edge

services:
  ithute-web:
    image: ${ITHUTE_WEB_IMAGE:-ghcr.io/ithute-stak/ithute-web}:${ITHUTE_WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
      - ithute_web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q ithute-web"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s

  edge-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-loanhub.co.ls}
      API_DOMAIN: ${API_DOMAIN:-api.loanhub.co.ls}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.loanhub.co.ls}
      SANDBOX_APP_DOMAIN: ${SANDBOX_APP_DOMAIN:-sandbox.loanhub.co.ls}
      SANDBOX_API_DOMAIN: ${SANDBOX_API_DOMAIN:-api-sandbox.loanhub.co.ls}
    depends_on:
      ithute-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/ithute-edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/ithute-edge/ithute-tls.conf:/etc/nginx/snippets/ithute-tls.conf:ro
      - edge_letsencrypt:/etc/letsencrypt:ro
      - edge_certbot_webroot:/var/www/certbot:ro
    command:
      - /bin/sh
      - -c
      - |
        /docker-entrypoint.d/20-envsubst-on-templates.sh
        nginx -t
        exec nginx -g 'daemon off;'
    networks:
      - ithute_web
      - ithute_platform
      - loanhub
      - loanhub_sandbox

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 43200 & wait $$! || true
        done
    volumes:
      - edge_letsencrypt:/etc/letsencrypt
      - edge_certbot_webroot:/var/www/certbot

networks:
  ithute_web:
    name: ithute-edge-web
  ithute_platform:
    external: true
    name: ${ITHUTE_PLATFORM_NETWORK_NAME:-mailbox-dns_mailbox_dns}
  # LoanHub owns these networks and all application/database services on them.
  # The shared edge joins them only to reach stable frontend/backend aliases.
  loanhub:
    external: true
    name: ${ITHUTE_LOANHUB_NETWORK_NAME:-loanhub_loanhub}
  loanhub_sandbox:
    external: true
    name: ${ITHUTE_LOANHUB_SANDBOX_NETWORK_NAME:-loanhub_sandbox}

volumes:
  edge_letsencrypt:
    external: true
    name: ${ITHUTE_EDGE_LETSENCRYPT_VOLUME:-loanhub_edge_letsencrypt}
  edge_certbot_webroot:
    external: true
    name: ${ITHUTE_EDGE_CERTBOT_WEBROOT_VOLUME:-loanhub_edge_certbot_webroot}
