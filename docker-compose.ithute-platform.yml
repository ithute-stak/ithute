x-ithute-push-environment: &ithute-push-environment
  PUSH_DATABASE_URL: postgresql+psycopg://${ITHUTE_PUSH_DB_USER:-ithute_push}:${ITHUTE_PUSH_DB_PASSWORD}@ithute-push-db:5432/${ITHUTE_PUSH_DB_NAME:-ithute_push}
  PUSH_AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
  PUSH_AUTH_JWKS_URL: ${ITHUTE_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
  PUSH_ALLOWED_USER_CLIENTS: ${ITHUTE_PUSH_ALLOWED_USER_CLIENTS:-loanhub,rsl-pos,mailbox-dns,ithute-account,ithute-tutor,ithute-pay}
  PUSH_ALLOWED_SERVICE_CLIENTS: ${ITHUTE_PUSH_ALLOWED_SERVICE_CLIENTS:-loanhub,rsl-pos,mailbox-dns,ithute-account,ithute-tutor,ithute-pay,ithute-realtime}
  PUSH_DELEGATED_SERVICE_CLIENTS: ${ITHUTE_PUSH_DELEGATED_SERVICE_CLIENTS:-ithute-realtime}
  PUSH_ALLOWED_ADMIN_CLIENTS: ${ITHUTE_PUSH_ALLOWED_ADMIN_CLIENTS:-mailbox-dns}
  PUSH_AUTH_CLOCK_SKEW_SECONDS: ${ITHUTE_PUSH_AUTH_CLOCK_SKEW_SECONDS:-30}
  PUSH_AUTH_MAX_PUSH_ACCESS_SECONDS: ${ITHUTE_PUSH_AUTH_MAX_PUSH_ACCESS_SECONDS:-600}
  PUSH_AUTH_MAX_SERVICE_TOKEN_SECONDS: ${ITHUTE_PUSH_AUTH_MAX_SERVICE_TOKEN_SECONDS:-600}
  PUSH_AUTH_MAX_ADMIN_TOKEN_SECONDS: ${ITHUTE_PUSH_AUTH_MAX_ADMIN_TOKEN_SECONDS:-180}
  PUSH_ENDPOINT_ENCRYPTION_KEY: ${ITHUTE_PUSH_ENDPOINT_ENCRYPTION_KEY}
  PUSH_WORKER_POLL_SECONDS: ${ITHUTE_PUSH_WORKER_POLL_SECONDS:-2}
  PUSH_MAX_ATTEMPTS: ${ITHUTE_PUSH_MAX_ATTEMPTS:-4}
  PUSH_REQUIRED_PROVIDERS: ${ITHUTE_PUSH_REQUIRED_PROVIDERS-fcm}
  PUSH_FCM_PROJECT_ID: ${ITHUTE_PUSH_FCM_PROJECT_ID:-}
  PUSH_FCM_CREDENTIALS_FILE: /run/secrets/fcm-service-account.json
  PUSH_FCM_ANDROID_CHANNEL_ID: ${ITHUTE_PUSH_FCM_ANDROID_CHANNEL_ID:-ithute_default}
  PUSH_APNS_TEAM_ID: ${ITHUTE_PUSH_APNS_TEAM_ID:-}
  PUSH_APNS_KEY_ID: ${ITHUTE_PUSH_APNS_KEY_ID:-}
  PUSH_APNS_BUNDLE_ID: ${ITHUTE_PUSH_APNS_BUNDLE_ID:-}
  PUSH_APNS_PRIVATE_KEY_FILE: /run/secrets/apns-private-key.p8
  PUSH_APNS_USE_SANDBOX: ${ITHUTE_PUSH_APNS_USE_SANDBOX:-false}
  PUSH_VAPID_SUBJECT: ${ITHUTE_PUSH_VAPID_SUBJECT:-mailto:admin@ithute.co.ls}
  PUSH_VAPID_PUBLIC_KEY: ${ITHUTE_PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private-key.pem

services:
  ithute-auth-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      POSTGRES_USER: ${ITHUTE_AUTH_DB_USER:-ithute_auth}
      POSTGRES_PASSWORD: ${ITHUTE_AUTH_DB_PASSWORD}
    volumes:
      - ithute_auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_AUTH_DB_USER:-ithute_auth} -d ${ITHUTE_AUTH_DB_NAME:-ithute_auth}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  ithute-auth:
    image: ${ITHUTE_AUTH_IMAGE:-ghcr.io/ithute-stak/ithute-auth}:${MAILBOX_DNS_IMAGE_TAG:-latest}
    command: ["api"]
    restart: always
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://${ITHUTE_AUTH_DB_USER:-ithute_auth}:${ITHUTE_AUTH_DB_PASSWORD}@ithute-auth-db:5432/${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      AUTH_ACCESS_TOKEN_MINUTES: ${ITHUTE_AUTH_ACCESS_TOKEN_MINUTES:-10}
      AUTH_REFRESH_TOKEN_DAYS: ${ITHUTE_AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH_SERVICE_TOKEN_MINUTES: ${ITHUTE_AUTH_SERVICE_TOKEN_MINUTES:-5}
      AUTH_PUSH_USER_TOKEN_MINUTES: ${ITHUTE_AUTH_PUSH_USER_TOKEN_MINUTES:-3}
      AUTH_AUTHORIZATION_CODE_MINUTES: ${ITHUTE_AUTH_AUTHORIZATION_CODE_MINUTES:-5}
      AUTH_BROWSER_SESSION_HOURS: ${ITHUTE_AUTH_BROWSER_SESSION_HOURS:-8}
      AUTH_PASSWORD_RESET_MINUTES: ${ITHUTE_AUTH_PASSWORD_RESET_MINUTES:-30}
      AUTH_VERIFICATION_CODE_MINUTES: ${ITHUTE_AUTH_VERIFICATION_CODE_MINUTES:-10}
      AUTH_RECOVERY_RATE_WINDOW_SECONDS: ${ITHUTE_AUTH_RECOVERY_RATE_WINDOW_SECONDS:-3600}
      AUTH_RECOVERY_MAX_REQUESTS_PER_IP: ${ITHUTE_AUTH_RECOVERY_MAX_REQUESTS_PER_IP:-20}
      AUTH_RECOVERY_MAX_REQUESTS_PER_USER: ${ITHUTE_AUTH_RECOVERY_MAX_REQUESTS_PER_USER:-5}
      AUTH_VERIFICATION_RATE_WINDOW_SECONDS: ${ITHUTE_AUTH_VERIFICATION_RATE_WINDOW_SECONDS:-3600}
      AUTH_VERIFICATION_MAX_REQUESTS_PER_USER: ${ITHUTE_AUTH_VERIFICATION_MAX_REQUESTS_PER_USER:-6}
      AUTH_VERIFICATION_CONFIRM_RATE_WINDOW_SECONDS: ${ITHUTE_AUTH_VERIFICATION_CONFIRM_RATE_WINDOW_SECONDS:-900}
      AUTH_VERIFICATION_CONFIRM_MAX_FAILURES_PER_USER: ${ITHUTE_AUTH_VERIFICATION_CONFIRM_MAX_FAILURES_PER_USER:-10}
      AUTH_MAX_LOGIN_FAILURES: ${ITHUTE_AUTH_MAX_LOGIN_FAILURES:-5}
      AUTH_LOGIN_LOCK_MINUTES: ${ITHUTE_AUTH_LOGIN_LOCK_MINUTES:-15}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${ITHUTE_AUTH_LOGIN_RATE_WINDOW_SECONDS:-900}
      AUTH_LOGIN_RATE_MAX_FAILURES_PER_IP: ${ITHUTE_AUTH_LOGIN_RATE_MAX_FAILURES_PER_IP:-50}
      AUTH_TRUSTED_PROXY_CIDRS: ${ITHUTE_AUTH_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      AUTH_TOTP_ISSUER_NAME: ${ITHUTE_AUTH_TOTP_ISSUER_NAME:-!thute}
      AUTH_TOTP_ENCRYPTION_KEY: ${ITHUTE_AUTH_TOTP_ENCRYPTION_KEY}
      AUTH_ACCOUNT_BASE_URL: ${ITHUTE_AUTH_ACCOUNT_BASE_URL:-https://auth.ithute.co.ls}
      AUTH_WEBAUTHN_RP_ID: ${ITHUTE_AUTH_WEBAUTHN_RP_ID:-auth.ithute.co.ls}
      AUTH_WEBAUTHN_RP_NAME: ${ITHUTE_AUTH_WEBAUTHN_RP_NAME:-!thute}
      AUTH_WEBAUTHN_ORIGIN: ${ITHUTE_AUTH_WEBAUTHN_ORIGIN:-https://auth.ithute.co.ls}
      AUTH_WEBAUTHN_CHALLENGE_MINUTES: ${ITHUTE_AUTH_WEBAUTHN_CHALLENGE_MINUTES:-5}
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
      AUTH_JWT_KEY_ID: ${ITHUTE_AUTH_JWT_KEY_ID:-ithute-auth-2026-01}
      AUTH_PREVIOUS_JWKS_JSON: ${ITHUTE_AUTH_PREVIOUS_JWKS_JSON:-}
      AUTH_FIRST_PARTY_CLIENTS: ${ITHUTE_AUTH_FIRST_PARTY_CLIENTS:-loanhub:LoanHub,rsl-pos:RSL POS,mailbox-dns:Mailbox DNS,ithute-account:Ithute Account,ithute-tutor:Ithute Tutor,ithute-pay:Ithute Pay,ithute-realtime:!thute Realtime}
      AUTH_REDIRECT_URIS_JSON: ${ITHUTE_AUTH_REDIRECT_URIS_JSON:-}
      AUTH_SERVICE_CLIENT_SECRETS_JSON: ${ITHUTE_AUTH_SERVICE_CLIENT_SECRETS_JSON:-}
      AUTH_CORS_ORIGINS: ${ITHUTE_AUTH_CORS_ORIGINS:-https://panel.ithute.co.ls,https://pay.ithute.co.ls}
      AUTH_PUSH_EVENTS_URL: ${ITHUTE_AUTH_PUSH_EVENTS_URL:-http://ithute-push:8080/v1/internal/auth-events}
      AUTH_PUSH_EVENT_WORKER_POLL_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_WORKER_POLL_SECONDS:-2}
      AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS:-5}
      AUTH_PUSH_EVENT_LEASE_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_LEASE_SECONDS:-30}
      AUTH_SMTP_HOST: ${ITHUTE_AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${ITHUTE_AUTH_SMTP_PORT:-587}
      AUTH_SMTP_USERNAME: ${ITHUTE_AUTH_SMTP_USERNAME:-}
      AUTH_SMTP_PASSWORD: ${ITHUTE_AUTH_SMTP_PASSWORD:-}
      AUTH_SMTP_FROM: ${ITHUTE_AUTH_SMTP_FROM:-}
      AUTH_SMTP_STARTTLS: ${ITHUTE_AUTH_SMTP_STARTTLS:-true}
      AUTH_SMS_WEBHOOK_URL: ${ITHUTE_AUTH_SMS_WEBHOOK_URL:-}
      AUTH_SMS_WEBHOOK_TOKEN: ${ITHUTE_AUTH_SMS_WEBHOOK_TOKEN:-}
    volumes:
      - ./platform-secrets/ithute-auth:/run/secrets:ro
    depends_on:
      ithute-auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [mailbox_dns]

  ithute-push-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ITHUTE_PUSH_DB_NAME:-ithute_push}
      POSTGRES_USER: ${ITHUTE_PUSH_DB_USER:-ithute_push}
      POSTGRES_PASSWORD: ${ITHUTE_PUSH_DB_PASSWORD}
    volumes:
      - ithute_push_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_PUSH_DB_USER:-ithute_push} -d ${ITHUTE_PUSH_DB_NAME:-ithute_push}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  ithute-push:
    image: ${ITHUTE_PUSH_IMAGE:-ghcr.io/ithute-stak/ithute-push}:${MAILBOX_DNS_IMAGE_TAG:-latest}
    command: ["api"]
    restart: always
    environment: *ithute-push-environment
    volumes:
      - ./platform-secrets/ithute-push:/run/secrets:ro
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [mailbox_dns]

  ithute-auth-push-event-worker:
    image: ${ITHUTE_AUTH_IMAGE:-ghcr.io/ithute-stak/ithute-auth}:${MAILBOX_DNS_IMAGE_TAG:-latest}
    command: ["push-event-worker"]
    restart: always
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://${ITHUTE_AUTH_DB_USER:-ithute_auth}:${ITHUTE_AUTH_DB_PASSWORD}@ithute-auth-db:5432/${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      AUTH_SERVICE_TOKEN_MINUTES: ${ITHUTE_AUTH_SERVICE_TOKEN_MINUTES:-5}
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
      AUTH_JWT_KEY_ID: ${ITHUTE_AUTH_JWT_KEY_ID:-ithute-auth-2026-01}
      AUTH_PREVIOUS_JWKS_JSON: ${ITHUTE_AUTH_PREVIOUS_JWKS_JSON:-}
      AUTH_PUSH_EVENTS_URL: ${ITHUTE_AUTH_PUSH_EVENTS_URL:-http://ithute-push:8080/v1/internal/auth-events}
      AUTH_PUSH_EVENT_WORKER_POLL_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_WORKER_POLL_SECONDS:-2}
      AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_REQUEST_TIMEOUT_SECONDS:-5}
      AUTH_PUSH_EVENT_LEASE_SECONDS: ${ITHUTE_AUTH_PUSH_EVENT_LEASE_SECONDS:-30}
    volumes:
      - ./platform-secrets/ithute-auth:/run/secrets:ro
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_started
    networks: [mailbox_dns]

  ithute-push-worker:
    image: ${ITHUTE_PUSH_IMAGE:-ghcr.io/ithute-stak/ithute-push}:${MAILBOX_DNS_IMAGE_TAG:-latest}
    command: ["worker"]
    restart: always
    environment: *ithute-push-environment
    volumes:
      - ./platform-secrets/ithute-push:/run/secrets:ro
    depends_on:
      ithute-push:
        condition: service_healthy
    networks: [mailbox_dns]

  ithute-realtime-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}
      POSTGRES_USER: ${ITHUTE_REALTIME_DB_USER:-ithute_realtime}
      POSTGRES_PASSWORD: ${ITHUTE_REALTIME_DB_PASSWORD}
    volumes:
      - ithute_realtime_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_REALTIME_DB_USER:-ithute_realtime} -d ${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  ithute-realtime-redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ithute_realtime_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  ithute-realtime:
    image: ${ITHUTE_REALTIME_IMAGE:-ghcr.io/ithute-stak/ithute-realtime}:${MAILBOX_DNS_IMAGE_TAG:-latest}
    restart: always
    environment:
      REALTIME_DATABASE_URL: postgresql+psycopg://${ITHUTE_REALTIME_DB_USER:-ithute_realtime}:${ITHUTE_REALTIME_DB_PASSWORD}@ithute-realtime-db:5432/${ITHUTE_REALTIME_DB_NAME:-ithute_realtime}
      REALTIME_REDIS_URL: redis://ithute-realtime-redis:6379/0
      REALTIME_PUBLIC_URL: ${ITHUTE_REALTIME_PUBLIC_URL:-https://realtime.ithute.co.ls}
      REALTIME_AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      REALTIME_AUTH_JWKS_URL: ${ITHUTE_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
      REALTIME_ALLOWED_USER_CLIENTS: ${ITHUTE_REALTIME_ALLOWED_USER_CLIENTS:-loanhub,rsl-pos,mailbox-dns,ithute-account,ithute-tutor,ithute-pay}
      REALTIME_ALLOWED_SERVICE_CLIENTS: ${ITHUTE_REALTIME_ALLOWED_SERVICE_CLIENTS:-loanhub,rsl-pos,mailbox-dns,ithute-account,ithute-tutor,ithute-pay}
      REALTIME_DISABLED_CLIENTS: ${ITHUTE_REALTIME_DISABLED_CLIENTS:-}
      REALTIME_AUTH_SERVICE_TOKEN_URL: http://ithute-auth:8080/v1/auth/service-token
      REALTIME_PLATFORM_CLIENT_ID: ithute-realtime
      REALTIME_PLATFORM_CLIENT_SECRET: ${ITHUTE_SERVICE_REALTIME_SECRET}
      REALTIME_PUSH_URL: http://ithute-push:8080
      REALTIME_PUSH_ENABLED: ${ITHUTE_REALTIME_PUSH_ENABLED:-true}
      REALTIME_WEBSOCKET_AUTH_TIMEOUT_SECONDS: ${ITHUTE_REALTIME_WEBSOCKET_AUTH_TIMEOUT_SECONDS:-10}
      REALTIME_WEBSOCKET_PRESENCE_TTL_SECONDS: ${ITHUTE_REALTIME_WEBSOCKET_PRESENCE_TTL_SECONDS:-90}
      REALTIME_WEBSOCKET_IDLE_TIMEOUT_SECONDS: ${ITHUTE_REALTIME_WEBSOCKET_IDLE_TIMEOUT_SECONDS:-120}
      REALTIME_WEBSOCKET_SEND_TIMEOUT_SECONDS: ${ITHUTE_REALTIME_WEBSOCKET_SEND_TIMEOUT_SECONDS:-5}
      REALTIME_MAX_CONNECTIONS_PER_USER: ${ITHUTE_REALTIME_MAX_CONNECTIONS_PER_USER:-8}
      REALTIME_MAX_CONNECTIONS_PER_DEVICE: ${ITHUTE_REALTIME_MAX_CONNECTIONS_PER_DEVICE:-3}
      REALTIME_MAX_MESSAGE_CHARS: ${ITHUTE_REALTIME_MAX_MESSAGE_CHARS:-4000}
      REALTIME_MAX_GROUP_MEMBERS: ${ITHUTE_REALTIME_MAX_GROUP_MEMBERS:-500}
      REALTIME_MAX_HISTORY_PAGE_SIZE: ${ITHUTE_REALTIME_MAX_HISTORY_PAGE_SIZE:-200}
      REALTIME_MAX_EVENT_RECIPIENTS: ${ITHUTE_REALTIME_MAX_EVENT_RECIPIENTS:-5000}
      REALTIME_MAX_REPLAY_PAGE_SIZE: ${ITHUTE_REALTIME_MAX_REPLAY_PAGE_SIZE:-500}
      REALTIME_USER_SEND_RATE_LIMIT: ${ITHUTE_REALTIME_USER_SEND_RATE_LIMIT:-120}
      REALTIME_USER_SEND_RATE_WINDOW_SECONDS: ${ITHUTE_REALTIME_USER_SEND_RATE_WINDOW_SECONDS:-60}
      REALTIME_ACTIVITY_RATE_LIMIT: ${ITHUTE_REALTIME_ACTIVITY_RATE_LIMIT:-180}
      REALTIME_ACTIVITY_RATE_WINDOW_SECONDS: ${ITHUTE_REALTIME_ACTIVITY_RATE_WINDOW_SECONDS:-60}
      REALTIME_SERVICE_PUBLISH_RATE_LIMIT: ${ITHUTE_REALTIME_SERVICE_PUBLISH_RATE_LIMIT:-1000}
      REALTIME_SERVICE_PUBLISH_RATE_WINDOW_SECONDS: ${ITHUTE_REALTIME_SERVICE_PUBLISH_RATE_WINDOW_SECONDS:-60}
      REALTIME_EVENT_MAX_ATTEMPTS: ${ITHUTE_REALTIME_EVENT_MAX_ATTEMPTS:-5}
      REALTIME_EVENT_RETRY_SECONDS: ${ITHUTE_REALTIME_EVENT_RETRY_SECONDS:-10}
      REALTIME_EVENT_WORKER_POLL_SECONDS: ${ITHUTE_REALTIME_EVENT_WORKER_POLL_SECONDS:-1}
      REALTIME_EVENT_RETENTION_DAYS: ${ITHUTE_REALTIME_EVENT_RETENTION_DAYS:-30}
      REALTIME_AUDIT_RETENTION_DAYS: ${ITHUTE_REALTIME_AUDIT_RETENTION_DAYS:-180}
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
      ithute-realtime-db:
        condition: service_healthy
      ithute-realtime-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [mailbox_dns]

  # The production nginx is the internal upstream used by the shared HTTPS edge.
  # Requiring every central platform API healthy prevents advertising platform
  # hostnames while Auth, Push or Realtime is unavailable.
  nginx:
    depends_on:
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
      ithute-realtime:
        condition: service_healthy

volumes:
  ithute_auth_postgres:
  ithute_push_postgres:
  ithute_realtime_postgres:
  ithute_realtime_redis:
