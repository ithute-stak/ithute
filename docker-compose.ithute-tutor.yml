# Ithute Tutor is an independent product stack. Its database stays on a
# private internal network; the backend also joins the shared Ithute platform
# network for central Auth, Push and Realtime access.
services:
  tutor-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ITHUTE_TUTOR_DB_NAME:-ithute_tutor}
      POSTGRES_USER: ${ITHUTE_TUTOR_DB_USER:-ithute_tutor}
      POSTGRES_PASSWORD: ${ITHUTE_TUTOR_DB_PASSWORD}
    volumes:
      - ithute_tutor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITHUTE_TUTOR_DB_USER:-ithute_tutor} -d ${ITHUTE_TUTOR_DB_NAME:-ithute_tutor}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ithute_tutor_private]

  tutor-backend:
    image: ghcr.io/ithute-stak/ithute-tutor-backend:${ITHUTE_TUTOR_IMAGE_TAG:-local}
    build:
      context: ./products/ithute-tutor/sms_back_end
    restart: always
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg2://${ITHUTE_TUTOR_DB_USER:-ithute_tutor}:${ITHUTE_TUTOR_DB_PASSWORD}@tutor-db:5432/${ITHUTE_TUTOR_DB_NAME:-ithute_tutor}
      TUTOR_PUBLIC_URL: ${ITHUTE_TUTOR_PUBLIC_URL:-https://tutor.ithute.co.ls}
      TUTOR_FRONTEND_URL: ${ITHUTE_TUTOR_FRONTEND_URL:-https://tutor.ithute.co.ls}
      AUTH_ISSUER: ${ITHUTE_AUTH_ISSUER:-https://auth.ithute.co.ls}
      AUTH_AUDIENCE: ithute-tutor
      AUTH_INTERNAL_BASE_URL: http://ithute-auth:8080
      AUTH_JWKS_URL: http://ithute-auth:8080/.well-known/jwks.json
      AUTH_OIDC_REDIRECT_URI: ${ITHUTE_TUTOR_OIDC_REDIRECT_URI:-https://tutor.ithute.co.ls/api/auth/oidc/callback}
      AUTH_COOKIE_SECURE: ${ITHUTE_TUTOR_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${ITHUTE_TUTOR_COOKIE_SAMESITE:-lax}
      LEGACY_AUTH_ENABLED: ${ITHUTE_TUTOR_LEGACY_AUTH_ENABLED:-false}
      PUSH_BASE_URL: http://ithute-push:8080
      PUSH_SERVICE_CLIENT_ID: ithute-tutor
      PUSH_SERVICE_CLIENT_SECRET: ${ITHUTE_TUTOR_PUSH_SERVICE_CLIENT_SECRET}
      TUTOR_BOOTSTRAP_AUTH_USER_ID: ${ITHUTE_TUTOR_BOOTSTRAP_AUTH_USER_ID:-}
      TUTOR_BOOTSTRAP_ADMIN_EMAIL: ${ITHUTE_TUTOR_BOOTSTRAP_ADMIN_EMAIL:-}
      TUTOR_BOOTSTRAP_ADMIN_USERNAME: ${ITHUTE_TUTOR_BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      MPESA_API_KEY: ${ITHUTE_TUTOR_MPESA_API_KEY:-}
      MPESA_PUBLIC_KEY: ${ITHUTE_TUTOR_MPESA_PUBLIC_KEY:-}
      MPESA_BASE_URL: ${ITHUTE_TUTOR_MPESA_BASE_URL:-}
      MPESA_MARKET: ${ITHUTE_TUTOR_MPESA_MARKET:-}
      MPESA_COUNTRY: ${ITHUTE_TUTOR_MPESA_COUNTRY:-LS}
      MPESA_CURRENCY: ${ITHUTE_TUTOR_MPESA_CURRENCY:-LSL}
      MPESA_SHORTCODE: ${ITHUTE_TUTOR_MPESA_SHORTCODE:-}
      MPESA_MODEL: ${ITHUTE_TUTOR_MPESA_MODEL:-}
    volumes:
      - ithute_tutor_media:/app/media/students
    depends_on:
      tutor-db:
        condition: service_healthy
      ithute-auth:
        condition: service_healthy
      ithute-push:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ITHUTE_TUTOR_BACKEND_PORT:-8202}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [ithute_tutor_private, mailbox_dns]

  tutor-frontend:
    image: ghcr.io/ithute-stak/ithute-tutor-frontend:${ITHUTE_TUTOR_IMAGE_TAG:-local}
    build:
      context: ./products/ithute-tutor/sms-frontend
      args:
        NEXT_PUBLIC_TUTOR_API_URL: /api
    restart: always
    init: true
    environment:
      NEXT_PUBLIC_TUTOR_API_URL: /api
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      tutor-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ITHUTE_TUTOR_FRONTEND_PORT:-3202}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [mailbox_dns]

networks:
  ithute_tutor_private:
    driver: bridge
    internal: true

volumes:
  ithute_tutor_postgres:
  ithute_tutor_media:
