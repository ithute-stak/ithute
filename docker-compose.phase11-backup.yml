services:
  backend:
    environment:
      BACKUP_STATUS_DIR: ${BACKUP_STATUS_DIR:-/backup-status/status}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
      RECOVERY_OPS_URL: ${RECOVERY_OPS_URL:-http://backup-recovery:9081}
      RECOVERY_OPS_TOKEN: ${RECOVERY_OPS_TOKEN:-development-recovery-ops-token-change-me}
    volumes:
      - backup_workspace:/backup-status:ro

  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-development-restic-password-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: ${POSTGRES_DB:-lelefamail}
      APP_DB_USER: ${POSTGRES_USER:-lelefamail}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
      PDNS_DB_HOST: powerdns-db
      PDNS_DB_PORT: 5432
      PDNS_DB_NAME: ${POWERDNS_DB_NAME:-powerdns}
      PDNS_DB_USER: ${POWERDNS_DB_USER:-powerdns}
      PDNS_DB_PASSWORD: ${POWERDNS_DB_PASSWORD:-powerdns_dev_password}
      AUTH_DB_HOST: ${ITHUTE_AUTH_DB_HOST:-ithute-auth-db}
      AUTH_DB_PORT: ${ITHUTE_AUTH_DB_PORT:-5432}
      AUTH_DB_NAME: ${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      AUTH_DB_USER: ${ITHUTE_AUTH_DB_USER:-ithute_auth}
      # Empty keeps legacy deployments working; when the central Auth password is configured, identity backup becomes mandatory for that run.
      AUTH_DB_PASSWORD: ${ITHUTE_AUTH_DB_PASSWORD:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-5}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
      RESTORE_DB_HOST: restore-postgres
      RESTORE_DB_PORT: 5432
      RESTORE_DB_USER: restore
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:-restore_dev_password}
    depends_on:
      postgres: {condition: service_healthy}
      powerdns-db: {condition: service_healthy}
    volumes:
      - backup_repository:/repository
      - backup_workspace:/workspace
      - backup_restore:/restore
      - mail_data:/data/mail:ro
    networks: [mailbox_dns]

  backup-scheduler:
    build:
      context: ./infra/backup
    restart: unless-stopped
    command: ["mailbox-backup-scheduler", "loop"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-development-restic-password-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: ${POSTGRES_DB:-lelefamail}
      APP_DB_USER: ${POSTGRES_USER:-lelefamail}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
      PDNS_DB_HOST: powerdns-db
      PDNS_DB_PORT: 5432
      PDNS_DB_NAME: ${POWERDNS_DB_NAME:-powerdns}
      PDNS_DB_USER: ${POWERDNS_DB_USER:-powerdns}
      PDNS_DB_PASSWORD: ${POWERDNS_DB_PASSWORD:-powerdns_dev_password}
      AUTH_DB_HOST: ${ITHUTE_AUTH_DB_HOST:-ithute-auth-db}
      AUTH_DB_PORT: ${ITHUTE_AUTH_DB_PORT:-5432}
      AUTH_DB_NAME: ${ITHUTE_AUTH_DB_NAME:-ithute_auth}
      AUTH_DB_USER: ${ITHUTE_AUTH_DB_USER:-ithute_auth}
      AUTH_DB_PASSWORD: ${ITHUTE_AUTH_DB_PASSWORD:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-5}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_SCHEDULE_SECONDS: ${BACKUP_SCHEDULE_SECONDS:-21600}
      BACKUP_INITIAL_DELAY_SECONDS: ${BACKUP_INITIAL_DELAY_SECONDS:-30}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
    depends_on:
      postgres: {condition: service_healthy}
      powerdns-db: {condition: service_healthy}
    volumes:
      - backup_repository:/repository
      - backup_workspace:/workspace
      - mail_data:/data/mail:ro
    healthcheck:
      test: ["CMD-SHELL", "mailbox-backup-status --health >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks: [mailbox_dns]

  backup-recovery:
    build:
      context: ./infra/backup
    restart: unless-stopped
    command: ["python3", "/usr/local/bin/mailbox-recovery-server"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-development-restic-password-change-me}
      RECOVERY_OPS_TOKEN: ${RECOVERY_OPS_TOKEN:-development-recovery-ops-token-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - backup_repository:/repository
      - backup_restore:/restore
      - mail_data:/data/mail
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9081/health',timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mailbox_dns]

  restore-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restore
      POSTGRES_PASSWORD: ${RESTORE_DB_PASSWORD:-restore_dev_password}
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mailbox_dns]

volumes:
  backup_repository:
  backup_workspace:
  backup_restore:
