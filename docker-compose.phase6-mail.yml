services:
  backend:
    environment:
      MAIL_DATA_PATH: /srv/vmail
      RECOVERY_OPS_URL: ${RECOVERY_OPS_URL:-http://backup-recovery:9081}
      RECOVERY_OPS_TOKEN: ${RECOVERY_OPS_TOKEN:-development-recovery-ops-token-change-me}
      RECOVERY_OPS_TIMEOUT_SECONDS: ${RECOVERY_OPS_TIMEOUT_SECONDS:-120}
      GROUPWARE_PUBLIC_URL: ${GROUPWARE_PUBLIC_URL:-http://localhost:5232}
      GROUPWARE_AUTH_FILE: /groupware-auth/users
      TRANSACTIONAL_SMTP_HOST: postfix
      TRANSACTIONAL_SMTP_PORT: 587
      TRANSACTIONAL_SMTP_VERIFY_TLS: ${TRANSACTIONAL_SMTP_VERIFY_TLS:-false}
      TRANSACTIONAL_DEFAULT_DAILY_LIMIT: ${TRANSACTIONAL_DEFAULT_DAILY_LIMIT:-1000}
      TRANSACTIONAL_TENANT_DAILY_LIMIT: ${TRANSACTIONAL_TENANT_DAILY_LIMIT:-10000}
      TRANSACTIONAL_MAX_RECIPIENTS: ${TRANSACTIONAL_MAX_RECIPIENTS:-100}
      MAIL_NODE_TOKEN: ${MAIL_NODE_TOKEN:-development-mail-node-token-change-me}
      MAIL_NODE_STALE_SECONDS: ${MAIL_NODE_STALE_SECONDS:-180}
    volumes:
      - mail_data:/srv/vmail
      - groupware_auth:/groupware-auth

  unbound:
    build:
      context: ./infra/unbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 . SOA +time=2 +tries=1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      phase6_mail_dns:
        ipv4_address: 172.31.56.53

  rspamd-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - rspamd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  rspamd:
    image: rspamd/rspamd:3.13
    restart: unless-stopped
    depends_on:
      rspamd-redis: {condition: service_healthy}
      unbound: {condition: service_healthy}
    volumes:
      - rspamd_data:/var/lib/rspamd
      - ./infra/rspamd/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      - ./infra/rspamd/options.inc:/etc/rspamd/local.d/options.inc:ro
      - ./infra/rspamd/dkim_signing.conf:/etc/rspamd/local.d/dkim_signing.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rspamadm configtest >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      mailbox_dns:
      phase6_mail_dns:
        ipv4_address: 172.31.56.54

  smtp-policy:
    build:
      context: ./apps/backend
    restart: unless-stopped
    command: ["python", "-m", "app.services.smtp_policy_server"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-lelefamail}
      POSTGRES_USER: ${POSTGRES_USER:-lelefamail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',10031),2);s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [mailbox_dns]

  dovecot:
    build:
      context: ./infra/dovecot
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lelefamail}
      POSTGRES_USER: ${POSTGRES_USER:-lelefamail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.phase8.test}
      MAIL_TLS_MODE: ${MAIL_TLS_MODE:-selfsigned}
      DOVECOT_REPLICATION_PEER: ${DOVECOT_REPLICATION_PEER:-}
      DOVECOT_REPLICATION_PASSWORD: ${DOVECOT_REPLICATION_PASSWORD:-}
    volumes:
      - mail_data:/srv/vmail
      - dovecot_tls:/etc/dovecot/tls
    ports:
      - "${IMAP_PORT:-2143}:143"
      - "${IMAPS_PORT:-2993}:993"
      - "${DOVECOT_REPLICATION_PORT:-24245}:24245"
    healthcheck:
      test: ["CMD-SHELL", "doveconf -n >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [mailbox_dns]

  postfix:
    build:
      context: ./infra/postfix
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      dovecot: {condition: service_healthy}
      rspamd: {condition: service_healthy}
      smtp-policy: {condition: service_healthy}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lelefamail}
      POSTGRES_USER: ${POSTGRES_USER:-lelefamail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.phase8.test}
      MAIL_TLS_MODE: ${MAIL_TLS_MODE:-selfsigned}
      MAIL_TLS_CERT_PATH: ${MAIL_TLS_CERT_PATH:-/etc/postfix/tls/cert.pem}
      MAIL_TLS_KEY_PATH: ${MAIL_TLS_KEY_PATH:-/etc/postfix/tls/key.pem}
      MAIL_OPS_TOKEN: ${MAIL_OPS_TOKEN:-development-mail-ops-token-change-me}
      MAIL_OPS_PORT: 9080
    volumes:
      - postfix_tls:/etc/postfix/tls
      - ./scripts/mail-queue.py:/usr/local/bin/mailbox-mail-queue:ro
    ports:
      - "${SMTP_PORT:-2525}:25"
      - "${SUBMISSION_PORT:-2587}:587"
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 && printf 'QUIT\\r\\n' | nc -w 5 127.0.0.1 25 | grep -q '^220 '"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s
    networks: [mailbox_dns]

  radicale:
    build:
      context: ./infra/radicale
    restart: unless-stopped
    volumes:
      - groupware_data:/var/lib/radicale/collections
      - groupware_auth:/auth
    ports:
      - "${GROUPWARE_PORT:-5232}:5232"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5232/.web/', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mailbox_dns]

volumes:
  mail_data:
  rspamd_data:
  rspamd_redis_data:
  postfix_tls:
  dovecot_tls:
  groupware_data:
  groupware_auth:

networks:
  phase6_mail_dns:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.56.0/24
