services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    command: sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4} --proxy-headers"

  frontend:
    build:
      context: ./apps/frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: always
    command: node server.js
    # The production runner binds IPv4 on 0.0.0.0. Use Node itself for the
    # health probe so the check does not depend on BusyBox wget or localhost
    # resolving to IPv6 (::1) inside Alpine containers.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('http');const req=http.get('http://127.0.0.1:3000/',res=>{res.resume();process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.setTimeout(4000,()=>{req.destroy();process.exit(1)});req.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8086}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mailbox_dns
