services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailbox_dns_test
      POSTGRES_USER: mailbox_dns_test
      POSTGRES_PASSWORD: mailbox_dns_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox_dns_test -d mailbox_dns_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  backend-test:
    build: ./apps/backend
    working_dir: /app
    environment:
      APP_NAME: Mailbox DNS Test
      ENVIRONMENT: test
      SECRET_KEY: phase-1-test-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://mailbox_dns_test:mailbox_dns_test_password@postgres-test:5432/mailbox_dns_test
      REDIS_URL: redis://redis-test:6379/0
      FRONTEND_URL: http://localhost:3006
      BOOTSTRAP_ADMIN_EMAIL: test-owner@example.test
      BOOTSTRAP_ADMIN_PASSWORD: Phase1-Test-Password!
      PYTHONPATH: /app
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m pytest -q"

  frontend-test:
    build:
      context: ./apps/frontend
      target: builder
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8006/api/v1
    command: sh -c "npm run build"
