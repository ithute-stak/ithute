services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lelefamail}
      POSTGRES_USER: ${POSTGRES_USER:-lelefamail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lelefamail_dev_password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lelefamail} -d ${POSTGRES_DB:-lelefamail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mailbox_dns]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mailbox_dns]

  powerdns-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POWERDNS_DB_NAME:-powerdns}
      POSTGRES_USER: ${POWERDNS_DB_USER:-powerdns}
      POSTGRES_PASSWORD: ${POWERDNS_DB_PASSWORD:-powerdns_dev_password}
    volumes:
      - powerdns_data:/var/lib/postgresql/data
      - ./infra/powerdns/schema.sql:/docker-entrypoint-initdb.d/01-powerdns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POWERDNS_DB_USER:-powerdns} -d ${POWERDNS_DB_NAME:-powerdns}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mailbox_dns]

  powerdns:
    image: powerdns/pdns-auth-49:4.9.17
    restart: unless-stopped
    depends_on:
      powerdns-db: {condition: service_healthy}
    environment:
      PDNS_AUTH_API_KEY: ${POWERDNS_API_KEY:-development-powerdns-api-key-change-me}
    command:
      - --launch=gpgsql
      - --gpgsql-host=powerdns-db
      - --gpgsql-dbname=${POWERDNS_DB_NAME:-powerdns}
      - --gpgsql-user=${POWERDNS_DB_USER:-powerdns}
      - --gpgsql-password=${POWERDNS_DB_PASSWORD:-powerdns_dev_password}
      - --gpgsql-dnssec=yes
      - --primary=yes
      - --secondary=no
    volumes:
      - ./infra/powerdns/pdns.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pdns_control rping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [mailbox_dns]

  backend:
    build: {context: ./apps/backend}
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Mailbox DNS}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PLATFORM_MODE: ${PLATFORM_MODE:-bootstrap}
      BOOTSTRAP_PUBLIC_IP: ${BOOTSTRAP_PUBLIC_IP:-}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      CADDY_RUNTIME_FILE: ${CADDY_RUNTIME_FILE:-/platform-runtime/Caddyfile}
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-key-change-me-1234}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:-}
      DKIM_ENCRYPTION_KEY_ID: ${DKIM_ENCRYPTION_KEY_ID:-v1}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-development-billing-webhook-secret-change-me-1234}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      INVITATION_EXPIRE_HOURS: ${INVITATION_EXPIRE_HOURS:-72}
      EMAIL_VERIFICATION_EXPIRE_HOURS: ${EMAIL_VERIFICATION_EXPIRE_HOURS:-24}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lelefamail:lelefamail_dev_password@postgres:5432/lelefamail}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RSPAMD_REDIS_URL: ${RSPAMD_REDIS_URL:-redis://rspamd-redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3006}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SIGNUP_RATE_WINDOW_SECONDS: ${SIGNUP_RATE_WINDOW_SECONDS:-3600}
      SIGNUP_RATE_MAX_ATTEMPTS: ${SIGNUP_RATE_MAX_ATTEMPTS:-20}
      SYSTEM_EMAIL_FROM: ${SYSTEM_EMAIL_FROM:-}
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
      SYSTEM_SMTP_USERNAME: ${SYSTEM_SMTP_USERNAME:-}
      SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
      SYSTEM_SMTP_SSL: ${SYSTEM_SMTP_SSL:-false}
      SYSTEM_SMTP_STARTTLS: ${SYSTEM_SMTP_STARTTLS:-true}
      NAMESERVER_1: ${NAMESERVER_1:-ns1.mailbox-dns.example}
      NAMESERVER_2: ${NAMESERVER_2:-ns2.mailbox-dns.example}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.phase8.test}
      MAIL_PUBLIC_IP: ${MAIL_PUBLIC_IP:-}
      MAIL_TLS_MODE: ${MAIL_TLS_MODE:-selfsigned}
      MAIL_OPS_URL: ${MAIL_OPS_URL:-http://postfix:9080}
      MAIL_OPS_TOKEN: ${MAIL_OPS_TOKEN:-development-mail-ops-token-change-me}
      MAIL_OPS_TIMEOUT_SECONDS: ${MAIL_OPS_TIMEOUT_SECONDS:-5}
      WEBMAIL_SESSION_COOKIE_NAME: ${WEBMAIL_SESSION_COOKIE_NAME:-mdns_webmail}
      WEBMAIL_SESSION_TTL_SECONDS: ${WEBMAIL_SESSION_TTL_SECONDS:-28800}
      WEBMAIL_IMAP_HOST: ${WEBMAIL_IMAP_HOST:-dovecot}
      WEBMAIL_IMAP_PORT: ${WEBMAIL_IMAP_PORT:-143}
      WEBMAIL_SMTP_HOST: ${WEBMAIL_SMTP_HOST:-postfix}
      WEBMAIL_SMTP_PORT: ${WEBMAIL_SMTP_PORT:-587}
      WEBMAIL_TRANSPORT_TIMEOUT_SECONDS: ${WEBMAIL_TRANSPORT_TIMEOUT_SECONDS:-15}
      WEBMAIL_LOGIN_MAX_ATTEMPTS: ${WEBMAIL_LOGIN_MAX_ATTEMPTS:-8}
      WEBMAIL_LOGIN_WINDOW_SECONDS: ${WEBMAIL_LOGIN_WINDOW_SECONDS:-900}
      WEBMAIL_LOGIN_LOCK_SECONDS: ${WEBMAIL_LOGIN_LOCK_SECONDS:-900}
      POWERDNS_API_URL: ${POWERDNS_API_URL:-http://powerdns:8081/api/v1}
      POWERDNS_API_KEY: ${POWERDNS_API_KEY:-development-powerdns-api-key-change-me}
      POWERDNS_SERVER_ID: ${POWERDNS_SERVER_ID:-localhost}
      POWERDNS_API_TIMEOUT_SECONDS: ${POWERDNS_API_TIMEOUT_SECONDS:-5}
      POWERDNS_DEFAULT_TTL: ${POWERDNS_DEFAULT_TTL:-3600}
      EXTERNAL_PROVIDER_TIMEOUT_SECONDS: ${EXTERNAL_PROVIDER_TIMEOUT_SECONDS:-20}
      DPO_API_URL: ${DPO_API_URL:-https://secure.3gdirectpay.com/API/v6/}
      DPO_CHECKOUT_URL: ${DPO_CHECKOUT_URL:-https://secure.3gdirectpay.com/payv2.php?ID=}
      DPO_COMPANY_TOKEN: ${DPO_COMPANY_TOKEN:-}
      DPO_SERVICE_TYPE: ${DPO_SERVICE_TYPE:-}
      DPO_REDIRECT_URL: ${DPO_REDIRECT_URL:-http://localhost:3006/billing}
      DPO_BACK_URL: ${DPO_BACK_URL:-http://localhost:8006/api/v1/payments/dpo/callback}
      DPO_PAYMENT_TIME_LIMIT_HOURS: ${DPO_PAYMENT_TIME_LIMIT_HOURS:-48}
      OPENSRS_API_URL: ${OPENSRS_API_URL:-https://rr-n1-tor.opensrs.net:55443/}
      OPENSRS_USERNAME: ${OPENSRS_USERNAME:-}
      OPENSRS_API_KEY: ${OPENSRS_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      powerdns: {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8006}:8000"]
    command: sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [mailbox_dns]

  frontend:
    build:
      context: ./apps/frontend
      target: dev
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8006/api/v1}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend: {condition: service_healthy}
    ports: ["${FRONTEND_PORT:-3006}:3000"]
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [mailbox_dns]

volumes:
  postgres_data:
  redis_data:
  powerdns_data:

networks:
  mailbox_dns:
    driver: bridge
