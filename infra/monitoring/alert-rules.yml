groups:
  - name: mailbox-dns-slo
    interval: 30s
    rules:
      - record: mailbox_dns:slo_availability_7d
        expr: 1 - (sum(increase(mailbox_dns_http_requests_total{status=~"5.."}[7d])) / clamp_min(sum(increase(mailbox_dns_http_requests_total[7d])), 1))
      - record: mailbox_dns:slo_error_budget_remaining_7d
        expr: clamp_max(clamp_min((mailbox_dns:slo_availability_7d - 0.999) / 0.001, 0), 1)
      - record: mailbox_dns:slo_burn_rate_1h
        expr: (sum(increase(mailbox_dns_http_requests_total{status=~"5.."}[1h])) / clamp_min(sum(increase(mailbox_dns_http_requests_total[1h])), 0.001)) / 0.001
      - alert: MailboxDNSSLOFastBurn
        expr: mailbox_dns:slo_burn_rate_1h > 10
        for: 5m
        labels:
          severity: critical
          component: control-plane
        annotations:
          summary: Control-plane error budget is burning faster than 10x
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check 5xx rate, dependency readiness, recent deploys, and database/Redis health.
      - alert: MailboxDNSSLOAvailabilityBreached
        expr: mailbox_dns:slo_availability_7d < 0.999
        for: 15m
        labels:
          severity: warning
          component: control-plane
        annotations:
          summary: Seven-day control-plane availability is below the 99.9 percent objective
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Review error budget, 5xx sources, dependency failures, and incident history.

  - name: mailbox-dns-baseline
    rules:
      - alert: MailboxDNSBackendDown
        expr: up{job="mailbox-dns-backend"} == 0
        for: 2m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: Mailbox-DNS backend is unavailable
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check backend container health, PostgreSQL, Redis, and recent deployments.
      - alert: IthuteAuthUnavailable
        expr: probe_success{job="ithute-auth-health"} == 0
        for: 2m
        labels:
          severity: critical
          component: ithute-auth
        annotations:
          summary: Central !thute Auth health or OIDC discovery is unavailable
          runbook: docs/ITHUTE-AUTH-OPERATIONS.md
          operator_action: Check the ithute-auth and ithute-auth-db containers, signing-key mounts, migrations, DNS/TLS edge, and the latest deployment.
      - alert: MailboxDNSHigh5xxRate
        expr: sum(rate(mailbox_dns_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(mailbox_dns_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: More than 5 percent of control-plane requests are failing
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Identify failing routes and correlate with dependency readiness and logs.
      - alert: MailboxDNSDependencyUnavailable
        expr: mailbox_dns_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
          component: dependency
        annotations:
          summary: A control-plane dependency is unavailable
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Identify the dependency label and restore PostgreSQL or Redis before application changes.
      - alert: MailboxDNSHostDiskNearlyFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: Host filesystem has less than 15 percent free space
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Identify growth source, protect mail and database volumes, then reclaim or expand storage.
      - alert: MailboxDNSSMTPProbeFailed
        expr: probe_success{job="smtp-synthetic"} == 0
        for: 2m
        labels:
          severity: critical
          component: smtp
        annotations:
          summary: SMTP synthetic probe is failing
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check Postfix health, listener, TLS path, queue pressure, and network reachability.
      - alert: MailboxDNSIMAPProbeFailed
        expr: probe_success{job="imap-synthetic"} == 0
        for: 2m
        labels:
          severity: critical
          component: imap
        annotations:
          summary: IMAP synthetic probe is failing
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check Dovecot health, listener, storage availability, and authentication dependencies.
      - alert: MailboxDNSAuthoritativeDNSProbeFailed
        expr: probe_success{job="dns-synthetic"} == 0
        for: 2m
        labels:
          severity: critical
          component: dns
        annotations:
          summary: Authoritative DNS synthetic probe is failing
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check PowerDNS health, database connectivity, authoritative listener, and zone availability.
      - alert: MailboxDNSMailOpsUnavailable
        expr: mailbox_dns_mail_ops_ready == 0
        for: 2m
        labels:
          severity: critical
          component: mail-queue
        annotations:
          summary: Postfix operations endpoint is unavailable
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Check Postfix and the private operations endpoint before modifying queued messages.
      - alert: MailboxDNSDeferredQueueGrowing
        expr: mailbox_dns_mail_queue_deferred > 25
        for: 10m
        labels:
          severity: warning
          component: mail-queue
        annotations:
          summary: More than 25 messages are deferred
          runbook: docs/PHASE-12-INCIDENT-OPERATIONS.md
          operator_action: Inspect deferred reasons, destination patterns, DNS, TLS, reputation, and upstream failures.
      - alert: MailboxDNSBackupLastRunFailed
        expr: mailbox_dns_backup_last_run_success == 0
        for: 10m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: Latest scheduled backup did not report success
          runbook: docs/PHASE-11-DISASTER-RECOVERY.md
          operator_action: Run backup health checks, inspect the repository, and restore successful scheduling immediately.
      - alert: MailboxDNSBackupRecordStale
        expr: mailbox_dns_backup_last_run_age_seconds > 93600
        for: 10m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: Latest scheduled backup record is older than 26 hours
          runbook: docs/PHASE-11-DISASTER-RECOVERY.md
          operator_action: Verify scheduler health, repository reachability, and the most recent usable restore point.
