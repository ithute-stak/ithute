modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
  tcp_connect:
    prober: tcp
    timeout: 5s
  smtp_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^220"
  imap_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^\\* OK"
  dns_authoritative:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: phase12-monitor.test
      query_type: SOA
      valid_rcodes: [NOERROR]
