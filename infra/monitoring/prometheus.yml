global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mailbox-dns-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mailbox-dns-operations
    static_configs:
      - targets: ["ops-exporter:9108"]

  - job_name: ithute-auth-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://ithute-auth:8080/healthz"
          - "http://ithute-auth:8080/.well-known/openid-configuration"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: smtp-synthetic
    metrics_path: /probe
    params:
      module: [smtp_banner]
    static_configs:
      - targets: ["postfix:25"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: imap-synthetic
    metrics_path: /probe
    params:
      module: [imap_banner]
    static_configs:
      - targets: ["dovecot:143"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: dns-synthetic
    metrics_path: /probe
    params:
      module: [dns_authoritative]
    static_configs:
      - targets: ["powerdns:53"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
