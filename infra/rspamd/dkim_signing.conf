enabled = true;
sign_authenticated = true;
sign_local = false;
sign_inbound = false;
use_domain = "header";
use_esld = false;
allow_username_mismatch = false;
allow_hdrfrom_mismatch = false;
# Redis-backed signing still needs fallback enabled so Rspamd constructs the
# signing domain/selector tuple before resolving the per-domain selector and
# private key from selector_prefix/key_prefix hashes.
try_fallback = true;
use_redis = true;
key_prefix = "dkim_keys";
selector_prefix = "dkim_selectors";
