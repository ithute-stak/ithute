name: ithute-mail-node

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    container_name: ithute-mail
    hostname: ${ITHUTE_MAIL_HOSTNAME:?ITHUTE_MAIL_HOSTNAME is required}
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      SSL_TYPE: letsencrypt
      POSTMASTER_ADDRESS: ${ITHUTE_MAIL_POSTMASTER:?ITHUTE_MAIL_POSTMASTER is required}
      ENABLE_FAIL2BAN: "1"
      ENABLE_AMAVIS: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_SPAMASSASSIN: "0"
      SPOOF_PROTECTION: "1"
      POSTFIX_INET_PROTOCOLS: all
      DOVECOT_INET_PROTOCOLS: all
      DMS_CONFIG_POLL: "2"
    volumes:
      - /srv/ithute-mail/data/mail-data:/var/mail
      - /srv/ithute-mail/data/mail-state:/var/mail-state
      - /srv/ithute-mail/data/mail-logs:/var/log/mail
      - /srv/ithute-mail/config:/tmp/docker-mailserver
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp --numeric | grep -Eq ':25[[:space:]]' && ss --listening --tcp --numeric | grep -Eq ':587[[:space:]]' && ss --listening --tcp --numeric | grep -Eq ':993[[:space:]]'"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
