# Central Ithute identity provider. Resolve the service name through Docker DNS
# for every request so Auth container recreation does not leave a stale address.
server {
    listen 80;
    server_name auth.ithute.co.ls;
    client_max_body_size 2m;

    set $ithute_auth_upstream http://ithute-auth:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass $ithute_auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

