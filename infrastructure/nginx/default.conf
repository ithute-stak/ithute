# Consumer/VCL sandbox portal. It deliberately cannot expose platform or product
# super-admin routes; only its dedicated portal API is proxied to the backend.
server {
    listen 80;
    server_name portal.pay.ithute.co.ls;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 /portal; }
    location = /login { return 302 /portal; }
    location ^~ /dashboard { return 404; }

    location ^~ /api/v1/portal/ {
        proxy_pass http://ithute-pay:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location ^~ /api/ { return 404; }

    location / {
        proxy_pass http://ithute-pay:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
