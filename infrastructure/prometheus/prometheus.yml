global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: ithute
    environment: production

scrape_configs:
  - job_name: ithute-node
    static_configs:
      - targets: ["ithute-node-exporter:9100"]

  - job_name: ithute-containers
    static_configs:
      - targets: ["ithute-cadvisor:8080"]
