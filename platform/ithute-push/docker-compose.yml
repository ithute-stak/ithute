services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ithute_push}
      POSTGRES_USER: ${POSTGRES_USER:-ithute_push}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ithute_push_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ithute_push} -d ${POSTGRES_DB:-ithute_push}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    command: ["api"]
    env_file: [.env]
    ports:
      - "8089:8080"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    env_file: [.env]
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ithute_push_postgres:
