manifest_version: "1"
id: mailbox-dns
name: Ithute Mailbox
category: communications
source_path: .
public_url: https://panel.ithute.co.ls
api_url: https://api.ithute.co.ls/api/v1
health_url: https://api.ithute.co.ls/health/ready
services:
  auth: central
  push: central
  realtime: central
  event_bus: central
database:
  ownership: product
  engine: postgresql
deployment:
  mode: isolated
  target: mailbox-primary
  preserve_existing_data: true
capabilities:
  - email
  - dns
  - webmail
  - groupware
  - transactional-email
