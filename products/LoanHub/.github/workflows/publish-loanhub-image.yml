name: Validate, Build and Deploy LoanHub

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: loanhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/lelefe-dc/loanhub-backend
  FRONTEND_IMAGE: ghcr.io/lelefe-dc/loanhub-frontend
  VPS_HOST: 204.12.205.224
  PRODUCTION_API_URL: https://api.loanhub.co.ls/api/v1

jobs:
  quality-gate:
    name: Backend, security, DR, browser E2E and frontend quality gate
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      FERNET_SECRET_KEY: ci-only-fernet-key-not-for-production
      JWT_PRIVATE_KEY_PATH: /tmp/loanhub-ci-jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/loanhub-ci-jwt-public.pem
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/loan_db
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://127.0.0.1:3000
      AUTH_RATE_LIMIT: 5/minute
      TREASURY_AUTO_SUBMIT_ENABLED: 'false'
      MIDNIGHT_REPORTS_ENABLED: 'false'
      COLLECTION_DAILY_REPORT_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loan_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt

      - name: Install backend and security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt

      - name: Generate ephemeral CI JWT keys
        run: |
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          private_key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          Path('/tmp/loanhub-ci-jwt-private.pem').write_bytes(
              private_key.private_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption(),
              )
          )
          Path('/tmp/loanhub-ci-jwt-public.pem').write_bytes(
              private_key.public_key().public_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PublicFormat.SubjectPublicKeyInfo,
              )
          )
          PY

      - name: Repository secret scan
        run: python scripts/secret_scan.py

      - name: Static application security testing
        run: python -m bandit -r apps/backend -x apps/backend/tests -lll

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Compile backend
        working-directory: apps/backend
        run: python -m compileall -q .

      - name: Run critical backend regression suite
        working-directory: apps/backend
        run: |
          python -m pytest -q \
            tests/test_external_debt_tracking.py \
            tests/test_financial_and_tenant_invariants.py \
            tests/test_production_hardening_controls.py \
            tests/test_global_borrower_lookup_frontend.py \
            tests/test_global_borrower_history_print_frontend.py \
            tests/test_fullscreen_borrower_lookup_toolbar_frontend.py \
            tests/test_global_sticky_filter_rollout_frontend.py \
            tests/test_hrms_native_module.py \
            tests/test_hrms_hybrid_navigation_frontend.py

      - name: Run complete backend test suite
        working-directory: apps/backend
        run: python -m pytest -q

      - name: Validate Alembic migration graph on PostgreSQL
        working-directory: apps/backend
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic upgrade head
          python -m alembic current

      - name: Validate double-entry accounting integrity
        run: python scripts/accounting_integrity_check.py

      - name: Install PostgreSQL client for recovery drill
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run PostgreSQL backup and restore disaster-recovery drill
        env:
          PGPASSWORD: postgres
          DRILL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loan_db_drill
        run: |
          createdb -h 127.0.0.1 -U postgres loan_db_drill
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/loan_db bash ./scripts/drill_backup_restore.sh
          dropdb -h 127.0.0.1 -U postgres loan_db_drill

      - name: Type-check frontend
        working-directory: apps/frontend
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: apps/frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: pnpm build

      - name: Install Chromium for browser E2E
        timeout-minutes: 5
        run: python -m playwright install chromium

      - name: Run real browser and API E2E gate
        env:
          LOANHUB_WEB_BASE_URL: http://127.0.0.1:3000
          LOANHUB_API_BASE_URL: http://127.0.0.1:8000
          LOANHUB_E2E_PHONE: '59000000'
          LOANHUB_E2E_PASSWORD: 'CI-LoanHub-E2E-Password-2026!'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          python apps/backend/scripts/create_superadmin.py \
            --phone "$LOANHUB_E2E_PHONE" \
            --email ci-owner@example.com \
            --first-name CI \
            --last-name Owner \
            --password "$LOANHUB_E2E_PASSWORD"
          (
            cd apps/backend
            python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/loanhub-api.log 2>&1 &
            echo $! > /tmp/loanhub-api.pid
          )
          (
            cd apps/frontend
            NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" pnpm dev --hostname 127.0.0.1 > /tmp/loanhub-web.log 2>&1 &
            echo $! > /tmp/loanhub-web.pid
          )
          cleanup() {
            kill "$(cat /tmp/loanhub-api.pid)" "$(cat /tmp/loanhub-web.pid)" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null && break
            sleep 1
          done
          python -m pytest -q apps/backend/tests/e2e/test_browser_lending_journey.py
          python scripts/dast_smoke.py

      - name: Validate deployment scripts and Docker Compose
        run: |
          bash -n scripts/deploy_hostinger.sh
          bash -n scripts/prepare_production_env.sh
          bash -n scripts/production_preflight.sh
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile production config >/dev/null

      - name: Smoke-build production backend image
        run: |
          docker build \
            --pull \
            --progress=plain \
            --tag loanhub-backend-ci:${{ github.sha }} \
            ./apps/backend

      - name: Smoke-build production frontend image
        run: |
          docker build \
            --pull \
            --progress=plain \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.PRODUCTION_API_URL }} \
            --tag loanhub-frontend-ci:${{ github.sha }} \
            ./apps/frontend

  build-and-publish:
    name: Build and publish production images
    if: github.event_name != 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PRODUCTION_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-to-vps:
    name: Deploy published images to LoanHub VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          for name in VPS_USER VPS_SSH_KEY VPS_APP_DIR GHCR_USERNAME GHCR_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured in repository Actions secrets"
              exit 1
            fi
          done

      - name: Copy production manifests to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: compose.yaml,infra/caddy/Caddyfile
          target: /tmp/loanhub-deploy-${{ github.sha }}
          overwrite: true

      - name: Pull images and deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -eu

            APP_DIR='${{ secrets.VPS_APP_DIR }}'
            if [ "$APP_DIR" = "~" ]; then
              APP_DIR="$HOME"
            elif [ "$(printf '%s' "$APP_DIR" | cut -c1-2)" = "~/" ]; then
              APP_DIR="$HOME/$(printf '%s' "$APP_DIR" | cut -c3-)"
            fi

            MANIFEST_DIR='/tmp/loanhub-deploy-${{ github.sha }}'
            MANIFEST="$MANIFEST_DIR/compose.yaml"
            CADDYFILE="$MANIFEST_DIR/infra/caddy/Caddyfile"

            for required in "$MANIFEST" "$CADDYFILE"; do
              if [ ! -f "$required" ]; then
                echo "Deployment file missing: $required" >&2
                find "$MANIFEST_DIR" -maxdepth 4 -type f -print || true
                exit 1
              fi
            done

            mkdir -p "$APP_DIR/infra/caddy" "$APP_DIR/backups" "$APP_DIR/secrets"
            cp "$MANIFEST" "$APP_DIR/compose.yaml"
            cp "$CADDYFILE" "$APP_DIR/infra/caddy/Caddyfile"
            cd "$APP_DIR"

            if [ ! -s .env.production ]; then
              echo 'Missing .env.production on VPS. Run scripts/prepare_production_env.sh once before enabling automatic deployment.' >&2
              exit 1
            fi
            if [ ! -s secrets/jwt_private.pem ] || [ ! -s secrets/jwt_public.pem ]; then
              echo 'Missing production JWT key pair in VPS_APP_DIR/secrets.' >&2
              exit 1
            fi

            set -a
            . ./.env.production
            set +a

            export LOANHUB_ENV_FILE=.env.production
            export LOANHUB_BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}'
            export LOANHUB_FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}'
            export LOANHUB_IMAGE_TAG='${{ github.sha }}'

            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin

            docker compose --env-file .env.production --profile production config -q

            pull_service() {
              service="$1"
              pulled='false'
              for attempt in 1 2 3 4 5; do
                if docker compose --env-file .env.production --profile production pull "$service"; then
                  pulled='true'
                  break
                fi
                if [ "$attempt" -lt 5 ]; then
                  echo "Pull for $service failed (attempt $attempt/5); retrying in 10 seconds..." >&2
                  sleep 10
                fi
              done
              if [ "$pulled" != 'true' ]; then
                echo "Unable to pull $service after 5 attempts" >&2
                exit 1
              fi
            }

            for service in db redis caddy backend frontend; do
              pull_service "$service"
            done

            docker compose --env-file .env.production --profile production up -d --no-build --pull never db redis

            DB_ID="$(docker compose --env-file .env.production --profile production ps -q db)"
            DB_HEALTH=''
            for attempt in $(seq 1 40); do
              DB_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_ID" 2>/dev/null || true)"
              if [ "$DB_HEALTH" = 'healthy' ]; then
                break
              fi
              sleep 2
            done
            if [ "$DB_HEALTH" != 'healthy' ]; then
              echo "PostgreSQL failed health verification: ${DB_HEALTH:-unknown}" >&2
              docker compose --env-file .env.production --profile production logs --tail=200 db
              exit 1
            fi

            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup="backups/loanhub-before-${timestamp}.dump"
            echo "Creating PostgreSQL backup: $backup"
            docker compose --env-file .env.production --profile production exec -T db pg_dump \
              --format=custom \
              --no-owner \
              --no-privileges \
              -U "$DB_USER" \
              "$DB_NAME" > "$backup"
            test -s "$backup"

            echo 'Applying Alembic migrations with the published backend image'
            docker compose --env-file .env.production --profile production up --no-build --pull never migrate

            echo 'Starting LoanHub production services'
            docker compose --env-file .env.production --profile production up -d --no-build --pull never --remove-orphans

            BACKEND_ID="$(docker compose --env-file .env.production --profile production ps -q backend)"
            BACKEND_HEALTH=''
            for attempt in $(seq 1 60); do
              BACKEND_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_ID" 2>/dev/null || true)"
              if [ "$BACKEND_HEALTH" = 'healthy' ]; then
                break
              fi
              sleep 2
            done
            if [ "$BACKEND_HEALTH" != 'healthy' ]; then
              echo "Backend failed health verification: ${BACKEND_HEALTH:-unknown}" >&2
              docker compose --env-file .env.production --profile production logs --tail=250 backend migrate db redis
              exit 1
            fi

            FRONTEND_ID="$(docker compose --env-file .env.production --profile production ps -q frontend)"
            FRONTEND_HEALTH=''
            for attempt in $(seq 1 60); do
              FRONTEND_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$FRONTEND_ID" 2>/dev/null || true)"
              if [ "$FRONTEND_HEALTH" = 'healthy' ]; then
                break
              fi
              sleep 2
            done
            if [ "$FRONTEND_HEALTH" != 'healthy' ]; then
              echo "Frontend failed health verification: ${FRONTEND_HEALTH:-unknown}" >&2
              docker compose --env-file .env.production --profile production logs --tail=250 frontend backend
              exit 1
            fi

            PUBLIC_READY='false'
            for attempt in $(seq 1 60); do
              if curl -fsS --connect-timeout 5 --max-time 10 "https://$APP_DOMAIN/" >/dev/null 2>&1 \
                && curl -fsS --connect-timeout 5 --max-time 10 "https://$API_DOMAIN/health/ready" >/dev/null 2>&1; then
                PUBLIC_READY='true'
                break
              fi
              echo "Waiting for public HTTPS readiness ($attempt/60)..."
              sleep 5
            done
            if [ "$PUBLIC_READY" != 'true' ]; then
              echo 'LoanHub did not become reachable over public HTTPS in time.' >&2
              docker compose --env-file .env.production --profile production logs --tail=250 caddy backend frontend
              exit 1
            fi

            if grep -q '^LOANHUB_IMAGE_TAG=' .env.production; then
              sed -i "s/^LOANHUB_IMAGE_TAG=.*/LOANHUB_IMAGE_TAG=${{ github.sha }}/" .env.production
            else
              printf '\nLOANHUB_IMAGE_TAG=%s\n' '${{ github.sha }}' >> .env.production
            fi

            echo '=== LoanHub production containers ==='
            docker compose --env-file .env.production --profile production ps
            echo '=== Public endpoints ==='
            echo "Frontend: https://$APP_DOMAIN"
            echo "API:      https://$API_DOMAIN"

            rm -rf "$MANIFEST_DIR"
            docker image prune -f
