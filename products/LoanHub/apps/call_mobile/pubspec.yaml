name: loanhub_call_mobile
description: LoanHub business softphone for client calls, contact sync, recording and transfers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_bloc: ^9.1.1
  flutter_contacts: ^2.3.1
  flutter_secure_storage: ^11.0.0
  livekit_client: ^2.10.0
  sqflite: ^2.4.3
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/loanhub-app-icon.png
    - assets/branding/loanhub-horizontal-logo.png
