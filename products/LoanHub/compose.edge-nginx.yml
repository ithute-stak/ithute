services:
  # Keep the legacy definition in compose.yaml disabled. It exists only so a
  # failed first migration can be rolled back from the previous runtime copy.
  caddy:
    profiles: ["legacy-caddy"]

  edge-nginx:
    image: nginx:alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-loanhub.co.ls}
      API_DOMAIN: ${API_DOMAIN:-api.loanhub.co.ls}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.loanhub.co.ls}
      SANDBOX_APP_DOMAIN: ${SANDBOX_APP_DOMAIN:-sandbox.loanhub.co.ls}
      SANDBOX_API_DOMAIN: ${SANDBOX_API_DOMAIN:-api-sandbox.loanhub.co.ls}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx-edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx-edge/ithute-tls.conf:/etc/nginx/snippets/ithute-tls.conf:ro
      - edge_letsencrypt:/etc/letsencrypt:ro
      - edge_certbot_webroot:/var/www/certbot:ro
    # Certbot updates the shared certificate volume. Reload periodically so a
    # renewed certificate becomes active without restarting application stacks.
    command:
      - /bin/sh
      - -c
      - |
        nginx -g 'daemon off;' &
        nginx_pid=$$!
        while kill -0 "$$nginx_pid" 2>/dev/null; do
          sleep 21600 & wait $$! || true
          nginx -s reload || true
        done &
        wait "$$nginx_pid"
    networks: [loanhub, sandbox, mailbox_dns_shared]

  certbot:
    image: certbot/certbot:latest
    profiles: ["production"]
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 43200 & wait $$! || true
        done
    volumes:
      - edge_letsencrypt:/etc/letsencrypt
      - edge_certbot_webroot:/var/www/certbot

volumes:
  edge_letsencrypt:
  edge_certbot_webroot:
