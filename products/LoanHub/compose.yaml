name: ${COMPOSE_PROJECT_NAME:-loanhub}

x-backend-build: &backend-build
  image: ${LOANHUB_BACKEND_IMAGE:-loanhub-backend}:${LOANHUB_IMAGE_TAG:-local}
  build:
    context: ./apps/backend
    dockerfile: Dockerfile

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Maseru}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-loan_db}
  DB_USER: ${DB_USER:-loanhub}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected env file}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
  FILE_STORAGE_PATH: /app/media/uploads
  RUN_MIGRATIONS: "false"

x-sandbox-backend-environment: &sandbox-backend-environment
  ENVIRONMENT: production
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Maseru}
  PUBLIC_APP_URL: https://${SANDBOX_APP_DOMAIN:-sandbox.loanhub.co.ls}
  SANDBOX_MODE: "true"
  SANDBOX_ROLE_SWITCH_ENABLED: "true"
  SANDBOX_LOGIN_PHONE: "12345678"
  SANDBOX_LOGIN_PASSWORD: "1234567890"
  DB_HOST: sandbox_db
  DB_PORT: 5432
  DB_NAME: loanhub_sandbox
  DB_USER: ${DB_USER:-loanhub}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected env file}
  REDIS_URL: redis://sandbox_redis:6379/0
  REDIS_REALTIME_CHANNEL: loanhub:sandbox:realtime
  HTTP_CACHE_NAMESPACE: loanhub:sandbox:http-cache:v1
  CORS_ORIGINS: https://${SANDBOX_APP_DOMAIN:-sandbox.loanhub.co.ls}
  JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
  FILE_STORAGE_PATH: /app/media/uploads
  RUN_MIGRATIONS: "false"
  BOOTSTRAP_SUPERADMIN_ENABLED: "false"
  ENABLE_ROLE_IMPERSONATION: "false"
  TREASURY_AUTO_SUBMIT_ENABLED: "false"
  MIDNIGHT_REPORTS_ENABLED: "false"
  COLLECTION_DAILY_REPORT_ENABLED: "false"
  LELEFAPAYGATE_ENABLED: "false"
  CALL_MEDIA_PROVIDER: disabled
  MALWARE_SCAN_ENABLED: "false"
  METRICS_ENABLED: "false"
  SENTRY_DSN: ""

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-loan_db}
      POSTGRES_USER: ${DB_USER:-loanhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loanhub} -d ${DB_NAME:-loan_db}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [loanhub]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [loanhub]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["scale-out"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loanhub-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [loanhub]

  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [loanhub]

  migrate:
    <<: *backend-build
    restart: "no"
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    networks: [loanhub]

  backend:
    <<: *backend-build
    restart: unless-stopped
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *backend-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
      - loanhub_files:/app/media
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [loanhub]

  maintenance:
    <<: *backend-build
    restart: unless-stopped
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *backend-environment
    command: ["python", "docker/maintenance.py"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
      - loanhub_files:/app/media
    networks: [loanhub]

  frontend:
    image: ${LOANHUB_FRONTEND_IMAGE:-loanhub-frontend}:${LOANHUB_IMAGE_TAG:-local}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [loanhub]

  sandbox_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loanhub_sandbox
      POSTGRES_USER: ${DB_USER:-loanhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected env file}
    volumes:
      - sandbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loanhub} -d loanhub_sandbox"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [sandbox]

  sandbox_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - sandbox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sandbox]

  sandbox_migrate:
    <<: *backend-build
    restart: "no"
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *sandbox-backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      sandbox_db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    networks: [sandbox]

  sandbox_seed:
    <<: *backend-build
    restart: "no"
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *sandbox-backend-environment
    command: ["python", "scripts/seed_sandbox.py"]
    depends_on:
      sandbox_migrate:
        condition: service_completed_successfully
    volumes:
      - ./secrets:/app/secrets:ro
    networks: [sandbox]

  sandbox_backend:
    <<: *backend-build
    restart: unless-stopped
    env_file: ${LOANHUB_ENV_FILE:-.env}
    environment:
      <<: *sandbox-backend-environment
      WEB_CONCURRENCY: "1"
    depends_on:
      sandbox_seed:
        condition: service_completed_successfully
      sandbox_redis:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
      - sandbox_files:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [sandbox]

  sandbox_frontend:
    image: ${LOANHUB_FRONTEND_IMAGE:-loanhub-frontend}:${LOANHUB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      sandbox_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [sandbox]

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-loanhub.co.ls}
      API_DOMAIN: ${API_DOMAIN:-api.loanhub.co.ls}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.loanhub.co.ls}
      SANDBOX_APP_DOMAIN: ${SANDBOX_APP_DOMAIN:-sandbox.loanhub.co.ls}
      SANDBOX_API_DOMAIN: ${SANDBOX_API_DOMAIN:-api-sandbox.loanhub.co.ls}
      TLS_EMAIL: ${TLS_EMAIL:-admin@example.com}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [loanhub, sandbox, mailbox_dns_shared]

networks:
  loanhub:
    driver: bridge
  sandbox:
    driver: bridge
    internal: true
  mailbox_dns_shared:
    external: true
    name: mailbox-dns_mailbox_dns

volumes:
  postgres_data:
  redis_data:
  loanhub_files:
  sandbox_postgres_data:
  sandbox_redis_data:
  sandbox_files:
  minio_data:
  clamav_data:
  caddy_data:
  caddy_config:
