name: loanhub

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  SECRET_KEY: ${SECRET_KEY}
  FERNET_SECRET_KEY: ${FERNET_SECRET_KEY}
  CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY}
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
  FILE_ENCRYPTION_ENABLED: "true"
  JWT_PRIVATE_KEY_PATH: /run/host-secrets/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /run/host-secrets/jwt_public.pem
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: https://${APP_DOMAIN}
  PUBLIC_APP_URL: https://${APP_DOMAIN}
  FILE_STORAGE_PATH: /app/media/uploads
  APP_TIMEZONE: Africa/Maseru
  MIDNIGHT_REPORTS_ENABLED: "true"
  MIDNIGHT_REPORT_FORMATS: pdf,csv
  ENABLE_ROLE_IMPERSONATION: "true"
  PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-false}
  PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Maseru
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [loanhub]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [loanhub]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: ./apps/backend
    image: loanhub-backend:${RELEASE_TAG:-local}
    restart: "no"
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/run/host-secrets:ro
    networks: [loanhub]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./apps/backend
    image: loanhub-backend:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/run/host-secrets:ro
      - media_data:/app/media
    expose: ["8000"]
    networks: [loanhub]
    init: true
    security_opt: ["no-new-privileges:true"]

  maintenance:
    image: loanhub-backend:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment: *backend-environment
    command: ["python", "docker/maintenance.py"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./secrets:/run/host-secrets:ro
      - media_data:/app/media
    networks: [loanhub]
    init: true
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    image: loanhub-frontend:${RELEASE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    networks: [loanhub]
    init: true
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [loanhub]
    security_opt: ["no-new-privileges:true"]

networks:
  loanhub:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
