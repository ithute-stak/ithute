name: Deploy LoanHub to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: loanhub-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r apps/backend/requirements.txt
      - name: Backend compile and migration graph
        working-directory: apps/backend
        env:
          SECRET_KEY: validation-secret
          FERNET_SECRET_KEY: validation-fernet
          CHAT_ENCRYPTION_KEY: validation-chat
          FILE_ENCRYPTION_KEY: validation-file
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.github/test-secrets/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/.github/test-secrets/jwt_public.pem
        run: |
          mkdir -p ${{ github.workspace }}/.github/test-secrets
          openssl genpkey -algorithm RSA -out "$JWT_PRIVATE_KEY_PATH" -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in "$JWT_PRIVATE_KEY_PATH" -out "$JWT_PUBLIC_KEY_PATH"
          python -m compileall -q .
          python scripts/validate_release.py
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head --sql >/tmp/upgrade.sql
          alembic downgrade f1a9c4e7b620:base --sql >/tmp/downgrade.sql
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Frontend typecheck and build
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Validate Compose
        run: docker compose config >/dev/null

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy committed release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && ./scripts/deploy_hostinger.sh"
