manifest_version: "1"
id: loanhub
name: LoanHub
category: financial-services
source_path: products/LoanHub
public_url: https://loanhub.co.ls
api_url: https://api.loanhub.co.ls/api/v1
health_url: https://api.loanhub.co.ls/health/ready
services:
  auth: central
  push: central
  realtime: central
  event_bus: central
database:
  ownership: product
  engine: postgresql
  volume: postgres_data
deployment:
  mode: isolated
  host: 204.12.205.224
  platform_root: /home/administrator/mailbox-dns
  runtime_path: /home/administrator/mailbox-dns/loanhub
  legacy_runtime_path: /opt/loanhub
  preserve_existing_data: true
  require_pre_migration_backup: true
  reject_unexpected_volume_change: true
capabilities:
  - lending
  - accounting
  - collections
  - hrms
  - treasury
  - documents
  - reporting
