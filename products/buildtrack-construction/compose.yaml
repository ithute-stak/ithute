name: ${COMPOSE_PROJECT_NAME:-buildtrack}

# Local development intentionally has safe-to-replace defaults so the entire
# stack can be started with one command: `docker compose up --build`.
# Production/VPS deployments should override DB_PASSWORD and public URLs in .env.
x-backend-build: &backend-build
  build:
    context: ./apps/backend
    dockerfile: Dockerfile
  image: buildtrack-backend:${BUILDTRACK_IMAGE_TAG:-local}

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Maseru}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3004}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-buildtrack}
  DB_USER: ${DB_USER:-buildtrack}
  DB_PASSWORD: ${DB_PASSWORD:-buildtrack-local-dev-only}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MEDIA_ROOT: /app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-buildtrack}
      POSTGRES_USER: ${DB_USER:-buildtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buildtrack-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buildtrack} -d ${DB_NAME:-buildtrack}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s

  migrate:
    <<: *backend-build
    restart: "no"
    environment:
      <<: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-build
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8004:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: buildtrack-frontend:${BUILDTRACK_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BUILDTRACK_BACKEND_URL: ${BUILDTRACK_BACKEND_URL:-http://backend:8000/api/v1}
    ports:
      - "3004:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
