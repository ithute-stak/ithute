[project]
name = "ithute-pay-bridge-backend"
version = "1.0.0"
description = "Standalone multi-tenant payment gateway API by Ithute Solutions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "SQLAlchemy>=2.0.41,<3.0",
  "alembic>=1.16.4,<2.0",
  "psycopg[binary]>=3.2.9,<4.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "argon2-cffi>=23,<26",
  "httpx>=0.28,<1.0",
  "cryptography>=45,<47",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "websockets>=14,<17",
  "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
