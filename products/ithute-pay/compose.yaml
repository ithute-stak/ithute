name: ${COMPOSE_PROJECT_NAME:-ithute-pay}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-paybridge}
      POSTGRES_USER: ${DB_USER:-paybridge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - paybridge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paybridge} -d ${DB_NAME:-paybridge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [ithute_pay_private]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - paybridge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ithute_pay_private]

  ithute-pay-bridge:
    image: ${IPB_IMAGE:-ithute-pay-bridge:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://127.0.0.1:8001
        NEXT_PUBLIC_API_BASE: /api/v1
        NEXT_PUBLIC_PARTNER_API_BASE: /api/v1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-paybridge}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-paybridge}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost:8081}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8081}
      PORTAL_APP_URL: ${PORTAL_URL:-http://localhost:8081/portal}
      BACKEND_INTERNAL_URL: http://127.0.0.1:8001
      RUN_MIGRATIONS_ON_START: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks: [ithute_pay_private, ithute_pay_app]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ithute-pay-bridge]
    ports:
      - "${PUBLIC_PORT:-8081}:80"
    restart: unless-stopped
    networks: [ithute_pay_app]

networks:
  ithute_pay_private:
    driver: bridge
    internal: true
  ithute_pay_app:
    driver: bridge

volumes:
  paybridge_postgres:
  paybridge_redis:
