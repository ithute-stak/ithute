# Production-only attachment to the existing Ithute shared HTTPS edge.
# Product data services remain isolated; only backend/frontend join the shared
# mailbox network under unique NBros aliases used by edge Nginx.
services:
  backend:
    networks:
      nbros_private:
      nbros_app:
      ithute_edge:
        aliases:
          - nbros-backend

  frontend:
    networks:
      nbros_app:
      ithute_edge:
        aliases:
          - nbros-frontend

networks:
  ithute_edge:
    external: true
    name: ${ITHUTE_MAILBOX_NETWORK_NAME:-mailbox-dns_mailbox_dns}
