name: ${COMPOSE_PROJECT_NAME:-nbros}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NBROS_DB_NAME:-nbros}
      POSTGRES_USER: ${NBROS_DB_USER:-nbros}
      POSTGRES_PASSWORD: ${NBROS_DB_PASSWORD:?Set NBROS_DB_PASSWORD in .env}
    volumes:
      - nbros_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NBROS_DB_USER:-nbros} -d ${NBROS_DB_NAME:-nbros}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nbros_private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nbros_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nbros_private]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ${NBROS_BACKEND_IMAGE:-nbros-backend:local}
    restart: unless-stopped
    init: true
    environment:
      NBROS_DATABASE_URL: postgresql+psycopg://${NBROS_DB_USER:-nbros}:${NBROS_DB_PASSWORD:?Set NBROS_DB_PASSWORD in .env}@db:5432/${NBROS_DB_NAME:-nbros}
      NBROS_REDIS_URL: redis://redis:6379/0
      NBROS_PUBLIC_URL: ${NBROS_PUBLIC_URL:-https://nbro.ithute.co.ls}
      NBROS_AUTH_ISSUER: ${NBROS_AUTH_ISSUER:-https://auth.ithute.co.ls}
      NBROS_AUTH_AUDIENCE: nbros
      NBROS_AUTH_JWKS_URL: ${NBROS_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
      NBROS_BOOTSTRAP_ADMIN_EMAIL: ${NBROS_BOOTSTRAP_ADMIN_EMAIL:-justy@ithute.co.ls}
      NBROS_UPLOAD_DIR: /data/uploads
      NBROS_MAX_UPLOAD_BYTES: ${NBROS_MAX_UPLOAD_BYTES:-10485760}
      NBROS_AI_ENABLED: ${NBROS_AI_ENABLED:-false}
      NBROS_AI_BASE_URL: ${NBROS_AI_BASE_URL:-}
      NBROS_AI_MODEL: ${NBROS_AI_MODEL:-}
      NBROS_AI_API_KEY: ${NBROS_AI_API_KEY:-}
      NBROS_AI_TIMEOUT_SECONDS: ${NBROS_AI_TIMEOUT_SECONDS:-30}
    volumes:
      - nbros_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NBROS_BACKEND_PORT:-8203}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [nbros_private, nbros_app]

  fleet-monitor:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ${NBROS_BACKEND_IMAGE:-nbros-backend:local}
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.fleet_monitor"]
    environment:
      NBROS_DATABASE_URL: postgresql+psycopg://${NBROS_DB_USER:-nbros}:${NBROS_DB_PASSWORD:?Set NBROS_DB_PASSWORD in .env}@db:5432/${NBROS_DB_NAME:-nbros}
      NBROS_REDIS_URL: redis://redis:6379/0
      NBROS_PUBLIC_URL: ${NBROS_PUBLIC_URL:-https://nbro.ithute.co.ls}
      NBROS_AUTH_ISSUER: ${NBROS_AUTH_ISSUER:-https://auth.ithute.co.ls}
      NBROS_AUTH_AUDIENCE: nbros
      NBROS_AUTH_JWKS_URL: ${NBROS_AUTH_JWKS_URL:-https://auth.ithute.co.ls/.well-known/jwks.json}
      NBROS_AUTH_SERVICE_TOKEN_URL: ${NBROS_AUTH_SERVICE_TOKEN_URL:-https://auth.ithute.co.ls/v1/auth/service-token}
      NBROS_BOOTSTRAP_ADMIN_EMAIL: ${NBROS_BOOTSTRAP_ADMIN_EMAIL:-justy@ithute.co.ls}
      NBROS_REALTIME_PUBLIC_URL: ${NBROS_REALTIME_PUBLIC_URL:-https://realtime.ithute.co.ls}
      NBROS_REALTIME_SERVICE_CLIENT_SECRET: ${NBROS_REALTIME_SERVICE_CLIENT_SECRET:-}
      NBROS_REALTIME_PUBLISH_ENABLED: ${NBROS_REALTIME_PUBLISH_ENABLED:-true}
      NBROS_FLEET_MONITOR_INTERVAL_SECONDS: ${NBROS_FLEET_MONITOR_INTERVAL_SECONDS:-60}
      NBROS_FLEET_MONITOR_LOCK_SECONDS: ${NBROS_FLEET_MONITOR_LOCK_SECONDS:-120}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nbros_private, nbros_app]

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: ${NBROS_FRONTEND_IMAGE:-nbros-frontend:local}
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NBROS_PUBLIC_URL: ${NBROS_PUBLIC_URL:-https://nbro.ithute.co.ls}
      NBROS_AUTH_ISSUER: ${NBROS_AUTH_ISSUER:-https://auth.ithute.co.ls}
      NBROS_AUTH_CLIENT_ID: nbros
      NBROS_OIDC_REDIRECT_URI: ${NBROS_OIDC_REDIRECT_URI:-https://nbro.ithute.co.ls/api/auth/oidc/callback}
      NBROS_COOKIE_SECURE: ${NBROS_COOKIE_SECURE:-true}
      NBROS_REALTIME_WS_URL: ${NBROS_REALTIME_WS_URL:-wss://realtime.ithute.co.ls/v1/ws}
      NBROS_BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NBROS_FRONTEND_PORT:-3203}:3000"
    networks: [nbros_app]

networks:
  nbros_private:
    driver: bridge
    internal: true
  nbros_app:
    driver: bridge

volumes:
  nbros_postgres:
  nbros_redis:
  nbros_uploads:
